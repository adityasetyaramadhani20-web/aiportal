<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikhlas</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    
    <!-- Font Inter & Amiri (untuk Arab) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0fdf4; }
        .font-arab { font-family: 'Amiri', serif; }
        
        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        
        /* Tasbih Animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .tasbih-active { animation: pulse-ring 0.2s cubic-bezier(0.4, 0, 0.6, 1); }

        .tab-button.active { color: #059669; background-color: #ecfdf5; }
        .tab-button.inactive { color: #9ca3af; }
    </style>
</head>
<body class="bg-emerald-50/50 min-h-screen flex justify-center items-center font-sans p-0 md:p-6 lg:p-10 relative">

    <!-- App Container -->
    <div class="w-full max-w-md md:max-w-6xl bg-white h-screen md:h-[90vh] md:rounded-[2rem] shadow-2xl relative overflow-hidden flex flex-col md:flex-row border border-emerald-100">
        
        <!-- Desktop Sidebar Navigation (Hidden on Mobile) -->
        <aside class="hidden md:flex md:flex-col md:w-64 bg-white border-r border-emerald-100 p-6 flex-shrink-0 justify-between">
            <div>
                <!-- Brand / Logo -->
                <div class="flex items-center gap-3 mb-8 px-2">
                    <div class="bg-emerald-600 text-white p-2.5 rounded-2xl shadow-md flex items-center justify-center">
                        <i data-lucide="moon-star" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-800">Ikhlas</h1>
                        <p class="text-[10px] text-emerald-600 font-bold uppercase tracking-wider">Jurnal & Ibadah</p>
                    </div>
                </div>

                <!-- Navigation List -->
                <nav class="flex flex-col gap-1.5">
                    <button onclick="switchTab('home')" data-tab="home" class="tab-button flex items-center gap-3.5 px-4 py-3 rounded-xl text-sm font-semibold transition-all hover:bg-emerald-50/50 text-left">
                        <i data-lucide="home" class="w-5 h-5"></i> <span>Beranda</span>
                    </button>
                    <button onclick="switchTab('tracker')" data-tab="tracker" class="tab-button flex items-center gap-3.5 px-4 py-3 rounded-xl text-sm font-semibold transition-all hover:bg-emerald-50/50 text-left">
                        <i data-lucide="activity" class="w-5 h-5"></i> <span>Jurnal</span>
                    </button>
                    <button onclick="switchTab('ibadah')" data-tab="ibadah" class="tab-button flex items-center gap-3.5 px-4 py-3 rounded-xl text-sm font-semibold transition-all hover:bg-emerald-50/50 text-left">
                        <i data-lucide="moon-star" class="w-5 h-5"></i> <span>Ibadah</span>
                    </button>
                    <button onclick="switchTab('calendar')" data-tab="calendar" class="tab-button flex items-center gap-3.5 px-4 py-3 rounded-xl text-sm font-semibold transition-all hover:bg-emerald-50/50 text-left">
                        <i data-lucide="calendar" class="w-5 h-5"></i> <span>Kalender</span>
                    </button>
                    <button onclick="switchTab('guide')" data-tab="guide" class="tab-button flex items-center gap-3.5 px-4 py-3 rounded-xl text-sm font-semibold transition-all hover:bg-emerald-50/50 text-left">
                        <i data-lucide="book-open" class="w-5 h-5"></i> <span>Wawasan</span>
                    </button>
                </nav>
            </div>

            <!-- Footer Sidebar -->
            <div class="text-[10px] text-gray-400 font-semibold px-4 border-t border-gray-100 pt-4">
                Versi 2.0.0
            </div>
        </aside>

        <!-- Main Workspace Area -->
        <div class="flex-1 flex flex-col h-full overflow-hidden relative">
            
            <!-- Content Area -->
            <div id="main-content" class="flex-1 overflow-y-auto no-scrollbar pb-24 md:pb-8 bg-gray-50/50">
                <!-- Content injected via JS -->
            </div>

            <!-- Bottom Navigation (Mobile Only) -->
            <nav class="md:hidden absolute bottom-0 w-full bg-white/95 backdrop-blur-md border-t border-gray-100 py-3 px-4 flex justify-between items-center z-50 text-[10px] font-medium shadow-[0_-5px_15px_rgba(0,0,0,0.02)]">
                <button onclick="switchTab('home')" data-tab="home" class="tab-button flex flex-col items-center gap-1.5 p-2 rounded-xl flex-1 transition-all hover:bg-gray-50">
                    <i data-lucide="home" class="w-5 h-5"></i> <span>Beranda</span>
                </button>
                <button onclick="switchTab('tracker')" data-tab="tracker" class="tab-button flex flex-col items-center gap-1.5 p-2 rounded-xl flex-1 transition-all hover:bg-gray-50">
                    <i data-lucide="activity" class="w-5 h-5"></i> <span>Jurnal</span>
                </button>
                <button onclick="switchTab('ibadah')" data-tab="ibadah" class="tab-button flex flex-col items-center gap-1.5 p-2 rounded-xl flex-1 transition-all hover:bg-gray-50">
                    <i data-lucide="moon-star" class="w-5 h-5"></i> <span>Ibadah</span>
                </button>
                <button onclick="switchTab('calendar')" data-tab="calendar" class="tab-button flex flex-col items-center gap-1.5 p-2 rounded-xl flex-1 transition-all hover:bg-gray-50">
                    <i data-lucide="calendar" class="w-5 h-5"></i> <span>Kalender</span>
                </button>
                <button onclick="switchTab('guide')" data-tab="guide" class="tab-button flex flex-col items-center gap-1.5 p-2 rounded-xl flex-1 transition-all hover:bg-gray-50">
                    <i data-lucide="book-open" class="w-5 h-5"></i> <span>Wawasan</span>
                </button>
            </nav>
        </div>

        <!-- Hidden Input for Import -->
        <input type="file" id="import-input" class="hidden" accept=".json" onchange="handleFileImport(event)">
    </div>

    <!-- Custom Dialog / Modal Overlay -->
    <div id="custom-modal" class="fixed inset-0 z-[100] bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 hidden opacity-0 transition-all duration-200">
        <div id="custom-modal-body" class="w-full max-w-sm bg-white rounded-3xl shadow-2xl border border-emerald-50 transform scale-95 transition-all duration-200 modal-content-card overflow-hidden">
            <!-- Modal Content Injected via JS -->
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- STATE & CONFIG ---
        const APP_VERSION = '2.0.0';
        const STORAGE_KEY = 'ikhlas_data_v2';
        
        let state = {
            activeTab: 'home',
            trackerData: [], // Array progress harian
            events: [], // Array event kalender {date: 'YYYY-MM-DD', title: ''}
            
            // Ibadah State
            city: 'Jakarta',
            country: 'Indonesia',
            prayerTimes: null,
            ibadahSubTab: 'prayer', // 'prayer', 'quran', 'tasbih'
            manualOffsets: { imsak:0, subuh:0, dzuhur:0, ashar:0, maghrib:0, isya:0 },
            
            // Quran State
            surahList: [],
            isQuranLoading: false,
            
            // Tasbih State
            tasbihCount: 0,
            tasbihTarget: 33, // 33 atau 99
            
            // Guide State
            activeGuideSection: 'niat',

            // Calendar State
            currentCalendarDate: new Date()
        };

        // --- CORE FUNCTIONS ---
        function init() {
            try {
                // Migrasi dari Diarama jika ada, atau load Ikhlas
                const oldData = localStorage.getItem('diarama_tracker_v1');
                const newData = localStorage.getItem(STORAGE_KEY);

                if (newData) {
                    const parsed = JSON.parse(newData);
                    state = { ...state, ...parsed };
                    // Reset UI state yang tidak perlu disimpan
                    state.activeTab = 'home';
                    state.isQuranLoading = false;
                } else if (oldData) {
                    // Migrasi sederhana
                    state.trackerData = JSON.parse(oldData);
                    localStorage.removeItem('diarama_tracker_v1'); // Cleanup old
                } else {
                    // Inisialisasi Data Baru (30 hari default)
                    generateEmptyTracker();
                }

                // Restore Date Object for calendar
                state.currentCalendarDate = new Date(); 

                switchTab('home');
            } catch (error) {
                console.error("Init Error:", error);
                generateEmptyTracker();
                switchTab('home');
            }
        }

        function generateEmptyTracker() {
            state.trackerData = Array.from({ length: 30 }, (_, i) => ({
                day: i + 1,
                fasting: false,
                prayers: { subuh: false, dzuhur: false, ashar: false, maghrib: false, isya: false },
                tarawih: false,
                quran: false
            }));
        }

        function saveData() {
            // Kita simpan bagian penting saja, hindari menyimpan UI state
            const dataToSave = {
                trackerData: state.trackerData,
                city: state.city,
                country: state.country,
                manualOffsets: state.manualOffsets,
                events: state.events || [],
                tasbihCount: state.tasbihCount
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
            renderContent();
        }

        function switchTab(tabName) {
            state.activeTab = tabName;
            
            // Update UI Nav (Baik navigasi bawah mobile maupun sidebar desktop)
            document.querySelectorAll('[data-tab]').forEach(btn => {
                if (btn.getAttribute('data-tab') === tabName) {
                    btn.classList.add('active');
                    btn.classList.remove('inactive');
                } else {
                    btn.classList.remove('active');
                    btn.classList.add('inactive');
                }
            });

            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('main-content');
            if (!container) return;
            
            container.innerHTML = '';

            switch (state.activeTab) {
                case 'home': container.innerHTML = getHomeHTML(); break;
                case 'tracker': container.innerHTML = getTrackerHTML(); break;
                case 'ibadah': 
                    container.innerHTML = getIbadahHTML(); 
                    if(state.ibadahSubTab === 'prayer' && !state.prayerTimes) fetchPrayerTimes();
                    if(state.ibadahSubTab === 'quran' && state.surahList.length === 0) fetchSurahList();
                    break;
                case 'calendar': container.innerHTML = getCalendarHTML(); break;
                case 'guide': container.innerHTML = getGuideHTML(); break;
            }

            if (window.lucide) lucide.createIcons();
            else setTimeout(() => { if(window.lucide) lucide.createIcons(); }, 500);
        }

        // --- 1. HOME VIEW ---
        function getHomeHTML() {
            const progress = calculateProgress();
            
            // Get Hijri Date String
            const today = new Date();
            const hijriDate = new Intl.DateTimeFormat('id-ID-u-ca-islamic', {
                day: 'numeric', month: 'long', year: 'numeric'
            }).format(today);

            return `
                <div class="animate-fade-in max-w-4xl mx-auto py-4 md:py-8">
                    <!-- Header -->
                    <div class="bg-gradient-to-br from-emerald-600 to-teal-700 text-white p-6 md:p-8 rounded-[2rem] shadow-xl mb-6 relative overflow-hidden mx-4 md:mx-6">
                        <div class="absolute top-0 right-0 p-4 opacity-10 transform translate-x-4 -translate-y-4">
                             <i data-lucide="moon-star" class="w-32 h-32"></i>
                        </div>
                        
                        <div class="relative z-10">
                            <div class="flex items-center gap-2 mb-1 opacity-90">
                                <span class="text-xs font-semibold bg-emerald-800/50 px-2 py-1 rounded-lg border border-emerald-500/30">Versi ${APP_VERSION}</span>
                            </div>
                            <h1 class="text-3xl font-bold flex items-center gap-2 mb-1">
                                Ikhlas
                            </h1>
                            <p class="text-emerald-100 text-sm mb-4 font-medium opacity-90">${hijriDate}</p>

                            <!-- Progress Card -->
                            <div class="bg-white/10 backdrop-blur-sm p-4 rounded-2xl border border-white/20">
                                <div class="flex justify-between items-end mb-2">
                                    <span class="text-xs font-medium text-emerald-50">Progres Ibadah</span>
                                    <span class="text-2xl font-bold text-yellow-300">${progress}%</span>
                                </div>
                                <div class="w-full bg-emerald-900/40 rounded-full h-2">
                                    <div class="bg-yellow-400 h-2 rounded-full transition-all duration-1000 ease-out shadow-[0_0_10px_rgba(250,204,21,0.5)]" style="width: ${progress}%"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Menu Grid -->
                    <div class="px-6 pb-20">
                        <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
                            <i data-lucide="grid" class="w-4 h-4 text-emerald-500"></i> Menu Cepat
                        </h3>
                        
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                            <button onclick="switchTab('tracker')" class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-50 hover:border-emerald-200 transition text-left group">
                                <div class="bg-blue-50 w-10 h-10 rounded-full flex items-center justify-center mb-3 group-hover:scale-110 transition">
                                    <i data-lucide="check-circle-2" class="text-blue-600 w-5 h-5"></i>
                                </div>
                                <div class="font-bold text-gray-700">Jurnal</div>
                                <div class="text-[10px] text-gray-400">Catat harianmu</div>
                            </button>

                            <button onclick="{state.ibadahSubTab='tasbih'; switchTab('ibadah');}" class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-50 hover:border-emerald-200 transition text-left group">
                                <div class="bg-purple-50 w-10 h-10 rounded-full flex items-center justify-center mb-3 group-hover:scale-110 transition">
                                    <i data-lucide="fingerprint" class="text-purple-600 w-5 h-5"></i>
                                </div>
                                <div class="font-bold text-gray-700">Tasbih</div>
                                <div class="text-[10px] text-gray-400">Zikir digital</div>
                            </button>

                            <button onclick="{state.ibadahSubTab='prayer'; switchTab('ibadah');}" class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-50 hover:border-emerald-200 transition text-left group">
                                <div class="bg-orange-50 w-10 h-10 rounded-full flex items-center justify-center mb-3 group-hover:scale-110 transition">
                                    <i data-lucide="clock" class="text-orange-600 w-5 h-5"></i>
                                </div>
                                <div class="font-bold text-gray-700">Jadwal</div>
                                <div class="text-[10px] text-gray-400">Waktu sholat</div>
                            </button>

                            <button onclick="switchTab('calendar')" class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-50 hover:border-emerald-200 transition text-left group">
                                <div class="bg-emerald-50 w-10 h-10 rounded-full flex items-center justify-center mb-3 group-hover:scale-110 transition">
                                    <i data-lucide="calendar-days" class="text-emerald-600 w-5 h-5"></i>
                                </div>
                                <div class="font-bold text-gray-700">Kalender</div>
                                <div class="text-[10px] text-gray-400">Agenda Hijriah</div>
                            </button>
                        </div>

                        <!-- Quote Card -->
                        <div class="bg-gradient-to-r from-orange-50 to-amber-50 p-5 rounded-2xl border border-orange-100 relative overflow-hidden">
                            <i data-lucide="quote" class="absolute top-2 right-2 text-orange-200 w-12 h-12 rotate-180"></i>
                            <p class="text-orange-900/80 italic text-sm font-medium relative z-10">"Amalan yang paling dicintai Allah adalah amalan yang langgeng (terus menerus) meskipun sedikit."</p>
                            <p class="text-xs text-orange-400 mt-2 font-bold">— HR. Bukhari & Muslim</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 2. TRACKER VIEW (Export/Import) ---
        function getTrackerHTML() {
            // Find currently selected day or default to Day 1
            if(!state.selectedDay) state.selectedDay = 1;
            const currentData = state.trackerData[state.selectedDay - 1];
            
            // Generate Day Buttons
            let daysHTML = state.trackerData.map(d => {
                const isActive = state.selectedDay === d.day;
                const isFull = getDayProgress(d.day - 1) === 100;
                return `
                    <button onclick="selectDay(${d.day})" class="flex-shrink-0 w-14 h-20 rounded-2xl flex flex-col items-center justify-center gap-1 transition-all border-2 ${isActive ? 'bg-emerald-600 text-white border-emerald-600 shadow-lg scale-105' : 'bg-white text-gray-400 border-gray-100 hover:border-emerald-200'}">
                        <span class="text-[10px] font-medium uppercase tracking-wide">Hari</span>
                        <span class="font-bold text-xl">${d.day}</span>
                        <div class="w-1.5 h-1.5 rounded-full ${isFull ? 'bg-yellow-400' : (isActive ? 'bg-emerald-400' : 'bg-gray-200')}"></div>
                    </button>
                `;
            }).join('');

            return `
                <div class="animate-fade-in max-w-5xl mx-auto">
                    <!-- Sticky Header -->
                    <div class="bg-white/95 backdrop-blur sticky top-0 z-20 px-6 py-4 border-b border-gray-100 flex justify-between items-center shadow-sm">
                        <h1 class="text-xl font-bold text-gray-800">Jurnal Ibadah</h1>
                        <div class="flex gap-2">
                             <button onclick="exportData()" class="p-2 text-gray-500 hover:text-emerald-600 hover:bg-emerald-50 rounded-lg transition" title="Backup Data">
                                <i data-lucide="download" class="w-5 h-5"></i>
                            </button>
                             <button onclick="document.getElementById('import-input').click()" class="p-2 text-gray-500 hover:text-emerald-600 hover:bg-emerald-50 rounded-lg transition" title="Restore Data">
                                <i data-lucide="upload" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <div class="px-6 pb-24 pt-4">
                        <!-- Horizontal Calendar -->
                        <div class="flex overflow-x-auto gap-3 pb-6 px-1 no-scrollbar scroll-smooth">${daysHTML}</div>
                        
                        <!-- Checklist Card (Split Layout on Desktop) -->
                        <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-gray-100 relative overflow-hidden">
                             <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-50 rounded-full -mr-16 -mt-16 opacity-50 pointer-events-none"></div>
                            
                            <h2 class="text-lg font-bold text-gray-800 mb-6 relative z-10 border-b border-gray-100 pb-2">Target Hari Ke-${state.selectedDay}</h2>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 relative z-10">
                                
                                <!-- Kolom Kiri: Target Utama & Tarawih -->
                                <div class="space-y-6">
                                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Aktivitas Utama</h3>
                                    
                                    <div class="grid grid-cols-2 gap-3">
                                        <div onclick="toggleCheck(${state.selectedDay - 1}, 'fasting')" class="p-5 rounded-2xl border cursor-pointer transition-all flex flex-col items-center justify-center gap-2 ${currentData.fasting ? 'border-emerald-500 bg-emerald-50 text-emerald-700' : 'border-gray-100 bg-gray-50 text-gray-400 hover:bg-gray-100'}">
                                            <i data-lucide="coffee" class="w-6 h-6 ${currentData.fasting ? 'text-emerald-600' : 'text-gray-300'}"></i>
                                            <span class="font-semibold text-sm">Puasa</span>
                                        </div>
                                        <div onclick="toggleCheck(${state.selectedDay - 1}, 'quran')" class="p-5 rounded-2xl border cursor-pointer transition-all flex flex-col items-center justify-center gap-2 ${currentData.quran ? 'border-purple-500 bg-purple-50 text-purple-700' : 'border-gray-100 bg-gray-50 text-gray-400 hover:bg-gray-100'}">
                                            <i data-lucide="book-open" class="w-6 h-6 ${currentData.quran ? 'text-purple-600' : 'text-gray-300'}"></i>
                                            <span class="font-semibold text-sm">Tilawah</span>
                                        </div>
                                    </div>

                                    <div onclick="toggleCheck(${state.selectedDay - 1}, 'tarawih')" class="flex items-center justify-between p-4 rounded-2xl border-2 cursor-pointer transition-all ${currentData.tarawih ? 'border-indigo-500 bg-indigo-50' : 'border-gray-100 border-dashed hover:border-gray-300'}">
                                        <div class="flex items-center gap-3">
                                            <i data-lucide="moon" class="${currentData.tarawih ? 'text-indigo-500 fill-indigo-500' : 'text-gray-300'} w-5 h-5"></i>
                                            <span class="font-semibold ${currentData.tarawih ? 'text-indigo-700' : 'text-gray-500'}">Shalat Tarawih</span>
                                        </div>
                                    </div>
                                </div>

                                <!-- Kolom Kanan: Sholat Wajib -->
                                <div class="space-y-4">
                                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Sholat Wajib</h3>
                                    
                                    <div class="space-y-2.5">
                                        ${Object.keys(currentData.prayers).map(p => `
                                            <div onclick="toggleCheck(${state.selectedDay - 1}, 'prayers', '${p}')" class="flex items-center justify-between p-3.5 rounded-xl cursor-pointer transition-all ${currentData.prayers[p] ? 'bg-emerald-50 border border-emerald-100' : 'bg-gray-50 border border-transparent hover:bg-gray-100'}">
                                                <div class="flex items-center gap-3">
                                                    <div class="w-2 h-2 rounded-full ${currentData.prayers[p] ? 'bg-emerald-500' : 'bg-gray-300'}"></div>
                                                    <span class="capitalize font-medium text-gray-700 text-sm">${p}</span>
                                                </div>
                                                ${currentData.prayers[p] ? '<i data-lucide="check" class="text-emerald-600 w-4 h-4"></i>' : ''}
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 3. IBADAH VIEW (Prayer, Quran, Tasbih) ---
        function getIbadahHTML() {
            const tabs = [
                { id: 'prayer', label: 'Jadwal', icon: 'clock' },
                { id: 'quran', label: 'Qur\'an', icon: 'book' },
                { id: 'tasbih', label: 'Tasbih', icon: 'fingerprint' }
            ];

            // Premium Segmented Controller Tab Bar yang diperlebar agar sejajar sempurna dengan konten di bawahnya
            const nav = `
                <div class="px-6 mt-6 w-full max-w-4xl mx-auto">
                    <div class="bg-white/80 backdrop-blur-md p-1.5 rounded-2xl flex gap-2 border border-emerald-100/80 shadow-sm relative">
                        ${tabs.map(t => {
                            const isActive = state.ibadahSubTab === t.id;
                            return `
                                <button onclick="{state.ibadahSubTab='${t.id}'; renderContent();}" 
                                    class="flex-1 flex items-center justify-center gap-2 py-3.5 rounded-xl text-xs md:text-sm font-bold transition-all duration-300 relative ${isActive ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/20 scale-100' : 'text-gray-500 hover:text-emerald-700 hover:bg-emerald-50/50'}">
                                    <i data-lucide="${t.icon}" class="w-4 h-4 transition-transform duration-300 ${isActive ? 'scale-110 text-white' : 'text-gray-400'}" style="margin-top: -1px;"></i>
                                    <span class="tracking-wide">${t.label}</span>
                                </button>
                            `;
                        }).join('')}

        // --- 4. CALENDAR VIEW ---
        function getCalendarHTML() {
            const date = state.currentCalendarDate;
            const year = date.getFullYear();
            const month = date.getMonth(); // 0-11
            
            // Generate Calendar Grid
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDayIndex = firstDay.getDay(); // 0 (Sun) - 6 (Sat)
            const daysInMonth = lastDay.getDate();

            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            
            let gridHTML = '';
            // Empty slots
            for(let i=0; i<startDayIndex; i++) gridHTML += `<div></div>`;
            
            // Days
            for(let i=1; i<=daysInMonth; i++) {
                const currentDateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                
                // Get Hijri Day
                const dObj = new Date(year, month, i);
                const hijriPart = new Intl.DateTimeFormat('id-ID-u-ca-islamic', { day: 'numeric' }).format(dObj);
                
                // Check Events
                const hasEvent = state.events.some(e => e.date === currentDateStr);
                const isToday = new Date().toDateString() === dObj.toDateString();

                gridHTML += `
                    <div onclick="openEventModal('${currentDateStr}')" class="aspect-square rounded-xl border ${isToday ? 'border-emerald-500 bg-emerald-50' : 'border-gray-100 bg-white hover:border-emerald-300'} flex flex-col items-center justify-center cursor-pointer relative transition">
                        <span class="text-sm font-bold ${isToday ? 'text-emerald-700' : 'text-gray-700'}">${i}</span>
                        <span class="text-[9px] text-gray-400 font-arab mt-0.5">${hijriPart}</span>
                        ${hasEvent ? '<div class="w-1.5 h-1.5 bg-orange-400 rounded-full absolute bottom-1.5"></div>' : ''}
                    </div>
                `;
            }

            // Events List for Selected Month
            const monthEvents = state.events.filter(e => {
                const eDate = new Date(e.date);
                return eDate.getMonth() === month && eDate.getFullYear() === year;
            }).sort((a,b) => new Date(a.date) - new Date(b.date));

            return `
                <div class="animate-fade-in pt-4 px-6 pb-24 md:pb-8 max-w-5xl mx-auto">
                    <h1 class="text-xl font-bold text-center text-gray-800 mb-6">Kalender Hijriah</h1>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
                        
                        <!-- Left: Calendar Card -->
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 md:col-span-2">
                            <div class="flex justify-between items-center mb-4">
                                <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-100 rounded-full"><i data-lucide="chevron-left" class="w-5 h-5 text-gray-600"></i></button>
                                <div class="text-center">
                                    <div class="font-bold text-gray-800">${monthNames[month]} ${year}</div>
                                    <div class="text-xs text-emerald-600 font-medium">
                                        ${new Intl.DateTimeFormat('id-ID-u-ca-islamic', { month: 'long', year: 'numeric' }).format(firstDay)}
                                    </div>
                                </div>
                                <button onclick="changeMonth(1)" class="p-2 hover:bg-gray-100 rounded-full"><i data-lucide="chevron-right" class="w-5 h-5 text-gray-600"></i></button>
                            </div>

                            <!-- Days Header -->
                            <div class="grid grid-cols-7 text-center mb-2">
                                ${['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(d => `<div class="text-[10px] font-bold text-gray-400 uppercase">${d}</div>`).join('')}
                            </div>
                            
                            <!-- Grid -->
                            <div class="grid grid-cols-7 gap-1">
                                ${gridHTML}
                            </div>
                        </div>

                        <!-- Right: Events Section -->
                        <div class="bg-white p-5 rounded-2xl border border-gray-100 md:col-span-1">
                            <h3 class="font-bold text-gray-700 mb-3 text-sm flex items-center gap-2"><i data-lucide="bookmark" class="w-4 h-4 text-orange-500"></i> Agenda Bulan Ini</h3>
                            ${monthEvents.length === 0 ? '<div class="text-center text-xs text-gray-400 py-6">Tidak ada agenda. Klik tanggal pada kalender untuk menambah.</div>' : 
                                monthEvents.map(e => {
                                    const [y,m,d] = e.date.split('-');
                                    return `
                                        <div class="flex items-center gap-3 py-3 border-b border-gray-50 last:border-0">
                                            <div class="bg-orange-100 text-orange-700 w-10 h-10 rounded-lg flex flex-col items-center justify-center flex-shrink-0">
                                                <span class="text-xs font-bold">${d}</span>
                                            </div>
                                            <div class="flex-1">
                                                <div class="text-sm font-medium text-gray-800">${e.title}</div>
                                                <div class="text-xs text-gray-400">Catatan Pribadi</div>
                                            </div>
                                            <button onclick="deleteEvent('${e.date}')" class="text-gray-300 hover:text-red-400 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                        </div>
                                    `;
                                }).join('')
                            }
                        </div>

                    </div>
                </div>
            `;
        }

                    { t: 'Fakta Al Qur‘an', c: 'Memiliki 30 juz, 114 surah, dan 6.236 ayat. Terdiri atas surah Makkiyah (Turun di Makkah sebanyak 86 surah dan 4.475 ayat, cirinya adalah ayat yang cenderung pendek) dan surah Madaniyyah (Turun di Madinah sebanyak 28 surah dan 1.761 ayat, cirinya adalah ayat yang lebih panjang). Surah Al-Alaq ayat 1-5 adalah ayat yang pertama kali diturunkan, dan Surah Al-Baqarah ayat 281 adalah ayat yang paling akhir diturunkan, dengan total waktu 22 tahun 2 bulan 22 hari. Surah terpendek adalah Al-Kausar (3 ayat) dan surah terpanjang adalah Al-Baqarah (286 ayat). Bagi yang membacanya adalah 10 kebaikan per huruf, misal Alif Lam Mim akan dihitung sebanyak 3 huruf atau 30 kebaikan. Bahkan bagi yang mendengarkannya nilai kebaikannya sama seperti yang membacanya, sehingga dianjurkan diam memperhatikan ketika ada yang membaca Al-Qur‘an.' },
                    { t: 'Salafush Shalih', c: 'Merupakan tiga generasi terbaik dalam sejarah Islam sesuai dengan sabda Nabi Muhammad SAW, yaitu Generasi Sahabat, Tabi‘in. dan Tabi‘ut Tabi‘in. Generasi Sahabat adalah orang-orang yang bertemu langsung dengan Nabi Muhammad SAW dalam keadaan beriman dan meninggal dalam keadaan Islam. Mereka adalah murid langsung Nabi yang paling memahami isi dan sebab turunnya Al-Qur‘an. Termasuk di dalamnya adalah Khulafaur Rasyidin (Abu Bakar Ash-Shiddiq, Umar bin Khattab, Utsman bin Affan, dan Ali bin Abi Thalib). Generasi Tabi‘in adalah generasi yang berguru kepada para sahabat Nabi. Meskipun tidak pernah bertemu Nabi, mereka menjaga kemurnian ajaran Islam yang diterima dari tangan pertama (para sahabat). Termasuk di dalamnya adalah Sa‘id bin al-Musayyib, Uwais al-Qarni, Hasan al-Bashri, Umar bin Abdul Aziz, dan tokoh lainnya. Sedangkan Generasi Tabi‘ut Tabi‘in adalah Generasi yang berguru kepada para Tabi‘in. Termasuk di dalamnya adalah Imam Empat Mahzab (Imam Abu Hanifah, Imam Malik bin Anas, Imam Syafi‘i, dan Imam Ahmad bin Hanbal)' },					
                    { t: 'Empat Mahzab', c: 'Empat mazhab fiqih utama dalam Islam Sunni (Hanafi, Maliki, Syafi‘i, dan Hambali) adalah metodologi ijtihad yang diakui untuk memahami Al-Qur‘an dan Sunnah. Didirikan oleh imam mujtahid, mazhab-mazhab ini menjadi panduan praktis ibadah dan hukum Islam yang tersebar di berbagai belahan dunia. Mazhab Hanafi (Imam Abu Hanifah, 80-150 H) adalah Mazhab tertua dan memiliki pengikut terbanyak, dikenal banyak menggunakan ra‘yi (rasio/analogi) di samping hadis. Umumnya diikuti di Turki, India, Pakistan, dan Asia Tengah. Mazhab Maliki (Imam Malik, 93-179 H) sangat menekankan pada hadis dan amalan penduduk Madinah. Umumnya diikuti di wilayah Afrika Utara dan Barat. Mazhab Syafi‘i (Imam Asy-Syafi‘i, 150-204 H) dikenal sebagai perumus ushul fiqh pertama (kitab ar-Risalah) yang mensistematisasikan dalil. Banyak diikuti di Asia Tenggara (termasuk Indonesia), Mesir, dan Yaman. Mazhab Hambali (Imam Ahmad bin Hanbal, 164-241 H) sangat berpegang teguh pada tekstual hadis dan riwayat. Umumnya diikuti di Arab Saudi dan wilayah Teluk.' },
                    { t: 'Hari Besar tanpa Ibadah Khusus', c: 'Tahun Baru Islam, Maulid Nabi, dan Isra Miraj merupakan hari besar bagi Umat Islam yang tidak memiliki ibadah khusus layaknya Idul Fitri dan Idul Adha. Peringatan seperti pengajian, selawatan, doa, dan tabligh akbar yang ada biasanya lebih bersifat budaya atau untuk menyemarakkan hari tersebut.' },					
					{ t: 'Hukum Taklifi', c: 'Adalah hukum islam yang berkaitan dengan perbuatan manusia meliputi Wajib, Sunnah, Mubah, Makruh, dan Haram. Wajib adalah perintah yang bersifat mengikat dan harus dilakukan, ada yang bersifat pribadi (Fardhu Ain) dan ada yang kelompok (Fardhu Kifayah). Sunnah adalah perbuatan yang dianjurkan oleh Nabi Muhammad SAW, melakukannya sangat disarankan untuk menambah pahala. Mubah adalah hukum asal perbuatan duniawi yang tidak dilarang dan tidak diperintahkan. Namun, niat bisa mengubah mubah menjadi berpahala (misal: makan dengan niat agar kuat beribadah). Makruh adalah erbuatan yang sebaiknya dihindari karena dibenci oleh Allah, namun tidak sampai dilarang keras (haram). Haram adalah larangan mutlak yang jika dilanggar akan mendatangkan ancaman siksa/dosa.' },
					{ t: 'Istilah Haram', c: 'Kata haram berasal dari kata (Haruma-Yahrumu-Harāman) yang berarti melarang. Pada mulanya kata ini dimaksudkan untuk melarang suatu perbuatan demi menjaga kehormatan atau dengan kata lain, kata haruma pada awalnya bermakna menyucikan atau menghormati dan salah satu turunan dari kata haruma yakni (Ihtarama-Yahtarimu-Ihtirāman) berarti menjaga kehormatan atau menghormati. Karena pergeseran makna, akhirnya kata ini bermakna melarang atau mentidak-bolehkan.' },
					{ t: 'Makanan Haram', c: 'Makanan yang haram dikonsumsi meliputi bangkai (kecuali ikan dan belalang), hewan yang tidak disembelih secara syar‘i, darah, babi, hewan yang disembelih atas Nama Selain Allah (seperti untuk sesajen), khamr (miras, narkoba, zat adiktif lainnya), dan hewan tertentu (menjijikkan, bertaring, berkuku tajam, amfibi, diperintahkan dibunuh, atau dilarang dibunuh). Makanan halal juga bisa menjadi haram jika diperoleh dari hasil mencuri, suap, riba, atau dosa lainnya.' },
					{ t: 'Perbuatan Haram', c: 'Perbuatan yang diharamkan meliputi syirik (menyekutukan Allah SWT dengan sesuatu yang lain), membunuh tanpa alasan (termasuk aborsi), zina (hubungan seksual di luar ikatan pernikahan yang sah), mencuri, merampok, suap/KKN, riba (mengambil tambahan dari pinjaman modal secara tidak sah), durhaka kepada orang tua/suami/istri, KDRT, berbuat zalim, pemerkosaan, penipuan, berjudi (termasuk judi online), praktik sihir, ghibah, berbohong, memfitnah, namimah (mengadu domba), iri dengki, menghina Al Quran, berbuat curang, berbuat tamak, memakan hak orang lain (terutama yatim dan fakir miskin), bunuh diri, menggelapkan timbangan dalam berdagangan, penyalahgunaan amanah, pornografi, berbuat usil (mengganggu dan merugikan orang lain), Tadlis (menyembunyikan cacat atau informasi barang dari pembeli), Gharar (ketidakpastian atau spekulasi yang berlebihan dalam transaksi), Ikhtikar (Menimbun barang kebutuhan pokok agar harganya melonjak), terorisme, konsumsi narkoba dan miras, serta perbuatan dosa lainnya.' },
					{ t: 'Sesuatu yang Haram karena Kondisi Tertentu', c: 'Dalam kondisi tertentu, beberapa hal dapat diharamkan. Misal bagi Orang yang Berhadats (Kecil/Besar), haram hukumnya melaksanakan shalat, tawaf, serta memegang atau membawa mushaf Al-Qur‘an hingga suci kembali (berwudhu atau mandi wajib). Bagi Wanita Haid dan Nifas, haram untuk shalat, puasa (wajib diqada), tawaf, berhubungan suami istri, dan masuk ke dalam masjid. Saat berpuasa, diharamkan makan, minum, hubungan suami istri, dan muntah disengaja. Saat Ihram (Haji/Umrah) diharamkan memotong rambut/kuku, menggunakan wewangian, membunuh binatang buruan, melangsungkan akad nikah, dan melakukan hubungan suami istri.' },					
                    { t: 'Perang Badar', c: 'Perang besar pertama dalam sejarah Islam terjadi pada pada tanggal 17 Ramadan tahun 2 Hijriah (sekitar Maret 624 Masehi) di Lembah Badar, wilayah yang terletak di antara kota Makkah dan Madinah. Kaum Muslimin sekitar 313-314 orang melawan kaum Quraisy sebanyak 1.000 orang lebih dengan senjata lengkap. Akar konflik dimulai dari perlakuan kaum Quraisy di Makkah yang menindas dan merampas harta benda umat Islam saat mereka hijrah ke Madinah. Rasulullah SAW kemudian memimpin pasukan untuk mencegat kafilah dagang Quraisy pimpinan Abu Sufyan guna merebut kembali hak-hak umat Islam, namun kaum Quraisy meresponsnya dengan mengirim pasukan tempur besar dari Makkah.' },
                    { t: 'Perang Uhud', c: 'Perang Uhud adalah salah satu pertempuran krusial dalam sejarah Islam yang terjadi pada pertengahan bulan Syawal tahun 3 Hijriah (sekitar 625 Masehi). Perang ini berlangsung di kaki Gunung Uhud, Madinah, antara pasukan Muslim yang dipimpin oleh Nabi Muhammad SAW melawan kaum musyrikin Quraisy dari Makkah yang dipimpin oleh Abu Sufyan. Alasannya adalah Kaum Quraisy ingin membalas dendam atas kekalahan memalukan mereka pada Perang Badar setahun sebelumnya. Kali itu, kaum Muslimin sekitar 700 hingga 1.000 orang (berkurang karena pembelotan 300 orang munafik di bawah Abdullah bin Ubay) melawan Kaum Quraisy sekitar 3.000 pasukan, termasuk kavaleri yang dipimpin oleh Khalid bin Walid (sebelum masuk Islam). Pasukan Muslim mengalami kekalahan taktis setelah awalnya hampir menang. Sebanyak 70 sahabat gugur sebagai syuhada, termasuk paman Nabi, Hamzah bin Abdul Muththalib.' },
                    { t: 'Perang Tabuk', c: 'Perang terakhir yang dipimpin langsung oleh Nabi Muhammad SAW dengan 30.000 personel pasukan Muslim. Perang ini terjadi pada bulan Rajab tahun 9 Hijriah (sekitar 630 Masehi). Pada perang ini tidak terjadi kontak fisik atau pertempuran besar karena pasukan Romawi (Bizantium) memilih untuk mundur sebelum pasukan Muslim tiba. Penyebabnya adalah adanya ancaman serangan dari pihak Romawi yang khawatir akan perkembangan pesat Islam setelah pembebasan kota Makkah (Fathu Makkah).' },					
					
                ],
                ibadah: [
                    { t: 'Syahadat', c: 'Merupakan kalimat pernyataan yang menyatakan seseorang telah bersaksi akan keesaan Allah SWT dan kerasulan Nabi Muhammad SAW, sebagai syarat awal memeluk agama Islam. Syahadat sendiri juga diikuti dengan keimanan dan ketaqwaan sebagai seorang muslimin. Kalimatnya adalah "Asyhadu an laa ilaaha illallaah, Wa asyhadu anna Muhammadar Rasuulullaah."' },				
                    { t: 'Rukun Salat', c: 'Umumnya salat dimulai dengan niat, berdiri (jika mampu), takbiratul ihram, membaca surat Al-Fatihah di setiap rakaat, rukuk, itidal, sujud, duduk di antara dua sujud, duduk dan membaca doa tasyahud akhir termasuk membaca salawat Nabi Muhammad SAW, ditutup dengan salam pertama (menoleh ke kanan). Salat dilakukan secara tertib dan thumaninah / tidak terburu-buru' },
                    { t: 'Sunnah Salat', c: 'Terdapat Sunnah Ab‘ad dan Sunnah Haiat. Sunnah Ab‘ad jika terlewat maka disarankan sujud sahwi di akhir salat, misal tasyahud awal, doa qunut subuh, dan salawat kepada Keluarga Nabi. Sedangkan sunnah Haiat jika terlewat tidak perlu sujud sahwi, meliputi mengangkat tangan (takbiratul ihram, itidal), berseedekap, doa iftitah, surah pendek, doa (rukuk, sujud, itidal), dan salam kedua (menoleh ke kiri).' },
                    { t: 'Rukun Wudhu', c: 'Dimulai dengan niat wudhu saat air pertama kali menyentuh wajah, kemudian membasuh wajah, membasuh kedua tangan hingga siku, mengusap sebagian kepala, membasuh kedua kaki hingga mata kaki, dan dilakukan secara berurutan.' },
                    { t: 'Sunnah Wudhu', c: 'Beberapa sunnah wudhu meliputi membaca basmalah, mencuci telapak tangan di awal, berkumur, serta menghirup air ke hidung (istinsyaq).' },
                    { t: 'Rukun Mandi Wajib', c: 'Dimulai dengan niat mandi wajib bersamaan saat air pertama kali menyentuh bagian tubuh. Saat mandi, air harus merata ke seluruh tubuh dari ujung rambut hingga ujung kaki termasuk sela-sela dan lipatan tubuh, serta menghilangkan najis yang menempel.' },
                    { t: 'Sunnah Mandi Wajib', c: 'Beberapa sunnah mandi wajib meliputi mencuci kedua tangan sebanyak tiga kali, membersihkan kemaluan dan kotoran menggunakan tangan kiri, berwudu secara sempurna seperti wudu sebelum salat, menyiram kepala sebanyak tiga kali sambil menyela-nyela rambut, dan mendahulukan anggota tubuh bagian kanan lalu kiri.' },					
                    { t: 'Rukun Puasa', c: 'Diawali dengan niat puasa karena Allah SWT pada malam hari hingga subuh, menahan diri dari hal yang menahan puasa (makan, minum, berhubungan suami istri, sengaja muntah) dari subuh hingga maghrib. Puasa akan sah jika dilakukan umat muslim yang berakal sehat, suci dari haid/nifas, dan di waktu yang diperbolehkan puasa. Waktu haram puasa sendiri meliputi Idul Fitri, Idul Adha, dan Hari Tasyrik' },					
                    { t: 'Zakat Fitrah', c: 'Wajib ditunaikan mulai awal Ramadan hingga sebelum shalat Idul Fitri dimulai. Menggunakan beras atau bahan makanan pokok sejenis dengan berat 2,5 kg. Jika menggunakan uang tunai, maka nilainya setara harga beras/makanan pokok lokal tersebut.' },
                    { t: 'Zakat Mal', c: 'Zakat atas kepemilikan harta seperti uang, emas, perak, perdagangan, penghasilan, dan harta simpanan dengan nilai 2,5% total pendapatan. Syaratnya yaitu dimiliki penuh selama 1 tahun (haul), halal, mencapai nishab (sekitar 85 gram emas murni), dan telah dikurangi utang jatuh tempo.' },
                    { t: 'Shalat Id', c: 'Shalat sunnah muakkad yang dilaksanakan di tanah atau masjid mulai terbit matahari hingga sebelum Dzuhur. Dilakukan berjamaah dengan 7 kali takbir di rakaat pertama setelah doa iftitah dan 5 kali takbir di rakaat kedua.' },					
                    { t: 'Sunnah Shalat Id', c: 'Mandi besar, memakai pakaian terbaik, makan sedikit (Idul Fitri)/tidak makan (Idul Adha) sebelum berangkat, mendengarkan khutbah, dan pulang melalui jalan yang berbeda dari jalan ke masjid.' },
                    { t: 'Qurban', c: 'Ibadah penyembelihan hewan ternak (sapi, kambing, unta, domba, kambing) yang sifatnya sunnah muakkad bagi yang mampu. Dilakukan pada 10-13 Dzulhijah. Hewan yang disembelih harus sehat, tidak cacat, dan mencapai usia minimal yang ditentukan (sapi minimal 2 tahun, kambing minimal 1 tahun). Untuk seekor sapi, kerbau, atau unta dapat dikolektifkan hingga 7 orang.' },
                    { t: 'Sunnah Qurban', c: 'Bagi orang yang ingin berkurban, dianjurkan untuk tidak memotong rambut dan kuku sejak memasuki tanggal 1 Dzulhijjah hingga hewan kurbannya disembelih. Untuk Pembagian Daging sendiri, idealnya dibagi menjadi tiga bagian yaitu sepertiga untuk pekurban dan keluarganya, sepertiga untuk kerabat/tetangga, dan sepertiga untuk fakir miskin.' },
                    { t: 'Haji', c: 'Ibadah haji adalah rukun Islam kelima yang wajib dilaksanakan sekali seumur hidup bagi setiap Muslim yang mampu (istitha‘ah), baik secara fisik, finansial, maupun keamanan perjalanan. Secara bahasa, haji berarti "menyengaja" atau mengunjungi Baitullah (Ka‘bah) di Mekah untuk melakukan amalan tertentu pada waktu yang telah ditetapkan. Pelaksanaan ibadah haji dilakukan pada bulan-bulan haji (Syawal, Dzulqa‘dah, dan Dzulhijjah), dengan puncak ritual pada tanggal 8 hingga 13 Dzulhijjah (4-6 hari) setiap tahunnya. Jamaah Indonesia biasanya akan tinggal di Arab Saudi selama kurang lebih 40 hari.' },
                    { t: 'Rukun Haji', c: 'Rukun Haji meliputi Ihram (Niat memulai ibadah haji dengan memakai pakaian ihram pada 8 Dzulhijjah), Wukuf di Arafah (Berdiam diri di Padang Arafah pada 9 Dzulhijjah.), Mabit di Muzdalifah (Bermalam sejenak pada malam 10 Dzulhijjah), Melempar Jumrah Aqabah dan Tahallul Awal (melempar kerikil sebanyak 7 kali dan mencukur atau memotong sebagian rambut kepala rambut di Mina pada 10 Dzulhijjah), Tawaf Ifadah and Sa‘i (Mengelilingi Ka‘bah sebanyak 7 kali, kemudian berlari-lari kecil antara bukit Shafa dan Marwah sebanyak 7 kali pada 10 Dzulhijjah atau sesudahnya), Mabit di Mina dan Lempar Tiga Jumrah (Ula, Wustha, dan Aqabah setiap hari, pada 11-13 Dzulhijjah), ditutup dengan Tawaf Wada (tawaf perpisahan di Baitullah sebelum meninggalkan Makkah). Prosesi tersebut dilakukan secara tertib (berurutan).' },
                    { t: 'Umrah', c: 'Ibadah umrah (haji kecil) adalah ibadah hukumnya adalah sunnah muakkad (sangat dianjurkan), meskipun sebagian ulama mazhab Syafi‘i dan Hanbali ada yang berpendapat wajib bagi yang mampu. Dilaksanakan kapan saja sepanjang tahun tanpa terikat waktu khusus. Rukun umrah hanya terdiri dari Ihram, Tawaf, Sa‘i, dan Tahallul, yang dapat selesai 2-3 jam saja.' },					
                ]
            };

            const navHTML = sections.map(s => `
                <button onclick="{state.activeGuideSection='${s}'; renderContent();}" class="px-5 py-2.5 rounded-full text-sm font-semibold whitespace-nowrap transition-colors ${state.activeGuideSection === s ? 'bg-emerald-600 text-white shadow-md' : 'bg-white text-emerald-700 border border-emerald-100'}">
                    ${s.charAt(0).toUpperCase() + s.slice(1)}
                </button>
            `).join('');

            return `
                 <div class="animate-fade-in px-6 pb-24 pt-4 max-w-5xl mx-auto">
                    <h1 class="text-xl font-bold text-center text-gray-800 mb-6">Pustaka Islami</h1>
                    <div class="flex gap-2 mb-6 overflow-x-auto pb-2 no-scrollbar px-1 justify-start md:justify-center">${navHTML}</div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${contentData[state.activeGuideSection].map(item => `
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 hover:border-emerald-200 transition-all group flex flex-col justify-between">
                                <div>
                                    <h3 class="font-bold text-emerald-800 mb-2 group-hover:text-emerald-600 transition-colors">${item.t}</h3>
                                    <p class="text-gray-600 text-sm leading-relaxed">${item.c}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- HELPER LOGIC ---

        // Helper untuk Bulan Indonesia
        function getMonthName(idx) {
            const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            return months[idx];
        }

        // --- CUSTOM IN-WEB DIALOGS (REPLACE BROWSER POPUPS) ---
        function showCustomModal(contentHTML) {
            const modal = document.getElementById('custom-modal');
            const modalBody = document.getElementById('custom-modal-body');
            if (!modal || !modalBody) return;
            
            modalBody.innerHTML = contentHTML;
            modal.classList.remove('hidden');
            // Force reflow
            modal.offsetHeight;
            modal.classList.remove('opacity-0');
            modal.querySelector('.modal-content-card').classList.remove('scale-95');
            modal.querySelector('.modal-content-card').classList.add('scale-100');
            if (window.lucide) lucide.createIcons();
        }

        function closeCustomModal() {
            const modal = document.getElementById('custom-modal');
            if (!modal) return;
            
            modal.classList.add('opacity-0');
            const card = modal.querySelector('.modal-content-card');
            if (card) {
                card.classList.remove('scale-100');
                card.classList.add('scale-95');
            }
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function showConfirmModal(title, message, onConfirm) {
            const content = `
                <div class="p-6">
                    <div class="flex items-center gap-3 mb-4 text-emerald-600">
                        <div class="bg-emerald-50 p-2.5 rounded-2xl">
                            <i data-lucide="help-circle" class="w-6 h-6"></i>
                        </div>
                        <h3 class="text-lg font-bold text-gray-800">${title}</h3>
                    </div>
                    <p class="text-sm text-gray-600 leading-relaxed mb-6">${message}</p>
                    <div class="flex gap-3 justify-end">
                        <button onclick="closeCustomModal()" class="px-4 py-2.5 rounded-xl border border-gray-150 text-sm font-semibold text-gray-500 hover:bg-gray-50 transition flex-1">Batal</button>
                        <button id="modal-confirm-btn" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-sm font-semibold text-white transition flex-1">Ya, Setuju</button>
                    </div>
                </div>
            `;
            showCustomModal(content);
            document.getElementById('modal-confirm-btn').onclick = () => {
                closeCustomModal();
                onConfirm();
            };
        }

        function showPromptModal(title, message, placeholder, onConfirm) {
            const content = `
                <div class="p-6">
                    <div class="flex items-center gap-3 mb-4 text-emerald-600">
                        <div class="bg-emerald-50 p-2.5 rounded-2xl">
                            <i data-lucide="edit-3" class="w-6 h-6"></i>
                        </div>
                        <h3 class="text-lg font-bold text-gray-800">${title}</h3>
                    </div>
                    <p class="text-sm text-gray-600 leading-relaxed mb-4">${message}</p>
                    <div class="mb-6">
                        <input id="modal-prompt-input" type="text" placeholder="${placeholder}" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all">
                    </div>
                    <div class="flex gap-3 justify-end">
                        <button onclick="closeCustomModal()" class="px-4 py-2.5 rounded-xl border border-gray-150 text-sm font-semibold text-gray-500 hover:bg-gray-50 transition flex-1">Batal</button>
                        <button id="modal-prompt-btn" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-sm font-semibold text-white transition flex-1">Simpan</button>
                    </div>
                </div>
            `;
            showCustomModal(content);
            const input = document.getElementById('modal-prompt-input');
            input.focus();
            
            input.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    const val = input.value;
                    closeCustomModal();
                    onConfirm(val);
                }
            };

            document.getElementById('modal-prompt-btn').onclick = () => {
                const val = input.value;
                closeCustomModal();
                onConfirm(val);
            };
        }

        function showSuccessModal(title, message, onClose = null) {
            const content = `
                <div class="p-6 text-center">
                    <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce">
                        <i data-lucide="check-circle" class="w-10 h-10"></i>
                    </div>
                    <h3 class="text-lg font-bold text-gray-800 mb-2">${title}</h3>
                    <p class="text-sm text-gray-600 leading-relaxed mb-6">${message}</p>
                    <button id="modal-close-btn" class="w-full px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-sm font-semibold text-white transition">Oke</button>
                </div>
            `;
            showCustomModal(content);
            document.getElementById('modal-close-btn').onclick = () => {
                closeCustomModal();
                if (onClose) onClose();
            };
        }

        function showErrorModal(title, message) {
            const content = `
                <div class="p-6 text-center">
                    <div class="w-16 h-16 bg-red-50 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="alert-triangle" class="w-10 h-10"></i>
                    </div>
                    <h3 class="text-lg font-bold text-gray-800 mb-2">${title}</h3>
                    <p class="text-sm text-gray-600 leading-relaxed mb-6">${message}</p>
                    <button onclick="closeCustomModal()" class="w-full px-4 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-900 active:bg-black text-sm font-semibold text-white transition">Tutup</button>
                </div>
            `;
            showCustomModal(content);
        }

        // Tracker Helpers
        function selectDay(day) { state.selectedDay = day; renderContent(); }
        function toggleCheck(dayIndex, type, subtype = null) {
            if (subtype) state.trackerData[dayIndex][type][subtype] = !state.trackerData[dayIndex][type][subtype];
            else state.trackerData[dayIndex][type] = !state.trackerData[dayIndex][type];
            saveData();
        }
        function calculateProgress() {
            let total = 0, completed = 0;
            state.trackerData.forEach(d => {
                total += 8;
                if(d.fasting) completed++; if(d.tarawih) completed++; if(d.quran) completed++;
                Object.values(d.prayers).forEach(p => { if(p) completed++ });
            });
            return state.trackerData.length === 0 ? 0 : Math.round((completed / total) * 100);
        }
        function getDayProgress(idx) {
            const d = state.trackerData[idx];
            let c = 0;
            if(d.fasting) c++; if(d.tarawih) c++; if(d.quran) c++;
            Object.values(d.prayers).forEach(p => { if(p) c++ });
            return Math.round((c/8)*100);
        }

        // Ibadah Helpers
        async function fetchPrayerTimes() {
            const url = `https://api.aladhan.com/v1/timingsByCity?city=${state.city}&country=${state.country}&method=11`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.code === 200) {
                    state.prayerTimes = data.data;
                    saveData();
                    renderContent();
                }
            } catch (e) { console.error("API Error", e); }
        }

        async function fetchSurahList() {
            if(state.isQuranLoading) return;
            state.isQuranLoading = true;
            renderContent();
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await res.json();
                state.surahList = data.data;
            } catch(e) { console.error(e); }
            finally { 
                state.isQuranLoading = false; 
                renderContent(); 
            }
        }

        function updateLocation() {
            state.city = document.getElementById('city-input').value;
            state.country = document.getElementById('country-input').value;
            state.prayerTimes = null;
            saveData();
            fetchPrayerTimes();
        }

        function updateSingleOffset(type, value) {
            state.manualOffsets[type] = parseInt(value) || 0;
            saveData();
            renderContent();
        }

        function adjustTime(timeStr, offset) {
            if(!timeStr) return '--:--';
            if(!offset) return timeStr;
            const [h, m] = timeStr.split(':').map(Number);
            const d = new Date(); d.setHours(h, m + offset);
            return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        // Tasbih Logic
        function incrementTasbih() {
            state.tasbihCount++;
            if("vibrate" in navigator) navigator.vibrate(20); // Haptic feedback
            
            // Animasi visual
            const btn = document.getElementById('tasbih-btn');
            btn.classList.add('tasbih-active');
            setTimeout(() => btn.classList.remove('tasbih-active'), 200);

            if(state.tasbihCount >= state.tasbihTarget) {
                 if("vibrate" in navigator) navigator.vibrate([50, 50, 50]);
            }
            saveData();
            renderContent();
        }
        function resetTasbih() {
            showConfirmModal('Reset Tasbih', 'Apakah Anda yakin ingin mereset hitungan tasbih kembali ke 0?', () => {
                state.tasbihCount = 0;
                saveData();
                renderContent();
            });
        }
        function setTasbihTarget(val) {
            state.tasbihTarget = val;
            saveData();
            renderContent();
        }

        // Calendar Logic
        function changeMonth(delta) {
            state.currentCalendarDate.setMonth(state.currentCalendarDate.getMonth() + delta);
            renderContent();
        }
        function openEventModal(dateStr) {
            const [y, m, d] = dateStr.split('-');
            const formattedDate = `${parseInt(d)} ${getMonthName(parseInt(m) - 1)} ${y}`;
            
            showPromptModal('Tambah Agenda', `Tambahkan rencana atau pengingat untuk tanggal <span class="font-bold text-emerald-700">${formattedDate}</span>:`, 'Tulis agenda Anda di sini...', (title) => {
                if (title && title.trim()) {
                    state.events = state.events.filter(e => e.date !== dateStr);
                    state.events.push({ date: dateStr, title: title.trim() });
                    saveData();
                    renderContent();
                }
            });
        }
        function deleteEvent(dateStr) {
            showConfirmModal('Hapus Agenda', 'Apakah Anda yakin ingin menghapus agenda ini?', () => {
                state.events = state.events.filter(e => e.date !== dateStr);
                saveData();
                renderContent();
            });
        }

        // Import/Export Logic
        function exportData() {
            const dataStr = JSON.stringify(state);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            
            const exportFileDefaultName = `ikhlas_backup_${new Date().toISOString().slice(0,10)}.json`;
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedState = JSON.parse(e.target.result);
                    if(importedState.trackerData && Array.isArray(importedState.trackerData)) {
                        showConfirmModal('Pulihkan Data', 'Data saat ini akan ditimpa dengan data cadangan. Lanjutkan?', () => {
                            state = { ...state, ...importedState };
                            saveData();
                            showSuccessModal('Berhasil', 'Data berhasil dipulihkan!', () => {
                                location.reload();
                            });
                        });
                    } else {
                        showErrorModal('Gagal', 'Format file cadangan tidak valid.');
                    }
                } catch(err) {
                    showErrorModal('Gagal', 'Gagal membaca file cadangan.');
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        // Start
        window.onload = init;

    </script>
</body>
</html>
