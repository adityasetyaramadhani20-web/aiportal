<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreVert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Global Styles untuk Input Tabel agar seragam di semua modul */
        .module-table td input {
            width: 150px;
            padding: 0.5rem;
            border: 1px solid #d1d5db;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            outline: none;
            transition: all 0.2s;
        }
        .module-table td input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
        }
        /* Custom Scrollbar untuk Tabel */
        .table-container::-webkit-scrollbar { height: 10px; width: 10px; }
        .table-container::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 5px; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Custom Scrollbar untuk Top Nav */
        .top-nav::-webkit-scrollbar { height: 6px; }
        .top-nav::-webkit-scrollbar-track { background: #0f172a; }
        .top-nav::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .top-nav::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Animasi Transisi Modul */
        .module-section { display: none; animation: fadeIn 0.3s ease-in-out; }
        .module-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Style Top Menu Aktif */
        .nav-item { border-bottom: 3px solid transparent; }
        .nav-item.active { background-color: #1e3a8a; color: white; border-bottom-color: #60a5fa; }
    </style>
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- TOP MENU NAV -->
    <nav class="bg-slate-900 text-slate-300 shadow-xl z-20 flex-shrink-0 flex items-center px-4 pt-2 overflow-x-auto top-nav">
        <!-- Logo -->
        <div class="flex items-center mr-6 pr-6 py-2 border-r border-slate-700 flex-shrink-0">
            <svg class="w-7 h-7 text-blue-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            <h1 class="text-lg font-bold text-white tracking-wide">Core<span class="text-blue-500">Vert</span></h1>
        </div>
        <!-- Menu Tabs -->
        <div class="flex space-x-1 flex-nowrap pb-0">
            <button onclick="switchModule('mod1', this)" class="nav-item active flex-shrink-0 px-4 py-3 rounded-t-md hover:bg-slate-800 hover:text-white transition-colors text-sm font-medium">
                1. PPh 21 / 26
            </button>
            <button onclick="switchModule('mod2', this)" class="nav-item flex-shrink-0 px-4 py-3 rounded-t-md hover:bg-slate-800 hover:text-white transition-colors text-sm font-medium">
                2. Unifikasi
            </button>
            <button onclick="switchModule('mod3', this)" class="nav-item flex-shrink-0 px-4 py-3 rounded-t-md hover:bg-slate-800 hover:text-white transition-colors text-sm font-medium">
                3. e-Faktur & Dok. Lain
            </button>
            <button onclick="switchModule('mod4', this)" class="nav-item flex-shrink-0 px-4 py-3 rounded-t-md hover:bg-slate-800 hover:text-white transition-colors text-sm font-medium">
                4. SPT Badan
            </button>
            <button onclick="switchModule('mod5', this)" class="nav-item flex-shrink-0 px-4 py-3 rounded-t-md hover:bg-slate-800 hover:text-white transition-colors text-sm font-medium">
                5. SPT OP
            </button>
            <button onclick="switchModule('mod6', this)" class="nav-item flex-shrink-0 px-4 py-3 rounded-t-md hover:bg-slate-800 hover:text-white transition-colors text-sm font-medium">
                6. PPN (Ekstra)
            </button>
            <button onclick="switchModule('mod7', this)" class="nav-item flex-shrink-0 px-4 py-3 rounded-t-md hover:bg-slate-800 hover:text-white transition-colors text-sm font-medium">
                7. Bea Meterai
            </button>
            <button onclick="window.open('https://kalkulator.pajak.go.id/', '_blank');" class="nav-item flex-shrink-0 px-4 py-3 rounded-t-md hover:bg-slate-800 hover:text-white transition-colors text-sm font-medium">
                Kalkulator Pajak
            </button>
        </div>
        <div class="ml-auto flex-shrink-0 pl-6 text-xs text-slate-500 font-medium py-2">
		<a href="https://www.pajak.go.id/id/reformdjp/coretax/template-xml-dan-converter-excel-ke-xml" target="_blank">Info Lanjut</a>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col relative overflow-hidden">
        
        <!-- Top Toolbar untuk Global Actions (CSV & Cache) -->
        <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm z-10">
            <div class="flex-1 pr-4">
                <h2 id="moduleTitle" class="text-xl font-bold text-gray-800 truncate">Modul 1: PPh 21/26 (Bulanan & Tahunan)</h2>
                <p class="text-sm text-gray-500 truncate">Kelola dan ubah data tabel ke format XML standar DJP CoreTax.</p>
            </div>
            <div class="flex space-x-2 lg:space-x-3 flex-shrink-0">
                <!-- CSV Upload/Download Terpadu -->
                <input type="file" id="globalCsvUploader" accept=".csv" class="hidden" onchange="handleCSVUpload(event)">
                <button onclick="document.getElementById('globalCsvUploader').click()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 lg:px-4 py-2 rounded text-sm font-semibold border border-gray-300 transition-colors flex items-center">
                    <svg class="w-4 h-4 mr-1 lg:mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <span class="hidden sm:inline">Upload CSV</span>
                </button>
                <button onclick="downloadCSV()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 lg:px-4 py-2 rounded text-sm font-semibold border border-gray-300 transition-colors flex items-center">
                    <svg class="w-4 h-4 mr-1 lg:mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span class="hidden sm:inline">Download CSV</span>
                </button>
                <div class="w-px bg-gray-300 mx-1"></div>
                <button onclick="clearCache()" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 lg:px-4 py-2 rounded text-sm font-semibold border border-red-200 transition-colors">
                    Reset <span class="hidden sm:inline">Data</span>
                </button>
            </div>
        </header>

        <!-- Container Modul (Scrollable) -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-6 bg-slate-50" id="mainScrollArea">

            <!-- ============================================== -->
            <!-- MODUL 1: PPh 21 -->
            <!-- ============================================== -->
            <div id="mod1" class="module-section active bg-white p-6 rounded-xl shadow border border-gray-200">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div class="flex flex-col">
                        <label for="m1_docType" class="font-semibold text-sm mb-1 text-gray-700">Jenis Bupot:</label>
                        <select id="m1_docType" onchange="M1_changeType()" class="cfg-input p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="BP21">BP21 (PPh 21/26 Selain Pegawai Tetap)</option>
                            <option value="BP26">BP26 (WPLN)</option>
                            <option value="BPA1">BPA1 (PPh 21 Pegawai Tetap/Tahunan)</option>
                            <option value="BPA2">BPA2 (PPh 21 PNS/TNI/Polri/Tahunan)</option>
                            <option value="BPMP">BPMP (PPh 21 Bulanan Pegawai Tetap)</option>
                        </select>
                    </div>
                    <div class="flex flex-col">
                        <label for="m1_tinNumber" class="font-semibold text-sm mb-1 text-gray-700">TIN (NPWP) Pemotong:</label>
                        <input type="text" id="m1_tinNumber" value="0029482015507000" class="cfg-input p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="flex flex-col bg-yellow-50 p-3 rounded border border-yellow-200">
                        <label for="m1_xmlUploader" class="font-semibold text-sm mb-1 text-yellow-800">Muat Kolom dari Template XML:</label>
                        <input type="file" id="m1_xmlUploader" accept=".xml" onchange="M1_loadXMLTemplate(event)" class="text-xs file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-yellow-100 file:text-yellow-700 cursor-pointer">
                    </div>
                </div>
                <div class="table-container overflow-x-auto w-full border border-gray-300 rounded shadow-sm mb-4">
                    <table class="module-table w-full text-sm text-left whitespace-nowrap">
                        <thead id="m1_tableHead" class="text-xs text-white uppercase bg-blue-900 border-b"></thead>
                        <tbody id="m1_tableBody" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                </div>
                <div class="flex justify-between items-center mt-4">
                    <button onclick="M1_addRow()" class="bg-blue-100 text-blue-800 px-4 py-2 rounded font-semibold hover:bg-blue-200">+ Tambah Baris</button>
                    <button onclick="M1_generateXML()" class="bg-green-600 text-white px-6 py-2 rounded shadow font-bold hover:bg-green-700">Unduh XML PPh 21</button>
                </div>
            </div>

            <!-- ============================================== -->
            <!-- MODUL 2: Bupot Unifikasi -->
            <!-- ============================================== -->
            <div id="mod2" class="module-section bg-white p-6 rounded-xl shadow border border-gray-200">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div class="flex flex-col">
                        <label for="m2_docType" class="font-semibold text-sm mb-1 text-gray-700">Jenis Dokumen CoreTax:</label>
                        <select id="m2_docType" onchange="M2_changeType()" class="cfg-input p-2 border border-gray-300 rounded outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="Bpu">BPPU (Bukti Potong Pajak Unifikasi)</option>
                            <option value="BPNR">BPNR (Bukti Potong Non Residen)</option>
                            <option value="CY">CY (Pemotongan Secara Digunggung)</option>
                            <option value="SelfPayment">SelfPayment (Penyetoran Sendiri)</option>
                            <option value="SDocs">SDocs (Dokumen yang Dipersamakan)</option>
                        </select>
                    </div>
                    <div class="flex flex-col">
                        <label for="m2_tinNumber" class="font-semibold text-sm mb-1 text-gray-700">TIN (NPWP) Pemotong/Penyetor:</label>
                        <input type="text" id="m2_tinNumber" value="0029482015507000" class="cfg-input p-2 border border-gray-300 rounded outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="flex flex-col bg-indigo-50 p-3 rounded border border-indigo-200">
                        <label for="m2_xmlUploader" class="font-semibold text-sm mb-1 text-indigo-800">Muat Format Kolom XML:</label>
                        <input type="file" id="m2_xmlUploader" accept=".xml" onchange="M2_loadXMLTemplate(event)" class="text-xs file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-indigo-100 file:text-indigo-700 cursor-pointer">
                    </div>
                </div>
                <div class="mb-4 text-sm text-blue-700 bg-blue-50 p-3 rounded border border-blue-200">
                    <strong>Tips:</strong> Ketik <code class="bg-blue-100 px-1 rounded">NIL</code> jika ingin tag XML dikirim kosong (<i>xsi:nil="true"</i>).
                </div>
                <div class="table-container overflow-x-auto w-full border border-gray-300 rounded shadow-sm mb-4">
                    <table class="module-table w-full text-sm text-left whitespace-nowrap">
                        <thead id="m2_tableHead" class="text-xs text-white uppercase bg-blue-800 border-b"></thead>
                        <tbody id="m2_tableBody" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                </div>
                <div class="flex justify-between items-center mt-4">
                    <button onclick="M2_addRow()" class="bg-blue-100 text-blue-800 px-4 py-2 rounded font-semibold hover:bg-blue-200">+ Tambah Baris</button>
                    <button onclick="M2_generateXML()" class="bg-green-600 text-white px-6 py-2 rounded shadow font-bold hover:bg-green-700">Unduh XML Unifikasi</button>
                </div>
            </div>

            <!-- ============================================== -->
            <!-- MODUL 3: e-Faktur & Dok. Lain -->
            <!-- ============================================== -->
            <div id="mod3" class="module-section bg-white p-6 rounded-xl shadow border border-gray-200">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div class="flex flex-col">
                        <label for="m3_docType" class="font-semibold text-sm mb-1 text-slate-700">Jenis Dokumen XML:</label>
                        <select id="m3_docType" onchange="M3_changeType()" class="cfg-input p-2 border border-slate-300 rounded outline-none focus:ring-2 focus:ring-sky-500">
                            <option value="FakturKeluaran">Faktur Pajak Keluaran (TaxInvoiceBulk)</option>
                            <option value="DokLainKeluaran">Dokumen Lain Keluaran (SpecialDocBulk)</option>
                            <option value="DokLainMasukan">Dokumen Lain Masukan (InputSpecialDocBulk)</option>
                            <option value="ReturFakturMasukan">Retur Faktur Masukan (InputTaxInvoiceReturn)</option>
                            <option value="ReturDokLainKeluaran">Retur Dok. Lain Keluaran (OutputSpecialDocReturn)</option>
                            <option value="ReturDokLainMasukan">Retur Dok. Lain Masukan (InputSpecialDocReturn)</option>
                        </select>
                    </div>
                    <div class="flex flex-col">
                        <label for="m3_tinNumber" class="font-semibold text-sm mb-1 text-slate-700">TIN (NPWP 16 Digit):</label>
                        <input type="text" id="m3_tinNumber" value="1091031210912281" class="cfg-input p-2 border border-slate-300 rounded outline-none focus:ring-2 focus:ring-sky-500">
                    </div>
                </div>
                <div class="mb-4 text-sm text-sky-800 bg-sky-50 p-3 rounded border border-sky-200">
                    Kolom dengan awalan <strong>GS_</strong>, <strong>Doc_</strong>, atau <strong>Row_</strong> otomatis dirakit menjadi struktur bertingkat dalam XML.
                </div>
                <div class="table-container overflow-x-auto w-full border border-slate-300 rounded shadow-sm mb-4">
                    <table class="module-table w-full text-sm text-left whitespace-nowrap">
                        <thead id="m3_tableHead" class="text-xs text-slate-700 uppercase bg-slate-200 border-b"></thead>
                        <tbody id="m3_tableBody" class="bg-white divide-y divide-slate-200"></tbody>
                    </table>
                </div>
                <div class="flex justify-between items-center mt-4">
                    <button onclick="M3_addRow()" class="bg-sky-100 text-sky-800 px-4 py-2 rounded font-semibold hover:bg-sky-200">+ Tambah Baris</button>
                    <button onclick="M3_generateXML()" class="bg-green-600 text-white px-6 py-2 rounded shadow font-bold hover:bg-green-700">Unduh XML Faktur</button>
                </div>
            </div>

            <!-- ============================================== -->
            <!-- MODUL 4: SPT PPh Badan -->
            <!-- ============================================== -->
            <div id="mod4" class="module-section bg-white p-6 rounded-xl shadow border border-gray-200">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div class="flex flex-col">
                        <label for="m4_docType" class="font-semibold text-sm mb-1 text-slate-700">Jenis Lampiran XML:</label>
                        <select id="m4_docType" onchange="M4_changeType()" class="cfg-input p-2 border border-slate-300 rounded outline-none focus:ring-2 focus:ring-sky-500">
                            <option value="L9_Depreciation">Lampiran 9 - Penyusutan</option>
                            <option value="L9_Amortization">Lampiran 9 - Amortisasi</option>
                            <option value="L10A_RelatedParties">Lampiran 10A - Trans. Hub Istimewa</option>
                            <option value="L11A_Entertainment">Lampiran 11A - Biaya Entertainmen</option>
                            <option value="L11A_NPL">Lampiran 11A - Daftar Debitur NPL</option>
                            <option value="L11A_Uncollectible">Lampiran 11A - Piutang Tak Tertagih</option>
                            <option value="L11A_Promotion">Lampiran 11A - Biaya Promosi</option>
                        </select>
                    </div>
                    <div class="flex flex-col">
                        <label for="m4_tinNumber" class="font-semibold text-sm mb-1 text-slate-700">TIN (NPWP 16 Digit):</label>
                        <input type="text" id="m4_tinNumber" value="0010695997058000" class="cfg-input p-2 border border-slate-300 rounded outline-none disabled:bg-slate-100 disabled:text-slate-400">
                    </div>
                    <div class="flex flex-col">
                        <label for="m4_taxYear" class="font-semibold text-sm mb-1 text-slate-700">Tahun Pajak:</label>
                        <input type="text" id="m4_taxYear" value="2023" class="cfg-input p-2 border border-slate-300 rounded outline-none disabled:bg-slate-100 disabled:text-slate-400">
                    </div>
                </div>
                <div class="table-container overflow-x-auto w-full border border-slate-300 rounded shadow-sm mb-4">
                    <table class="module-table w-full text-sm text-left whitespace-nowrap">
                        <thead id="m4_tableHead" class="text-xs text-slate-700 uppercase bg-slate-200 border-b"></thead>
                        <tbody id="m4_tableBody" class="bg-white divide-y divide-slate-200"></tbody>
                    </table>
                </div>
                <div class="flex justify-between items-center mt-4">
                    <button onclick="M4_addRow()" class="bg-sky-100 text-sky-800 px-4 py-2 rounded font-semibold hover:bg-sky-200">+ Tambah Baris</button>
                    <button onclick="M4_generateXML()" class="bg-green-600 text-white px-6 py-2 rounded shadow font-bold hover:bg-green-700">Unduh XML Badan</button>
                </div>
            </div>

            <!-- ============================================== -->
            <!-- MODUL 5: SPT PPh OP -->
            <!-- ============================================== -->
            <div id="mod5" class="module-section bg-white p-6 rounded-xl shadow border border-gray-200">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div class="flex flex-col">
                        <label for="m5_docType" class="font-semibold text-sm mb-1 text-slate-700">Jenis Lampiran XML:</label>
                        <select id="m5_docType" onchange="M5_changeType()" class="cfg-input p-2 border border-slate-300 rounded outline-none focus:ring-2 focus:ring-sky-500">
                            <optgroup label="Lampiran 1 - Daftar Harta">
                                <option value="L1_Harta_Bergerak">Harta Bergerak</option>
                                <option value="L1_Harta_Investasi">Harta Investasi</option>
                                <option value="L1_Harta_Kas">Harta Kas & Setara Kas</option>
                                <option value="L1_Harta_Lainnya">Harta Lainnya</option>

                                <option value="L3C_Depreciation">Penyusutan Fisikal</option>
                                <option value="L3C_Amortization">Amortisasi Fisikal</option>
                            </optgroup>
                            <optgroup label="Lampiran 3D - Biaya Lainnya">
                                <option value="L3D_Bad_Debt">Piutang Tak Tertagih</option>
                                <option value="L3D_Entertainment">Biaya Entertainmen</option>
                                <option value="L3D_Promotion">Biaya Promosi</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="flex flex-col">
                        <label for="m5_tinNumber" class="font-semibold text-sm mb-1 text-slate-700">TIN (NPWP 16 Digit):</label>
                        <input type="text" id="m5_tinNumber" value="3374041708870003" class="cfg-input p-2 border border-slate-300 rounded outline-none disabled:bg-slate-100 disabled:text-slate-400">
                    </div>
                    <div class="flex flex-col">
                        <label for="m5_taxYear" class="font-semibold text-sm mb-1 text-slate-700">Tahun Pajak:</label>
                        <input type="text" id="m5_taxYear" value="2025" class="cfg-input p-2 border border-slate-300 rounded outline-none disabled:bg-slate-100 disabled:text-slate-400">
                    </div>
                </div>
                <div class="table-container overflow-x-auto w-full border border-slate-300 rounded shadow-sm mb-4">
                    <table class="module-table w-full text-sm text-left whitespace-nowrap">
                        <thead id="m5_tableHead" class="text-xs text-slate-700 uppercase bg-slate-200 border-b"></thead>
                        <tbody id="m5_tableBody" class="bg-white divide-y divide-slate-200"></tbody>

                <div class="flex justify-between items-center mt-4">
                    <button onclick="M5_addRow()" class="bg-sky-100 text-sky-800 px-4 py-2 rounded font-semibold hover:bg-sky-200">+ Tambah Baris</button>
                    <button onclick="M5_generateXML()" class="bg-green-600 text-white px-6 py-2 rounded shadow font-bold hover:bg-green-700">Unduh XML OP</button>

            <!-- ============================================== -->
            <!-- MODUL 6: SPT PPN Ekstra -->
            <!-- ============================================== -->
            <div id="mod6" class="module-section bg-white p-6 rounded-xl shadow border border-gray-200">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 items-end">
                    <div class="flex flex-col">
                        <label for="m6_docType" class="font-semibold text-sm mb-1 text-slate-700">Jenis Dokumen:</label>
                        <select id="m6_docType" onchange="M6_changeType()" class="cfg-input p-2 border border-slate-300 rounded outline-none">
                            <option value="Retail">SPT PPN Digunggung (Retail)</option>
                            <option value="PMSE">Detil Transaksi PMSE</option>
                            <option value="DRKB">DRKB (Rekap Kendaraan Bermotor)</option>
                            <option value="LampiranC">Lampiran C (Other Collector)</option>
                        </select>
                    </div>
                    <div class="flex flex-col">
                        <label for="m6_tinNumber" class="font-semibold text-sm mb-1 text-slate-700">TIN (NPWP/NIK):</label>
                        <input type="text" id="m6_tinNumber" value="0000000000123000" class="cfg-input p-2 border border-slate-300 rounded outline-none">
                    </div>
                    <div class="flex flex-col">
                        <label for="m6_taxMonth" class="font-semibold text-sm mb-1 text-slate-700">Masa Pajak:</label>
                        <input type="text" id="m6_taxMonth" value="7" class="cfg-input p-2 border border-slate-300 rounded outline-none">
                    </div>
                    <div class="flex flex-col">
                        <label for="m6_taxYear" class="font-semibold text-sm mb-1 text-slate-700">Tahun Pajak:</label>
                        <input type="text" id="m6_taxYear" value="2024" class="cfg-input p-2 border border-slate-300 rounded outline-none">

    <script>
        // ==========================================
        // UI & STATE MANAGEMENT GLOBAL
        // ==========================================
        let activeModuleId = 'mod1';
        let isRestoring = false;

        const moduleTitles = {
            'mod1': 'Modul 1: PPh 21/26 (Bulanan & Tahunan)',
            'mod2': 'Modul 2: Bupot Unifikasi & Penyetoran',
            'mod3': 'Modul 3: e-Faktur & Dokumen Lain',
            'mod4': 'Modul 4: Lampiran SPT PPh Badan',
            'mod5': 'Modul 5: Lampiran SPT PPh Orang Pribadi',
            'mod6': 'Modul 6: SPT PPN (Ekstra - Retail, PMSE, dll)',
            'mod7': 'Modul 7: Bea Meterai'
        };

        function switchModule(modId, btnElement) {
            activeModuleId = modId;
            document.getElementById('moduleTitle').innerText = moduleTitles[modId];
            
            // Toggle Visibility
            document.querySelectorAll('.module-section').forEach(el => el.classList.remove('active'));
            document.getElementById(modId).classList.add('active');
            
            // Toggle Top Nav Styling
            if(btnElement) {
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                btnElement.classList.add('active');
                // Scroll button into view for small screens
                btnElement.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
            
            if(!isRestoring) saveCache();
        }

        // ==========================================
        // AUTO-SAVE (CACHING) VIA LOCALSTORAGE
        // ==========================================
        function saveCache() {
            if (isRestoring) return;
            const state = { activeModule: activeModuleId, modules: {} };
            
            for(let i=1; i<=7; i++) {
                const modId = 'mod' + i;
                const modEl = document.getElementById(modId);
                if(!modEl) continue;

                const headerInputs = {};
                modEl.querySelectorAll('.cfg-input').forEach(inp => headerInputs[inp.id] = inp.value);
                
                const rows = [];
                const tbody = modEl.querySelector('tbody');
                if(tbody) {
                    tbody.querySelectorAll('tr').forEach(tr => {
                        const rowData = [];
                        tr.querySelectorAll('td input').forEach(inp => rowData.push(inp.value));
                        rows.push(rowData);
                    });
                }
                state.modules[modId] = { headerInputs, rows };
            }
            localStorage.setItem('omni_corevert_cache', JSON.stringify(state));
        }

        function restoreCache() {
            const cached = localStorage.getItem('omni_corevert_cache');
            if(!cached) return;
            
            try {
                isRestoring = true;
                const state = JSON.parse(cached);
                
                // Initialize Header Inputs first so changeType acts correctly
                for(let i=1; i<=7; i++) {
                    const modId = 'mod' + i;
                    const modState = state.modules[modId];
                    if(modState && modState.headerInputs) {
                        for(const [id, val] of Object.entries(modState.headerInputs)) {
                            const el = document.getElementById(id);
                            if(el) el.value = val;
                        }
                    }
                }

                // Call changeType to setup table structure based on restored select values
                M1_changeType(); M2_changeType(); M3_changeType(); M4_changeType(); 
                M5_changeType(); M6_changeType(); M7_changeType();

                // Restore Rows
                for(let i=1; i<=7; i++) {
                    const modId = 'mod' + i;
                    const modState = state.modules[modId];
                    const tbody = document.getElementById(`m${i}_tableBody`);
                    if(modState && modState.rows && modState.rows.length > 0 && tbody) {
                        tbody.innerHTML = ''; // Clear default 1st row
                        modState.rows.forEach(rowData => {
                            window[`M${i}_addRow`](); // Call dynamic function
                            const lastTr = tbody.lastElementChild;
                            const inputs = lastTr.querySelectorAll('td input');
                            rowData.forEach((val, idx) => { if(inputs[idx]) inputs[idx].value = val; });
                        });
                    }
                }

                // Switch to active
                const btn = document.querySelector(`.nav-item[onclick*="${state.activeModule}"]`);
                switchModule(state.activeModule, btn);
            } catch (e) {
                console.error("Cache corrupted, resetting.", e);
            } finally {
                isRestoring = false;
            }
        }

        function clearCache() {
            if(confirm('Semua data tabel di 7 modul akan dihapus. Yakin?')) {
                localStorage.removeItem('omni_corevert_cache');
                location.reload();
            }
        }

        // Listener Global untuk save cache
        document.addEventListener('input', () => { setTimeout(saveCache, 300); });

        // ==========================================
        // GLOBAL CSV UPLOAD & DOWNLOAD
        // ==========================================
        function downloadCSV() {
            const mod = document.getElementById(activeModuleId);
            const thead = mod.querySelector('thead tr');
            const tbody = mod.querySelector('tbody');
            if (!thead || !tbody) return;

            let csv = [];
            let headers = Array.from(thead.querySelectorAll('th')).slice(0, -1).map(th => `"${th.innerText.replace(/"/g, '""')}"`);
            csv.push(headers.join(','));

            tbody.querySelectorAll('tr').forEach(tr => {
                let row = Array.from(tr.querySelectorAll('td input')).map(inp => `"${inp.value.replace(/"/g, '""')}"`);
                csv.push(row.join(','));
            });

            const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `CoreVert_${activeModuleId}_Data.csv`;
            link.click();
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const rows = parseCSV(e.target.result);
                if(rows.length > 1) {
                    const mod = document.getElementById(activeModuleId);
                    const tbody = mod.querySelector('tbody');
                    tbody.innerHTML = ''; 
                    const modNumber = activeModuleId.replace('mod', '');
                    const addRowFn = window[`M${modNumber}_addRow`];

                    for (let i = 1; i < rows.length; i++) { 
                        if (rows[i].length === 0 || (rows[i].length === 1 && rows[i][0] === '')) continue;
                        addRowFn(); 
                        const lastTr = tbody.lastElementChild;
                        const inputs = lastTr.querySelectorAll('input');
                        rows[i].forEach((val, idx) => { if (inputs[idx]) inputs[idx].value = val; });
                    }
                    saveCache(); 
                }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        function parseCSV(text) {
            let p = '', row = [''], ret = [row], i = 0, r = 0, s = !0, l;
            for (l of text) {
                if ('"' === l) { if (s && l === p) row[i] += l; s = !s; } 
                else if (',' === l && s) l = row[++i] = '';
                else if ('\n' === l && s) {
                    if ('\r' === p) row[i] = row[i].slice(0, -1);
                    row = ret[++r] = [l = '']; i = 0;
                } else row[i] += l;
                p = l;
            }
            // Bersihkan carriage return terakhir jika ada
            if(ret.length > 0 && ret[ret.length-1].length === 1 && ret[ret.length-1][0] === '') ret.pop();
            return ret;
        }

        // ==========================================

        // ==========================================
        const M1_config = {
            BP21: ["TaxPeriodMonth", "TaxPeriodYear", "CounterpartTin", "IDPlaceOfBusinessActivityOfIncomeRecipient", "StatusTaxExemption", "TaxCertificate", "TaxObjectCode", "Gross", "Deemed", "Rate", "Document", "DocumentNumber", "DocumentDate", "IDPlaceOfBusinessActivity", "WithholdingDate"],

            BPA2: ["TaxPeriodYear", "TaxPeriodMonth", "CounterpartTin", "CounterpartName", "CounterpartRank", "TaxObjectCode", "GrossIncome", "NetIncome", "PTKP", "PKP", "PPh21Payable", "WithholdingDate"],

            const columns = M1_config[document.getElementById("m1_docType").value] || [];
            const tr = document.createElement("tr");
            tr.className = "hover:bg-gray-100";
            columns.forEach(col => {
                const td = document.createElement("td"); td.className = "px-2 py-2";

        function M1_loadXMLTemplate(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const xmlDoc = new DOMParser().parseFromString(e.target.result, "text/xml");
                let detectedType = ["BPA1", "BPA2", "BP21", "BP26", "BPMP"].find(t => xmlDoc.getElementsByTagName(t).length > 0);
                if (detectedType) {
                    document.getElementById('m1_docType').value = detectedType;
                    const firstEl = xmlDoc.getElementsByTagName(detectedType)[0];
                    if (firstEl && firstEl.children) {
                        const cols = [];
                        for (let i = 0; i < firstEl.children.length; i++) cols.push(firstEl.children[i].nodeName);
                        M1_config[detectedType] = cols; M1_changeType();
                        alert(`Sukses! Template dikenali sebagai ${detectedType}.`);
                    }
                } else alert("Gagal mendeteksi template XML PPh 21.");
            };
            reader.readAsText(file);
        }
        function M1_generateXML() {
            const type = document.getElementById("m1_docType").value;
            const tin = document.getElementById("m1_tinNumber").value;
            const rows = document.querySelectorAll("#m1_tableBody tr");
            if(rows.length === 0) return alert("Tabel kosong!");
            let xmlString = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<${type}Bulk xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">\n\t<TIN>${tin}</TIN>\n\t<ListOf${type}>\n`;
            rows.forEach(row => {
                xmlString += `\t\t<${type}>\n`;
                row.querySelectorAll("input").forEach(input => {
                    let val = input.value.trim(); const tagName = input.name;
                    if ((val === "" && ["CounterpartPassport", "CounterpartKitas"].includes(tagName)) || val.toUpperCase() === "NIL") {
                        xmlString += `\t\t\t<${tagName} xsi:nil="true"/>\n`;
                    } else xmlString += `\t\t\t<${tagName}>${val}</${tagName}>\n`;
                });
                xmlString += `\t\t</${type}>\n`;
            });
            xmlString += `\t</ListOf${type}>\n</${type}Bulk>`;
            downloadBlob(xmlString, `${type}_ready.xml`);
        }

        // ==========================================
        const M7_config = {
            L3: ["DocumentType", "DocumentNumber", "DocumentDate", "DocumentValue", "IdentityType", "IdentityNumber", "Name", "StampDutyWithheld"],
            L4: ["DocumentType", "DocumentNumber", "DocumentDate", "DocumentValue", "IdentityType", "IdentityNumber", "Name", "StampDutyExempted"]
        };
        function M7_changeType() {
            const type = document.getElementById("m7_docType").value;
            const columns = M7_config[type] || [];
            document.getElementById("m7_tableHead").innerHTML = "<tr>" + columns.map(col => `<th class="px-4 py-3 font-semibold border-r">${col}</th>`).join("") + `<th class="px-4 py-3 font-semibold text-center sticky right-0 bg-slate-200 border-l">Aksi</th></tr>`;
            document.getElementById("m7_tableBody").innerHTML = ""; M7_addRow();
        }
        function M7_addRow() {
            const columns = M7_config[document.getElementById("m7_docType").value] || [];
            const tr = document.createElement("tr"); tr.className = "hover:bg-slate-50";
            columns.forEach(col => {
                const td = document.createElement("td"); td.className = "px-2 py-2 border-r";
                td.innerHTML = `<input type="text" name="${col}" placeholder="${col}">`; tr.appendChild(td);
            });
            const tdAction = document.createElement("td"); tdAction.className = "px-4 py-2 text-center sticky right-0 bg-white border-l";
            tdAction.innerHTML = `<button class="text-rose-600 hover:bg-rose-100 font-semibold px-2 py-1 rounded" onclick="this.parentElement.parentElement.remove(); saveCache();">Hapus</button>`;
            tr.appendChild(tdAction); document.getElementById("m7_tableBody").appendChild(tr);
        }
        function M7_generateXML() {
            const type = document.getElementById("m7_docType").value;
            const cTIN = document.getElementById("m7_collectorTIN").value.trim();
            const rows = document.querySelectorAll("#m7_tableBody tr");
            if(rows.length === 0) return alert("Kosong!");
            let rTag = type === "L3" ? "StampDutyL3Bulk" : "StampDutyL4Bulk";
            let xmlString = `<?xml version="1.0" encoding="utf-8"?>\n<${rTag}>\n\t<CollectorTIN>${cTIN}</CollectorTIN>\n\t<ListOfStampDuty>\n`;
            rows.forEach(row => {
                xmlString += `\t\t<StampDuty>\n`;
                row.querySelectorAll("input").forEach(inp => {
                    let val = inp.value.trim();
                    xmlString += (val === "" || val.toUpperCase() === "NIL") ? `\t\t\t<${inp.name}/>\n` : `\t\t\t<${inp.name}>${val}</${inp.name}>\n`;
                });
                xmlString += `\t\t</StampDuty>\n`;
            });
            xmlString += `\t</ListOfStampDuty>\n</${rTag}>`;
            downloadBlob(xmlString, `BeaMeterai_${type}_${cTIN}.xml`);
        }

        // ==========================================
        // Helper Download Blob
        // ==========================================
        function downloadBlob(content, filename) {
            const blob = new Blob([content], { type: "application/xml" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // ==========================================
        // INISIALISASI
        // ==========================================
        window.onload = () => {
            // Setup Select Options jika cache kosong
            if(!localStorage.getItem('omni_corevert_cache')) {
                M1_changeType(); M2_changeType(); M3_changeType(); M4_changeType(); 
                M5_changeType(); M6_changeType(); M7_changeType();
            } else {
                restoreCache();
            }
        };
    </script>
</body>
</html>
