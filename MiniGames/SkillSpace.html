<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SkillSpace</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #030308;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* Container game mempertahankan rasio aspek 3:4 agar konsisten di semua device */
        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 640px;
            background: linear-gradient(180deg, #050514 0%, #120b29 100%);
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.1);
            border-radius: 0;
            overflow: hidden;
            transition: background 0.5s ease, box-shadow 0.5s ease;
        }

        /* Tema Frenzy untuk Container */
        #game-wrapper.frenzy-mode {
            background: linear-gradient(180deg, #1a0202 0%, #290b0b 100%);
            box-shadow: 0 0 50px rgba(255, 50, 50, 0.2);
        }

        @media (min-width: 481px) {
            #game-wrapper {
                border-radius: 20px;
                height: 90vh;
                border: 2px solid rgba(0, 255, 255, 0.1);
            }
            #game-wrapper.frenzy-mode {
                border: 2px solid rgba(255, 50, 50, 0.3);
            }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none; 
        }

        #ingame-ui {
            position: absolute;
            top: 10%;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.3s;
        }
        
        #live-score {
            font-size: 4rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            margin: 0;
            line-height: 1;
        }

        /* Efek Teks Skor Mode Frenzy */
        .frenzy-mode #live-score {
            text-shadow: 0 0 15px rgba(255, 50, 50, 0.8);
            color: rgba(255, 200, 200, 0.9);
        }

        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 20, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .frenzy-mode .screen-overlay {
            background: rgba(20, 5, 5, 0.7);
        }

        .screen-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .glass-panel {
            background: rgba(20, 20, 40, 0.7);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            transform: translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 255, 255, 0.1);
            width: 85%;
        }

        .frenzy-mode .glass-panel {
            background: rgba(40, 10, 10, 0.8);
            border-color: rgba(255, 50, 50, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 50, 50, 0.2);
        }

        .screen-overlay.active .glass-panel {
            transform: translateY(0);
        }

        .glass-panel h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            color: #0ff;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
            letter-spacing: 2px;
        }

        .frenzy-mode .glass-panel h1 {
            color: #ff3333;
            text-shadow: 0 0 15px rgba(255, 50, 50, 0.6);
        }

        .glass-panel.danger h1 {
            color: #ff0055;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }

        .glass-panel p {
            color: #a0a0c0;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-item span {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .score-item strong {
            font-size: 2rem;
            color: #fff;
        }

        .score-item strong.best {
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        .btn-neon {
            background: transparent;
            color: #0ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 15px;
            margin-bottom: 10px;
            border: 2px solid #0ff;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .btn-neon:active { transform: scale(0.95); }

        .btn-neon::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,255,255,0.4), transparent);
            transition: all 0.5s;
        }

        .btn-neon:hover::before { left: 100%; }

        .btn-neon:hover {
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }

        /* Tombol Khusus Mode Frenzy */
        .btn-neon.frenzy-btn {
            color: #ff3333;
            border-color: #ff3333;
            margin-bottom: 0;
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 5px rgba(255, 50, 50, 0.2); }
            50% { box-shadow: 0 0 20px rgba(255, 50, 50, 0.6); }
            100% { box-shadow: 0 0 5px rgba(255, 50, 50, 0.2); }
        }

        .btn-neon.frenzy-btn:hover {
            background: rgba(255, 50, 50, 0.15);
            box-shadow: 0 0 25px rgba(255, 50, 50, 0.8);
        }
        .btn-neon.frenzy-btn::before {
            background: linear-gradient(90deg, transparent, rgba(255,50,50,0.4), transparent);
        }

        .btn-neon.disabled {
            opacity: 0.5;
            pointer-events: none;
            border-color: #555;
            color: #555;
            animation: none;
        }

        .mode-badge {
            font-size: 0.7rem;
            background: #ff3333;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            position: absolute;
            top: -10px;
            right: 10px;
            font-weight: 900;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ingame-ui" style="opacity: 0;">
            <p id="live-score">0</p>
        </div>

        <!-- Layar Mulai -->
        <div id="start-screen" class="screen-overlay active">
            <div class="glass-panel">
                <h1>SKILL SPACE</h1>
                <p>Ketuk layar atau Spasi untuk melompat.</p>
                <button class="btn-neon" id="btn-start-normal">MODE NORMAL</button>
                <button class="btn-neon frenzy-btn" id="btn-start-frenzy">
                    MODE FRENZY
                </button>
            </div>
        </div>

        <!-- Layar Game Over -->
        <div id="game-over-screen" class="screen-overlay">
            <div class="glass-panel danger">
                <h1 id="game-over-title">SISTEM GAGAL</h1>
                
                <div class="score-board">
                    <div class="score-item">
                        <span>Skor</span>
                        <strong id="final-score">0</strong>
                    </div>
                    <div class="score-item">
                        <span id="best-score-label">Terbaik</span>
                        <strong class="best" id="best-score">0</strong>
                    </div>
                </div>

                <button class="btn-neon" id="btn-restart">REBOOTING...</button>
                <button class="btn-neon frenzy-btn" id="btn-menu" style="margin-top: 10px; font-size: 0.9rem;">MENU UTAMA</button>
            </div>
        </div>
    </div>

    <script>
        // --- INISIALISASI CANVAS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameWrapper = document.getElementById('game-wrapper');
        
        const GAME_WIDTH = 480;
        const GAME_HEIGHT = 640;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        // --- ELEMEN UI ---
        const uiInGame = document.getElementById('ingame-ui');
        const liveScore = document.getElementById('live-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const bestScoreEl = document.getElementById('best-score');
        const bestScoreLabel = document.getElementById('best-score-label');
        
        const btnStartNormal = document.getElementById('btn-start-normal');
        const btnStartFrenzy = document.getElementById('btn-start-frenzy');
        const btnRestart = document.getElementById('btn-restart');
        const btnMenu = document.getElementById('btn-menu');

        // --- STATE & VARIABEL GAME ---
        let state = 'START'; 
        let frames = 0;
        let score = 0;
        let isFrenzyMode = false;

        // Sistem Highscore terpisah
        let highScoreNormal = localStorage.getItem('skillSpaceNormal') || 0;
        let highScoreFrenzy = localStorage.getItem('skillSpaceFrenzy') || 0;
        
        // Konfigurasi Dinamis
        let config = {};

        let pipes = [];
        let particles = [];
        let stars = [];

        // --- OBJEK GAME ---
        const ship = {
            x: GAME_WIDTH * 0.25,
            y: GAME_HEIGHT / 2,
            radius: 12,
            velocity: 0,
            rotation: 0,

            jump() {
                this.velocity = config.lift;
                // Partikel Ekor: Biru neon untuk normal, Kuning/Merah api untuk Frenzy
                let particleColor = isFrenzyMode ? (Math.random() > 0.5 ? '#ffaa00' : '#ff3333') : '#0ff';
                createParticles(this.x - 10, this.y, 10, particleColor); 
            },

            update() {
                this.velocity += config.gravity;
                this.y += this.velocity;

                if (this.velocity >= config.lift) {
                    this.rotation = Math.min(Math.PI / 4, (this.velocity * 0.1));
                } else {
                    this.rotation = -Math.PI / 8;
                }

                if (this.y + this.radius >= GAME_HEIGHT || this.y - this.radius <= 0) {
                    setGameOver();
                }
            },

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                ctx.fillStyle = isFrenzyMode ? '#ffaa00' : '#0ff';
                ctx.beginPath();
                ctx.moveTo(18, 0); 
                ctx.lineTo(-12, 12); 
                ctx.lineTo(-6, 0); 
                ctx.lineTo(-12, -12); 
                ctx.closePath();
                ctx.fill();
                
                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.moveTo(10, 0);
                ctx.lineTo(-6, 6);
                ctx.lineTo(-2, 0);
                ctx.lineTo(-6, -6);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = isFrenzyMode ? '#fff' : '#ff0055';
                ctx.beginPath();
                ctx.arc(2, 0, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        };

        // --- SISTEM VISUAL ---
        function initStars() {
            stars = [];
            let starMultiplier = isFrenzyMode ? 2 : 1; // Bintang bergerak lebih cepat di mode frenzy
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * GAME_WIDTH,
                    y: Math.random() * GAME_HEIGHT,
                    r: Math.random() * 1.5,
                    speed: (Math.random() * 0.5 + 0.1) * starMultiplier 
                });
            }
            for (let i = 0; i < 30; i++) {
                stars.push({
                    x: Math.random() * GAME_WIDTH,
                    y: Math.random() * GAME_HEIGHT,
                    r: Math.random() * 2 + 1,
                    speed: (Math.random() * 1 + 0.6) * starMultiplier
                });
            }
        }

        function drawStars() {
            // Warna bintang sedikit kemerahan saat Frenzy
            ctx.fillStyle = isFrenzyMode ? 'rgba(255, 200, 200, 0.7)' : 'rgba(255, 255, 255, 0.6)';
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
                
                if (state === 'PLAYING') s.x -= s.speed;
                if (s.x < 0) {
                    s.x = GAME_WIDTH;
                    s.y = Math.random() * GAME_HEIGHT;
                }
            });
        }

        function createParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y + (Math.random() * 8 - 4),
                    vx: -Math.random() * 2 - 1,
                    vy: Math.random() * 2 - 1,
                    life: 1,
                    color: color
                });
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }
        }

        // --- SISTEM RINTANGAN ---
        function managePipes() {
            if (frames % config.spawnRate === 0) {
                // Di mode Frenzy, beri ruang margin lebih besar karena pipa akan berayun naik-turun
                const minHeight = isFrenzyMode ? 90 : 50; 
                const maxPos = GAME_HEIGHT - minHeight - config.pipeGap;
                const gapTop = Math.max(minHeight, Math.random() * maxPos);
                
                pipes.push({
                    x: GAME_WIDTH,
                    baseTop: gapTop,
                    baseBottom: gapTop + config.pipeGap,
                    passed: false,
                    // Parameter Kejutan Frenzy: Berapa cepat berayun dan dari sudut berapa
                    oscillationAngle: isFrenzyMode ? Math.random() * Math.PI * 2 : 0,
                    oscillationSpeed: isFrenzyMode ? Math.random() * 0.05 + 0.02 : 0
                });
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                p.x -= config.speed;

                // Animasi Berayun (Surprise Frenzy!)
                let currentTop = p.baseTop;
                let currentBottom = p.baseBottom;

                if (isFrenzyMode) {
                    p.oscillationAngle += p.oscillationSpeed;
                    let swayOffset = Math.sin(p.oscillationAngle) * 55; // Pipa bergeser maksimal 55px ke atas/bawah
                    currentTop += swayOffset;
                    currentBottom += swayOffset;
                }

                // Cek Tabrakan dengan posisi dinamis yang telah dihitung
                if (circleRectCollide(ship.x, ship.y, ship.radius, p.x, 0, config.pipeWidth, currentTop) ||
                    circleRectCollide(ship.x, ship.y, ship.radius, p.x, currentBottom, config.pipeWidth, GAME_HEIGHT - currentBottom)) {
                    setGameOver();
                }

                if (p.x + config.pipeWidth < ship.x && !p.passed) {
                    score++;
                    liveScore.textContent = score;
                    p.passed = true;
                    
                    let explosionColor = isFrenzyMode ? '#ffaa00' : '#fff';
                    createParticles(ship.x, ship.y, 15, explosionColor); 
                    
                    // Kesulitan bertambah lebih agresif di Frenzy
                    let diffThreshold = isFrenzyMode ? 5 : 10;
                    if(score % diffThreshold === 0) {
                        config.speed += 0.2;
                        config.spawnRate = Math.max(isFrenzyMode ? 50 : 60, config.spawnRate - 5);
                    }
                }

                drawPipeRender(p.x, currentTop, currentBottom);

                if (p.x + config.pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
        }

        function drawPipeRender(x, topY, bottomY) {
            const w = config.pipeWidth;
            
            ctx.fillStyle = isFrenzyMode ? '#1a0000' : '#1a0011';
            ctx.fillRect(x, 0, w, topY);
            ctx.fillRect(x, bottomY, w, GAME_HEIGHT - bottomY);

            const borderSize = 3;
            // Pipa menyala Merah Agresif di Frenzy, Pink di Normal
            ctx.fillStyle = isFrenzyMode ? '#ff3333' : '#ff0055';
            
            ctx.fillRect(x, 0, borderSize, topY); 
            ctx.fillRect(x + w - borderSize, 0, borderSize, topY); 
            ctx.fillRect(x - 4, topY - 10, w + 8, 10); 
            
            ctx.fillRect(x, bottomY, borderSize, GAME_HEIGHT - bottomY); 
            ctx.fillRect(x + w - borderSize, bottomY, borderSize, GAME_HEIGHT - bottomY); 
            ctx.fillRect(x - 4, bottomY, w + 8, 10); 
        }

        function circleRectCollide(cx, cy, radius, rx, ry, rw, rh) {
            let testX = cx; let testY = cy;
            if (cx < rx) testX = rx; else if (cx > rx + rw) testX = rx + rw;
            if (cy < ry) testY = ry; else if (cy > ry + rh) testY = ry + rh;
            let distX = cx - testX; let distY = cy - testY;
            return (distX*distX + distY*distY) <= (radius*radius);
        }

        // --- ALUR GAMEPLAY ---
        function loadConfig(frenzy) {
            if(frenzy) {
                gameWrapper.classList.add('frenzy-mode');
                config = {
                    gravity: 0.35, // Jatuh lebih cepat
                    lift: -6.8,    // Lompatan harus lebih kuat
                    speed: 4.8,    // Kecepatan sangat tinggi
                    pipeGap: 140,  // Celah lebih sempit
                    pipeWidth: 60,
                    spawnRate: 70  // Spawn lebih rapat
                };
            } else {
                gameWrapper.classList.remove('frenzy-mode');
                config = {
                    gravity: 0.25,
                    lift: -5.5,
                    speed: 3,
                    pipeGap: 160,
                    pipeWidth: 60,
                    spawnRate: 100
                };
            }
        }

        function initGame(frenzy) {
            isFrenzyMode = frenzy;
            loadConfig(frenzy);

            ship.y = GAME_HEIGHT / 2;
            ship.velocity = 0;
            ship.rotation = 0;
            pipes = [];
            particles = [];
            score = 0;
            frames = 0;
            liveScore.textContent = score;
            
            initStars();
            
            state = 'PLAYING';
            uiInGame.style.opacity = '1';
            startScreen.classList.remove('active');
            gameOverScreen.classList.remove('active');
            
            ship.jump(); 
        }

        function setGameOver() {
            state = 'GAMEOVER';
            uiInGame.style.opacity = '0';
            
            let deathColor = isFrenzyMode ? '#ffcc00' : '#ff0055';
            createParticles(ship.x, ship.y, 40, deathColor);
            createParticles(ship.x, ship.y, 30, '#fff');

            if (isFrenzyMode) {
                if (score > highScoreFrenzy) {
                    highScoreFrenzy = score;
                    localStorage.setItem('skillSpaceFrenzy', highScoreFrenzy);
                }
                bestScoreEl.textContent = highScoreFrenzy;
                bestScoreLabel.textContent = "Terbaik Frenzy";
                btnRestart.className = "btn-neon frenzy-btn disabled";
                btnMenu.style.display = 'block';
            } else {
                if (score > highScoreNormal) {
                    highScoreNormal = score;
                    localStorage.setItem('skillSpaceNormal', highScoreNormal);
                }
                bestScoreEl.textContent = highScoreNormal;
                bestScoreLabel.textContent = "Terbaik Normal";
                btnRestart.className = "btn-neon danger disabled";
                btnMenu.style.display = 'block';
            }

            finalScoreEl.textContent = score;
            gameOverScreen.classList.add('active');

            btnRestart.textContent = "MEMPROSES...";
            
            setTimeout(() => {
                btnRestart.textContent = "COBA LAGI";
                btnRestart.classList.remove('disabled');
            }, 600);
        }

        function returnToMenu() {
            state = 'START';
            gameOverScreen.classList.remove('active');
            startScreen.classList.add('active');
            gameWrapper.classList.remove('frenzy-mode');
            isFrenzyMode = false;
        }

        function loop() {
            // Latar belakang bereaksi terhadap mode
            ctx.fillStyle = isFrenzyMode ? '#100101' : '#050514'; 
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            drawStars();

            if (state === 'PLAYING') {
                managePipes();
                ship.update();
                ship.draw();
                frames++;
            } else if (state === 'GAMEOVER') {
                // Saat game over, pipa berhenti bergeser horizontal tetapi yang Frenzy tetap sedikit berayun di tempat untuk efek dramatis
                pipes.forEach(p => {
                    let cTop = p.baseTop;
                    let cBot = p.baseBottom;
                    if(isFrenzyMode) {
                        p.oscillationAngle += p.oscillationSpeed * 0.2; // ayunan melambat
                        let swayOffset = Math.sin(p.oscillationAngle) * 55;
                        cTop += swayOffset;
                        cBot += swayOffset;
                    }
                    drawPipeRender(p.x, cTop, cBot);
                });
            } else if (state === 'START') {
                ship.y = (GAME_HEIGHT / 2) + Math.sin(Date.now() / 300) * 10;
                ship.draw();
            }

            updateAndDrawParticles();

            requestAnimationFrame(loop);
        }

        // --- PENGENDALI INPUT ---
        function handleInput(e) {
            if(e && e.type !== 'keydown') e.preventDefault(); 
            if (state === 'PLAYING') {
                ship.jump();
            }
        }

        canvas.addEventListener('pointerdown', handleInput);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (state === 'PLAYING') {
                    handleInput();
                } else if (state === 'START') {
                    initGame(false); // Default spasi di menu = Normal
                } else if (state === 'GAMEOVER' && !btnRestart.classList.contains('disabled')) {
                    initGame(isFrenzyMode); // Restart dengan mode yang sama
                }
            }
        });

        btnStartNormal.addEventListener('click', () => initGame(false));
        btnStartFrenzy.addEventListener('click', () => initGame(true));
        
        btnRestart.addEventListener('click', () => {
            if (!btnRestart.classList.contains('disabled')) {
                initGame(isFrenzyMode);
            }
        });

        btnMenu.addEventListener('click', returnToMenu);

        // Jalankan awal
        initStars();
        loop();

    </script>
</body>
</html>
