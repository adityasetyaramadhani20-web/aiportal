<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlockBlast</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & Orbitron for Cyber Theme -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <!-- Tone.js for audio -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d0e15;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .cyber-font {
            font-family: 'Orbitron', sans-serif;
        }
        /* Custom Neon styles for Grid and Blocks */
        .board-cell {
            background-color: #1e2030;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.5);
            transition: background-color 0.15s ease, box-shadow 0.15s ease;
        }
        .board-cell.preview-valid {
            background-color: rgba(255, 255, 255, 0.25) !important;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .board-cell.preview-invalid {
            background-color: rgba(239, 68, 68, 0.2) !important;
        }
        /* Block color variations with premium gradients & glows */
        .color-blue {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .color-cyan {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }
        .color-orange {
            background: linear-gradient(135deg, #f97316, #c2410c);
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.5);
        }
        .color-pink {
            background: linear-gradient(135deg, #ec4899, #be185d);
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.5);
        }
        .color-purple {
            background: linear-gradient(135deg, #a855f7, #7e22ce);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }
        .color-green {
            background: linear-gradient(135deg, #10b981, #047857);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        .color-yellow {
            background: linear-gradient(135deg, #eab308, #a16207);
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.5);
        }
        /* SPECIAL BOMB BLOCK */
        .color-bomb {
            background: radial-gradient(circle, #ff3333 0%, #990000 100%);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
            animation: pulse-bomb 1s infinite alternate;
            position: relative;
        }
        @keyframes pulse-bomb {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(0.95); filter: brightness(1.3); }
        }
        /* Custom floating active block element style */
        .dragging-block {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            transform: scale(1.1);
            opacity: 0.9;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.5));
            transition: transform 0.05s linear;
        }
        /* Score splash text animation */
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.3); opacity: 0; }
        }
        .splash-text {
            animation: floatUp 0.8s forwards ease-out;
        }
        /* Scale-down effect for clearing blocks */
        .block-clear-anim {
            animation: shrinkOut 0.3s forwards ease-in-out;
        }
        @keyframes shrinkOut {
            0% { transform: scale(1); opacity: 1; filter: brightness(2); }
            100% { transform: scale(0); opacity: 0; }
        }
        /* Timer bar style */
        .timer-container {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-4 text-white">

    <!-- Header Section -->
    <header class="w-full max-w-md flex justify-between items-center mb-1">
        <div>
            <h1 class="text-2xl font-black tracking-wider cyber-font text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">
                NEON BLAST
            </h1>
            <p class="text-xs text-gray-400">Cocokkan block untuk blast!</p>
        </div>
        <!-- Sound control -->
        <button id="sound-toggle" class="bg-gray-800 hover:bg-gray-700 p-2 rounded-full transition border border-gray-700">
            <svg id="sound-icon-on" class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M12 18.75V5.25L7.75 9.5H4.5v5h3.25L12 18.75z"/></svg>
            <svg id="sound-icon-off" class="w-5 h-5 text-red-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" /></svg>
        </button>
    </header>

    <!-- Mode & Timer Indicator (Visible only in Frenzy) -->
    <section id="timer-bar" class="w-full max-w-md mb-2 hidden timer-container">
        <div class="bg-gray-900/80 border border-red-500/30 rounded-xl p-2 backdrop-blur-sm">
            <div class="flex justify-between items-center text-xs font-bold mb-1 px-1">
                <span class="text-red-400 tracking-wider uppercase flex items-center gap-1">⚡ Frenzy Mode</span>
                <span id="timer-text" class="text-red-400 cyber-font text-sm">60s</span>
            </div>
            <div class="w-full bg-gray-900 h-2 rounded-full overflow-hidden border border-gray-800">
                <div id="timer-progress" class="bg-gradient-to-r from-red-500 to-orange-500 h-full w-full transition-all duration-200"></div>
            </div>
        </div>
    </section>

    <!-- Score Board -->
    <section class="w-full max-w-md flex gap-4 mb-3">
        <div class="flex-1 bg-gray-900/60 border border-cyan-500/20 rounded-xl p-3 text-center backdrop-blur-sm relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-tr from-cyan-500/5 to-transparent"></div>
            <div class="text-xs font-bold uppercase tracking-widest text-cyan-400">Skor</div>
            <div id="current-score" class="text-3xl font-extrabold tracking-wider cyber-font">0</div>
        </div>
        <div class="flex-1 bg-gray-900/60 border border-purple-500/20 rounded-xl p-3 text-center backdrop-blur-sm relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-tr from-purple-500/5 to-transparent"></div>
            <div class="text-xs font-bold uppercase tracking-widest text-purple-400">Tertinggi</div>
            <div id="high-score" class="text-3xl font-extrabold tracking-wider cyber-font">0</div>
        </div>
    </section>

    <!-- Main Game Board Container -->
    <main class="relative w-full max-w-md aspect-square bg-[#131420] border-2 border-gray-800 rounded-2xl p-2 shadow-2xl flex items-center justify-center">
        <!-- The Game Grid -->
        <div id="game-board" class="grid grid-cols-8 grid-rows-8 gap-1.5 w-full h-full relative z-10">
            <!-- 64 cells will be injected dynamically -->
        </div>

        <!-- Canvas for particle explosions overlay -->
        <canvas id="particle-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-20"></canvas>

        <!-- Splash notifications overlay for score boosts -->
        <div id="splash-container" class="absolute inset-0 pointer-events-none z-30 flex items-center justify-center overflow-hidden"></div>

        <!-- Mode Selection Screen (Overlay on Start & Restart) -->
        <div id="mode-selection-screen" class="absolute inset-0 z-40 bg-black/95 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center gap-4 transition-all duration-300">
            <div class="text-center p-6">
                <span class="text-xs uppercase font-extrabold text-cyan-400 tracking-widest cyber-font mb-1 block">Selamat Datang di</span>
                <h2 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 tracking-wider cyber-font mb-6">
                    NEON BLAST
                </h2>
                <p class="text-sm text-gray-400 mb-8 max-w-xs mx-auto">Pilih mode bermain Anda untuk menantang rekor terbaik!</p>

                <div class="flex flex-col gap-4 w-full max-w-xs mx-auto">
                    <!-- Classic Button -->
                    <button id="btn-mode-classic" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold py-3 px-6 rounded-xl transition duration-150 transform hover:scale-105 active:scale-95 shadow-lg shadow-cyan-500/20 text-left flex justify-between items-center">
                        <div>
                            <span class="block text-lg font-bold cyber-font">CLASSIC MODE</span>
                            <span class="block text-xs text-blue-100 font-normal">Santai tanpa batasan waktu</span>
                        </div>
                        <span class="text-2xl">🧩</span>
                    </button>

                    <!-- Frenzy Button -->
                    <button id="btn-mode-frenzy" class="w-full bg-gradient-to-r from-red-600 to-orange-500 hover:from-red-500 hover:to-orange-400 text-white font-bold py-3 px-6 rounded-xl transition duration-150 transform hover:scale-105 active:scale-95 shadow-lg shadow-red-500/20 text-left flex justify-between items-center">
                        <div>
                            <span class="block text-lg font-bold cyber-font">FRENZY MODE</span>
                            <span class="block text-xs text-red-100 font-normal">Waktu 60 detik + Blok Bom!</span>
                        </div>
                        <span class="text-2xl">💣</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Game Over Modal (Embedded directly inside Board area for aesthetic focus) -->
        <div id="game-over-screen" class="absolute inset-0 z-40 bg-black/90 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center gap-4 transition-all duration-300 opacity-0 pointer-events-none">
            <div class="text-center p-6 transform translate-y-4 transition-transform duration-300" id="game-over-content">
                <span class="text-xs uppercase font-extrabold text-red-500 tracking-widest cyber-font mb-1 block" id="game-over-reason">Yahh! Terjebak!</span>
                <h2 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500 tracking-wider cyber-font mb-4">
                    GAME OVER
                </h2>
                
                <div class="bg-gray-900/80 border border-gray-800 rounded-xl p-4 mb-6 flex flex-col gap-2">
                    <div class="flex justify-between items-center gap-12 text-sm">
                        <span class="text-gray-400 font-semibold">Skor Akhir:</span>
                        <span id="final-score" class="text-2xl font-bold text-white cyber-font">0</span>
                    </div>
                    <div class="flex justify-between items-center gap-12 text-sm">
                        <span class="text-gray-400 font-semibold">Skor Terbaik:</span>
                        <span id="final-high-score" class="text-2xl font-bold text-yellow-400 cyber-font">0</span>
                    </div>
                </div>

                <button id="btn-restart" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-3 px-8 rounded-xl transition duration-150 transform hover:scale-105 active:scale-95 shadow-lg shadow-cyan-500/30">
                    Main Lagi!
                </button>
            </div>
        </div>

        <!-- Combo Multiplier Pop-up -->
        <div id="combo-alert" class="absolute top-4 left-1/2 -translate-x-1/2 bg-yellow-400 text-black px-4 py-1.5 rounded-full font-bold text-sm shadow-xl z-30 pointer-events-none scale-0 transition-all duration-200 uppercase tracking-widest flex items-center gap-1">
            🔥 <span id="combo-count">2</span>x Combo!
        </div>
    </main>

    <!-- Block Inventory (3 blocks to drag) -->
    <section class="w-full max-w-md mt-4">
        <div class="bg-gray-900/40 border border-gray-800 rounded-2xl p-4 flex justify-around items-center gap-2 h-36 backdrop-blur-sm">
            <!-- Three slot divs holding blocks -->
            <div class="shape-slot w-24 h-24 flex items-center justify-center relative" data-index="0"></div>
            <div class="shape-slot w-24 h-24 flex items-center justify-center relative" data-index="1"></div>
            <div class="shape-slot w-24 h-24 flex items-center justify-center relative" data-index="2"></div>
        </div>
    </section>

    <!-- Footer Guide -->
    <footer id="guide-text" class="mt-2 text-center text-xs text-gray-500 select-none">
        Tarik balok ke grid untuk membuat baris & kolom penuh.
    </footer>

    <script>
        // --- Sound System (Tone.js wrapper) ---
        let soundEnabled = true;
        let polySynth, metalSynth;

        function initSynth() {
            if (!polySynth) {
                polySynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'triangle' },
                    envelope: { attack: 0.05, decay: 0.1, sustain: 0.3, release: 0.2 }
                }).toDestination();
                polySynth.volume.value = -8;

                metalSynth = new Tone.MetalSynth({
                    frequency: 200,
                    envelope: { attack: 0.001, decay: 0.15, release: 0.15 },
                    harmonicity: 5.1,
                    resonance: 8000
                }).toDestination();
                metalSynth.volume.value = -10;
            }
        }

        // Play positive chime for fitting a shape
        function playPlaceSound() {
            if (!soundEnabled) return;
            initSynth();
            try {
                polySynth.triggerAttackRelease(["C4", "E4"], "16n");
            } catch(e) {}
        }

        // Play rising melody for successful line clears
        function playBlastSound(comboSize) {
            if (!soundEnabled) return;
            initSynth();
            try {
                const baseNotes = ["C5", "E5", "G5", "C6"];
                const notesToPlay = baseNotes.slice(0, Math.min(baseNotes.length, 2 + comboSize));
                
                notesToPlay.forEach((note, index) => {
                    setTimeout(() => {
                        polySynth.triggerAttackRelease(note, "16n");
                    }, index * 80);
                });
                
                // Add metallic clash
                metalSynth.triggerAttackRelease("8n");
            } catch(e) {}
        }

        // Play explosion sound for Bomb block placement
        function playExplosionSound() {
            if (!soundEnabled) return;
            initSynth();
            try {
                metalSynth.triggerAttackRelease("4n");
                polySynth.triggerAttackRelease(["C3", "G3"], "4n");
            } catch(e) {}
        }

        // Play failure sound sequence
        function playGameOverSound() {
            if (!soundEnabled) return;
            initSynth();
            try {
                polySynth.triggerAttackRelease("A3", "8n", "+0");
                polySynth.triggerAttackRelease("F3", "8n", "+0.15");
                polySynth.triggerAttackRelease("D3", "4n", "+0.3");
            } catch(e) {}
        }

        // Play pickup sound
        function playPickupSound() {
            if (!soundEnabled) return;
            initSynth();
            try {
                polySynth.triggerAttackRelease("G4", "32n");
            } catch(e) {}
        }

        // Toggle Sounds control
        const soundToggle = document.getElementById('sound-toggle');
        const soundOnIcon = document.getElementById('sound-icon-on');
        const soundOffIcon = document.getElementById('sound-icon-off');

        soundToggle.addEventListener('click', async () => {
            await Tone.start();
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundOnIcon.classList.remove('hidden');
                soundOffIcon.classList.add('hidden');
            } else {
                soundOnIcon.classList.add('hidden');
                soundOffIcon.classList.remove('hidden');
            }
        });

        // --- STREAMING_CHUNK: Defining Shapes and Block Database ... ---
        const BLOCK_SHAPES = [
            // 1x1 Dot
            { matrix: [[1]], colorClass: 'color-cyan' },
            // 2x1 line
            { matrix: [[1, 1]], colorClass: 'color-blue' },
            // 3x1 line
            { matrix: [[1, 1, 1]], colorClass: 'color-blue' },
            // 4x1 line
            { matrix: [[1, 1, 1, 1]], colorClass: 'color-blue' },
            // 2x2 Square
            { matrix: [[1, 1], [1, 1]], colorClass: 'color-pink' },
            // 3x3 Big Square
            { matrix: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], colorClass: 'color-purple' },
            // L-Shape right
            { matrix: [[1, 0], [1, 0], [1, 1]], colorClass: 'color-orange' },
            // L-Shape left
            { matrix: [[0, 1], [0, 1], [1, 1]], colorClass: 'color-orange' },
            // T-Shape
            { matrix: [[1, 1, 1], [0, 1, 0]], colorClass: 'color-yellow' },
            // Corners
            { matrix: [[1, 1], [1, 0]], colorClass: 'color-green' },
            { matrix: [[1, 1], [0, 1]], colorClass: 'color-green' },
            // Diagonal/Z shapes
            { matrix: [[1, 1, 0], [0, 1, 1]], colorClass: 'color-pink' },
            // 1x2 Vertical line
            { matrix: [[1], [1]], colorClass: 'color-blue' },
            // 1x3 Vertical line
            { matrix: [[1], [1], [1]], colorClass: 'color-blue' },
            // 1x4 Vertical line
            { matrix: [[1], [1], [1], [1]], colorClass: 'color-blue' }
        ];

        // --- STREAMING_CHUNK: State Management variables ... ---
        const BOARD_SIZE = 8;
        let board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
        let score = 0;
        let highScore = parseInt(localStorage.getItem('neon_blast_highscore') || '0');
        let blockPool = [null, null, null]; // holds standard objects currently available at the bottom
        let activeDragBlock = null; // metadata for current drag item
        let comboStreak = 0; // combo multiplier tracks consecutive line clears
        
        // Mode and Timer variables
        let gameMode = 'classic'; // 'classic' atau 'frenzy'
        let timeLeft = 60;
        let timerInterval = null;
        let isGameRunning = false;

        // --- DOM Elements references ---
        const boardEl = document.getElementById('game-board');
        const scoreEl = document.getElementById('current-score');
        const highScoreEl = document.getElementById('high-score');
        const gameOverScreen = document.getElementById('game-over-screen');
        const gameOverContent = document.getElementById('game-over-content');
        const gameOverReason = document.getElementById('game-over-reason');
        const finalScoreEl = document.getElementById('final-score');
        const finalHighScoreEl = document.getElementById('final-high-score');
        const btnRestart = document.getElementById('btn-restart');
        const splashContainer = document.getElementById('splash-container');
        const comboAlert = document.getElementById('combo-alert');
        const comboCountEl = document.getElementById('combo-count');
        
        // Mode Selection & Timer Elements
        const modeSelectionScreen = document.getElementById('mode-selection-screen');
        const btnModeClassic = document.getElementById('btn-mode-classic');
        const btnModeFrenzy = document.getElementById('btn-mode-frenzy');
        const timerBar = document.getElementById('timer-bar');
        const timerText = document.getElementById('timer-text');
        const timerProgress = document.getElementById('timer-progress');
        const guideText = document.getElementById('guide-text');

        // Init High Score display
        highScoreEl.innerText = highScore;

        // --- Initialize Grid UI Cells ---
        const cellsUI = [];
        function createBoardUI() {
            boardEl.innerHTML = '';
            cellsUI.length = 0; // clear array safely
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'board-cell rounded-md w-full h-full';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    boardEl.appendChild(cell);
                    cellsUI.push(cell);
                }
            }
        }
        createBoardUI();

        // Get cell element helper
        function getCellEl(r, c) {
            return cellsUI[r * BOARD_SIZE + c];
        }

        // --- STREAMING_CHUNK: Rendering the Game Board State ... ---
        function renderBoardState() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cellVal = board[r][c];
                    const cellEl = getCellEl(r, c);
                    
                    // Clear cell classes
                    cellEl.className = 'board-cell rounded-md w-full h-full';
                    cellEl.innerHTML = ''; // clear bomb icons if any
                    
                    if (cellVal) {
                        cellEl.classList.add(cellVal);
                        // If cell was frozen with bomb status (unlikely but safe check)
                        if (cellVal === 'color-bomb') {
                            cellEl.innerHTML = '<div class="w-full h-full flex items-center justify-center text-sm">💣</div>';
                        }
                    }
                }
            }
        }

        // Generate dynamic 3 items in pool
        function generateBlockPool() {
            const slots = document.querySelectorAll('.shape-slot');
            slots.forEach((slot, index) => {
                slot.innerHTML = '';
                
                // 15% Chance of spawning a special 1x1 Bomb block in Frenzy Mode
                const isBombChance = gameMode === 'frenzy' && Math.random() < 0.18;
                let blockObj;

                if (isBombChance) {
                    blockObj = {
                        matrix: [[1]],
                        colorClass: 'color-bomb',
                        isBomb: true,
                        placed: false
                    };
                } else {
                    // Pick a random template from standard block lists
                    const template = BLOCK_SHAPES[Math.floor(Math.random() * BLOCK_SHAPES.length)];
                    // Deep copy template shape structure
                    blockObj = {
                        matrix: JSON.parse(JSON.stringify(template.matrix)),
                        colorClass: template.colorClass,
                        isBomb: false,
                        placed: false
                    };
                }
                
                blockPool[index] = blockObj;
                
                // Build Mini Block Grid visual representing shape inside slot
                const blockGrid = createVisualBlockGrid(blockObj, false);
                blockGrid.dataset.slotIndex = index;
                slot.appendChild(blockGrid);
                
                // Add pointer event handling
                blockGrid.addEventListener('mousedown', (e) => startDrag(e, index, blockObj, false));
                blockGrid.addEventListener('touchstart', (e) => startDrag(e, index, blockObj, true), { passive: false });
            });
        }

        // Helper to construct grid representing shape visual
        function createVisualBlockGrid(blockObj, isMiniPreview = false) {
            const matrix = blockObj.matrix;
            const colorClass = blockObj.colorClass;
            const isBomb = blockObj.isBomb;
            
            const blockContainer = document.createElement('div');
            blockContainer.className = 'grid gap-0.5 select-none pointer-events-auto cursor-grab active:cursor-grabbing';
            const rows = matrix.length;
            const cols = matrix[0].length;
            
            blockContainer.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
            blockContainer.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

            // Adjust sizing
            const cellSizeClass = isMiniPreview ? 'w-4 h-4 text-[10px]' : 'w-7 h-7 text-xs';
            blockContainer.classList.add(isMiniPreview ? 'gap-0.5' : 'gap-1');

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const blockCell = document.createElement('div');
                    blockCell.className = `${cellSizeClass} flex items-center justify-center rounded-sm`;
                    if (matrix[r][c] === 1) {
                        blockCell.className += ` ${colorClass}`;
                        if (isBomb) {
                            blockCell.innerHTML = '💣';
                        }
                    } else {
                        blockCell.className += ' bg-transparent';
                    }
                    blockContainer.appendChild(blockCell);
                }
            }
            return blockContainer;
        }

        // --- STREAMING_CHUNK: Timer System Logic for Frenzy Mode ... ---
        function startFrenzyTimer() {
            stopFrenzyTimer();
            timeLeft = 60;
            updateTimerUI();
            
            timerInterval = setInterval(() => {
                if (!isGameRunning) return;
                timeLeft--;
                updateTimerUI();
                
                if (timeLeft <= 0) {
                    stopFrenzyTimer();
                    triggerGameOver("Waktu Habis!");
                }
            }, 1000);
        }

        function stopFrenzyTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimerUI() {
            timerText.innerText = `${timeLeft}s`;
            const percentage = (timeLeft / 60) * 100;
            timerProgress.style.width = `${Math.min(100, percentage)}%`;
            
            // Visual warning when time runs low
            if (timeLeft <= 15) {
                timerText.classList.add('animate-pulse');
                timerProgress.classList.remove('from-red-500', 'to-orange-500');
                timerProgress.classList.add('bg-red-600');
            } else {
                timerText.classList.remove('animate-pulse');
                timerProgress.classList.add('from-red-500', 'to-orange-500');
                timerProgress.classList.remove('bg-red-600');
            }
        }

        // --- STREAMING_CHUNK: Drag and Drop Handlers ... ---
        let dragElement = null;
        let dragOffset = { x: 0, y: 0 };

        function startDrag(e, slotIdx, blockObj, isTouch) {
            // Initiate Tone context on interaction
            Tone.start();

            if (!isGameRunning || blockPool[slotIdx] === null || blockPool[slotIdx].placed) return;
            
            if (isTouch) {
                e.preventDefault(); // prevent scrolling
            }

            playPickupSound();

            const clientX = isTouch ? e.touches[0].clientX : e.clientX;
            const clientY = isTouch ? e.touches[0].clientY : e.clientY;

            // Define current active block state
            activeDragBlock = {
                blockObj: blockObj,
                slotIdx: slotIdx,
                rows: blockObj.matrix.length,
                cols: blockObj.matrix[0].length
            };

            // Hide the block inside the physical inventory slot
            const slots = document.querySelectorAll('.shape-slot');
            slots[slotIdx].classList.add('opacity-25');

            // Generate absolute-positioned clone to fly around screen
            dragElement = document.createElement('div');
            dragElement.className = 'dragging-block';
            
            // Build larger scale representation for smooth grid placement matching
            const referenceCell = document.querySelector('.board-cell');
            const targetCellSize = referenceCell.getBoundingClientRect().width;
            
            const shapeGrid = document.createElement('div');
            shapeGrid.className = 'grid gap-1';
            shapeGrid.style.gridTemplateRows = `repeat(${activeDragBlock.rows}, minmax(0, 1fr))`;
            shapeGrid.style.gridTemplateColumns = `repeat(${activeDragBlock.cols}, minmax(0, 1fr))`;
            
            for (let r = 0; r < activeDragBlock.rows; r++) {
                for (let c = 0; c < activeDragBlock.cols; c++) {
                    const blockCell = document.createElement('div');
                    blockCell.style.width = `${targetCellSize}px`;
                    blockCell.style.height = `${targetCellSize}px`;
                    blockCell.className = 'rounded-md flex items-center justify-center';
                    if (blockObj.matrix[r][c] === 1) {
                        blockCell.className += ` ${blockObj.colorClass}`;
                        if (blockObj.isBomb) {
                            blockCell.innerHTML = '<span class="text-xl">💣</span>';
                        }
                    } else {
                        blockCell.className += ` bg-transparent`;
                    }
                    shapeGrid.appendChild(blockCell);
                }
            }
            dragElement.appendChild(shapeGrid);
            document.body.appendChild(dragElement);

            // Calculate bounding box offset so target drag element scales nicely
            const dragRect = dragElement.getBoundingClientRect();
            
            // Offset logic: On touch device, float the block slightly above fingers so visible
            const verticalTouchOffset = isTouch ? dragRect.height * 1.0 : dragRect.height / 2;
            dragOffset.x = dragRect.width / 2;
            dragOffset.y = verticalTouchOffset;

            updateDragPosition(clientX, clientY);

            // Hook Global interaction up listeners
            if (isTouch) {
                window.addEventListener('touchmove', handleTouchMove, { passive: false });
                window.addEventListener('touchend', handleDragEnd);
            } else {
                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mouseup', handleDragEnd);
            }
        }

        function handleMouseMove(e) {
            updateDragPosition(e.clientX, e.clientY);
            checkDragHover(e.clientX, e.clientY);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            const clientX = e.touches[0].clientX;
            const clientY = e.touches[0].clientY;
            updateDragPosition(clientX, clientY);
            checkDragHover(clientX, clientY);
        }

        function updateDragPosition(x, y) {
            if (dragElement) {
                dragElement.style.left = `${x - dragOffset.x}px`;
                dragElement.style.top = `${y - dragOffset.y}px`;
            }
        }

        // Clear hover visual effects off grid
        function clearHoverEffects() {
            cellsUI.forEach(cell => {
                cell.classList.remove('preview-valid', 'preview-invalid');
            });
        }

        // --- STREAMING_CHUNK: Detecting Hover and Grid intersections ... ---
        function checkDragHover(clientX, clientY) {
            clearHoverEffects();
            if (!activeDragBlock) return;

            const gridRect = boardEl.getBoundingClientRect();
            
            const dragX = clientX - dragOffset.x;
            const dragY = clientY - dragOffset.y;
            
            const cellWidth = gridRect.width / BOARD_SIZE;
            const cellHeight = gridRect.height / BOARD_SIZE;

            const relativeX = dragX - gridRect.left;
            const relativeY = dragY - gridRect.top;

            const col = Math.round(relativeX / cellWidth);
            const row = Math.round(relativeY / cellHeight);

            // Validate placing possibility
            const canPlace = checkFit(activeDragBlock.blockObj.matrix, row, col);

            // Draw visual preview highlighting
            for (let r = 0; r < activeDragBlock.rows; r++) {
                for (let c = 0; c < activeDragBlock.cols; c++) {
                    if (activeDragBlock.blockObj.matrix[r][c] === 1) {
                        const targetR = row + r;
                        const targetC = col + c;

                        if (targetR >= 0 && targetR < BOARD_SIZE && targetC >= 0 && targetC < BOARD_SIZE) {
                            const targetCell = getCellEl(targetR, targetC);
                            if (canPlace) {
                                targetCell.classList.add('preview-valid');
                            } else {
                                targetCell.classList.add('preview-invalid');
                            }
                        }
                    }
                }
            }
        }

        // Game logical boundary placement check
        function checkFit(matrix, startRow, startCol) {
            const rows = matrix.length;
            const cols = matrix[0].length;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (matrix[r][c] === 1) {
                        const targetR = startRow + r;
                        const targetC = startCol + c;

                        // Check out of bounds
                        if (targetR < 0 || targetR >= BOARD_SIZE || targetC < 0 || targetC >= BOARD_SIZE) {
                            return false;
                        }
                        // Check slot collision
                        if (board[targetR][targetC] !== null) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        // --- STREAMING_CHUNK: Placement and Scoring ... ---
        function handleDragEnd(e) {
            window.removeEventListener('mousemove', handleMouseMove);
            window.removeEventListener('mouseup', handleDragEnd);
            window.removeEventListener('touchmove', handleTouchMove);
            window.removeEventListener('touchend', handleDragEnd);

            if (!activeDragBlock) return;

            let clientX, clientY;
            if (e.type === 'touchend') {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const gridRect = boardEl.getBoundingClientRect();
            const dragX = clientX - dragOffset.x;
            const dragY = clientY - dragOffset.y;
            
            const cellWidth = gridRect.width / BOARD_SIZE;
            const cellHeight = gridRect.height / BOARD_SIZE;

            const relativeX = dragX - gridRect.left;
            const relativeY = dragY - gridRect.top;

            const col = Math.round(relativeX / cellWidth);
            const row = Math.round(relativeY / cellHeight);

            const blockPlaced = attemptPlacement(activeDragBlock.blockObj, row, col, activeDragBlock.slotIdx);

            if (dragElement) {
                dragElement.remove();
                dragElement = null;
            }

            const slots = document.querySelectorAll('.shape-slot');
            
            if (blockPlaced) {
                slots[activeDragBlock.slotIdx].innerHTML = '';
                slots[activeDragBlock.slotIdx].classList.remove('opacity-25');
                blockPool[activeDragBlock.slotIdx] = null;

                // Process board clears
                processBoardClears();

                const activePoolCount = blockPool.filter(b => b !== null).length;
                if (activePoolCount === 0) {
                    generateBlockPool();
                }

                checkGameOverCondition();
            } else {
                slots[activeDragBlock.slotIdx].classList.remove('opacity-25');
            }

            clearHoverEffects();
            activeDragBlock = null;
        }

        function attemptPlacement(blockObj, row, col, slotIdx) {
            if (checkFit(blockObj.matrix, row, col)) {
                
                // --- SPECIAL BOMB BLOCK ACTION ---
                if (blockObj.isBomb) {
                    playExplosionSound();
                    
                    // Trigger massive 3x3 destruction centered on the placed coordinate
                    let cellsDestroyedCount = 0;
                    
                    for (let r = row - 1; r <= row + 1; r++) {
                        for (let c = col - 1; c <= col + 1; c++) {
                            if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE) {
                                if (board[r][c] !== null) {
                                    triggerCellDissolve(r, c, '#ff3333');
                                    board[r][c] = null;
                                    cellsDestroyedCount++;
                                } else {
                                    // Make empty cells flare up with small shockwave spark
                                    const cellEl = getCellEl(r, c);
                                    const rect = cellEl.getBoundingClientRect();
                                    const canvasRect = canvas.getBoundingClientRect();
                                    const px = (rect.left + rect.width / 2) - canvasRect.left;
                                    const py = (rect.top + rect.height / 2) - canvasRect.top;
                                    spawnBlastParticles(px, py, '#ff6a00', 6);
                                }
                            }
                        }
                    }
                    
                    renderBoardState();
                    
                    // Award bonus bomb blast points (15 points per cell cleared by bomb)
                    if (cellsDestroyedCount > 0) {
                        addPoints(cellsDestroyedCount * 15, `💥 BOMB BLAST!`, row, col);
                    } else {
                        addPoints(10, `Bomb diletakkan`, row, col);
                    }
                    
                    return true;
                }

                // Standard block placement
                const rows = blockObj.matrix.length;
                const cols = blockObj.matrix[0].length;
                
                let cellsPlacedCount = 0;
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (blockObj.matrix[r][c] === 1) {
                            board[row + r][col + c] = blockObj.colorClass;
                            cellsPlacedCount++;
                        }
                    }
                }

                renderBoardState();
                playPlaceSound();
                addPoints(cellsPlacedCount, "Balok ditempatkan", row, col);
                return true;
            }
            return false;
        }

        // Score allocator helper displaying splash indicator
        function addPoints(pts, message, r, c, isTimeBonus = false) {
            score += pts;
            scoreEl.innerText = score;

            if (score > highScore) {
                highScore = score;
                highScoreEl.innerText = highScore;
                localStorage.setItem('neon_blast_highscore', highScore);
            }

            // Show floaty text
            triggerFloatyText(isTimeBonus ? `+5s` : `+${pts}`, r, c, isTimeBonus ? '#10b981' : '#fde047');
        }

        // --- STREAMING_CHUNK: Line Clears, Combos, and Particle Systems ... ---
        function triggerFloatyText(text, row, col, colorHex = '#fde047') {
            const el = document.createElement('div');
            el.className = 'absolute splash-text font-black text-xl cyber-font z-30 pointer-events-none drop-shadow-[0_4px_6px_rgba(0,0,0,0.8)]';
            el.style.color = colorHex;
            
            const leftPct = ((col + 0.5) / BOARD_SIZE) * 100;
            const topPct = ((row + 0.5) / BOARD_SIZE) * 100;
            
            el.style.left = `${leftPct}%`;
            el.style.top = `${topPct}%`;
            el.style.transform = `translate(-50%, -50%)`;
            el.innerText = text;

            splashContainer.appendChild(el);
            setTimeout(() => {
                el.remove();
            }, 800);
        }

        // Processing Clears on rows/cols simultaneously
        function processBoardClears() {
            let rowsToClear = [];
            let colsToClear = [];

            // Identify completed rows
            for (let r = 0; r < BOARD_SIZE; r++) {
                let rowFull = true;
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === null) {
                        rowFull = false;
                        break;
                    }
                }
                if (rowFull) rowsToClear.push(r);
            }

            // Identify completed columns
            for (let c = 0; c < BOARD_SIZE; c++) {
                let colFull = true;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (board[r][c] === null) {
                        colFull = false;
                        break;
                    }
                }
                if (colFull) colsToClear.push(c);
            }

            const totalClearsCount = rowsToClear.length + colsToClear.length;

            if (totalClearsCount > 0) {
                comboStreak++;
                
                if (comboStreak > 1) {
                    showComboBanner(comboStreak);
                }

                const baseClearPoints = totalClearsCount * 100;
                const comboBonusPoints = (comboStreak - 1) * 50;
                const finalClearPoints = baseClearPoints + comboBonusPoints;

                playBlastSound(comboStreak);

                let midPointR = 4;
                let midPointC = 4;

                rowsToClear.forEach(r => {
                    midPointR = r;
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        triggerCellDissolve(r, c);
                    }
                });

                colsToClear.forEach(c => {
                    midPointC = c;
                    for (let r = 0; r < BOARD_SIZE; r++) {
                        triggerCellDissolve(r, c);
                    }
                });

                addPoints(finalClearPoints, "BLAST!", midPointR, midPointC);

                // --- ADD TIME BONUS IN FRENZY MODE ---
                if (gameMode === 'frenzy') {
                    // +5 Seconds per line clear, maximum timer stack of 90 seconds
                    const oldTime = timeLeft;
                    timeLeft = Math.min(90, timeLeft + (5 * totalClearsCount));
                    updateTimerUI();
                    
                    // Display visual +5s text splash for each clear line
                    for (let i = 0; i < totalClearsCount; i++) {
                        setTimeout(() => {
                            triggerFloatyText("+5s", Math.min(7, midPointR + i), midPointC, '#10b981');
                        }, i * 150);
                    }
                }

                // Timeout removal from grid State to allow dissolving animations to look clean
                setTimeout(() => {
                    rowsToClear.forEach(r => {
                        for (let c = 0; c < BOARD_SIZE; c++) {
                            board[r][c] = null;
                        }
                    });

                    colsToClear.forEach(c => {
                        for (let r = 0; r < BOARD_SIZE; r++) {
                            board[r][c] = null;
                        }
                    });

                    renderBoardState();
                    checkGameOverCondition();
                }, 300);

            } else {
                comboStreak = 0;
                hideComboBanner();
            }
        }

        // Visual animation dissolver
        function triggerCellDissolve(r, c, overrideColor = null) {
            const cellEl = getCellEl(r, c);
            const colorClass = board[r][c];
            
            cellEl.classList.add('block-clear-anim');

            const rect = cellEl.getBoundingClientRect();
            const canvasRect = canvas.getBoundingClientRect();
            
            const px = (rect.left + rect.width / 2) - canvasRect.left;
            const py = (rect.top + rect.height / 2) - canvasRect.top;

            let particleColor = '#ffffff';
            if (overrideColor) {
                particleColor = overrideColor;
            } else if (colorClass) {
                if (colorClass.includes('cyan')) particleColor = '#06b6d4';
                else if (colorClass.includes('blue')) particleColor = '#3b82f6';
                else if (colorClass.includes('pink')) particleColor = '#ec4899';
                else if (colorClass.includes('purple')) particleColor = '#a855f7';
                else if (colorClass.includes('orange')) particleColor = '#f97316';
                else if (colorClass.includes('green')) particleColor = '#10b981';
                else if (colorClass.includes('yellow')) particleColor = '#eab308';
                else if (colorClass.includes('bomb')) particleColor = '#ef4444';
            }

            spawnBlastParticles(px, py, particleColor, 12);
        }

        function showComboBanner(streak) {
            comboCountEl.innerText = streak;
            comboAlert.style.transform = 'translateX(-50%) scale(1.1)';
            comboAlert.classList.remove('scale-0');
            comboAlert.classList.add('scale-100');
        }

        function hideComboBanner() {
            comboAlert.classList.remove('scale-100');
            comboAlert.classList.add('scale-0');
        }

        // --- STREAMING_CHUNK: Canvas Particle Engine ... ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            const parent = canvas.parentElement;
            canvas.width = parent.clientWidth;
            canvas.height = parent.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 3;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.radius = Math.random() * 3 + 2;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.02;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1; // mild gravity effect
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function spawnBlastParticles(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // Canvas animation frame loop
        function drawParticlesLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(drawParticlesLoop);
        }
        requestAnimationFrame(drawParticlesLoop);

        // --- STREAMING_CHUNK: Game Over Mechanics ... ---
        function checkGameOverCondition() {
            if (!isGameRunning) return;

            // Filter only valid remaining blocks inside inventory pool
            const activePoolBlocks = blockPool.filter(block => block !== null);

            // If empty pool, wait till populated
            if (activePoolBlocks.length === 0) return;

            let matchesFound = false;

            for (let i = 0; i < activePoolBlocks.length; i++) {
                const block = activePoolBlocks[i];
                
                // Bomb block can always be placed anywhere as long as there is 1 free cell (since it's 1x1)
                // In classic logic, checkFit handles 1x1 perfectly.
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (checkFit(block.matrix, r, c)) {
                            matchesFound = true;
                            break;
                        }
                    }
                    if (matchesFound) break;
                }
                if (matchesFound) break;
            }

            // No valid spots anywhere - Trigger Game Over sequence
            if (!matchesFound) {
                triggerGameOver("Yahh! Terjebak!");
            }
        }

        function triggerGameOver(reasonText = "GAME OVER") {
            isGameRunning = false;
            stopFrenzyTimer();
            playGameOverSound();
            
            gameOverReason.innerText = reasonText;
            finalScoreEl.innerText = score;
            finalHighScoreEl.innerText = highScore;

            // Display overlay UI
            gameOverScreen.classList.remove('opacity-0', 'pointer-events-none');
            gameOverContent.classList.remove('translate-y-4');
        }

        // Reset system to zero
        function restartGame() {
            stopFrenzyTimer();
            isGameRunning = false;
            
            // Clear Screen Overlays and show Mode Selection again
            gameOverScreen.classList.add('opacity-0', 'pointer-events-none');
            gameOverContent.classList.add('translate-y-4');
            modeSelectionScreen.classList.remove('opacity-0', 'pointer-events-none');
        }

        // Start specific selected mode
        function startNewGame(mode) {
            gameMode = mode;
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            score = 0;
            scoreEl.innerText = '0';
            comboStreak = 0;
            hideComboBanner();
            renderBoardState();
            
            // Toggle Timer Bar UI
            if (gameMode === 'frenzy') {
                timerBar.classList.remove('hidden');
                guideText.innerText = "Kumpulkan skor! Ledakan baris/kolom untuk +5 detik.";
                startFrenzyTimer();
            } else {
                timerBar.classList.add('hidden');
                guideText.innerText = "Tarik balok ke grid untuk membuat baris & kolom penuh.";
            }

            // Re-populate choices and initiate game play flag
            generateBlockPool();
            modeSelectionScreen.classList.add('opacity-0', 'pointer-events-none');
            
            isGameRunning = true;
        }

        // Mode Button click Listeners
        btnModeClassic.addEventListener('click', () => {
            Tone.start();
            startNewGame('classic');
        });
        
        btnModeFrenzy.addEventListener('click', () => {
            Tone.start();
            startNewGame('frenzy');
        });

        btnRestart.addEventListener('click', restartGame);

        // --- Initialize Game On Page Load ---
        window.onload = function() {
            // Game waits for user mode choice in overlay screen on load
        }
    </script>
</body>
