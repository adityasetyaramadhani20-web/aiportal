<!DOCTYPE html> 
<html lang="id"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
    <title>Snake</title> 
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style> 
        :root {
            --bg-color: #1a1a2e;
            --panel-color: #16213e;
            --accent-color: #0f3460;
            --text-color: #e94560;
            --neon-blue: #00fff5;
            --neon-green: #00ff84;
            --neon-purple: #bc13fe; 
            --neon-pink: #ff007f;
        }

        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: var(--bg-color); 
            font-family: 'Press Start 2P', cursive; 
            color: #fff; 
            overflow: hidden; 
            background-image: radial-gradient(#252540 1px, transparent 1px);
            background-size: 30px 30px;
        } 
 
        .main-container { 
            display: flex; 
            flex-direction: row; 
            width: 100%; 
            max-width: 1000px; 
            height: 85vh; 
            max-height: 700px; 
            border-radius: 20px; 
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 10px var(--neon-blue); 
            background-color: var(--panel-color); 
            padding: 20px; 
            gap: 20px;
            border: 2px solid #333;
        } 
         
        .game-area { 
            flex: 2; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative; 
            background: #000;
            border-radius: 12px;
            border: 4px solid #333;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
        } 
 
        canvas { 
            background-color: #111; 
            border-radius: 4px; 
            box-shadow: 0 0 15px rgba(0, 255, 245, 0.1); 
            image-rendering: pixelated;
        } 
 
        .controls-area { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            min-width: 250px; 
            overflow-y: auto;
        } 
 
        .info-panel { 
            background: linear-gradient(145deg, #1f2b4d, #16213e);
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        } 

        .score-display {
            font-size: 20px;
            color: var(--neon-green);
            text-shadow: 0 0 5px var(--neon-green);
            margin-bottom: 10px;
            display: block;
        }

        .obstacle-display {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: #bbb;
        }
 
        .settings-panel {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 16px;
            color: var(--neon-blue);
            text-align: left;
            margin-bottom: 4px;
        }

        .btn { 
            background-color: var(--accent-color); 
            color: white; 
            border: 1px solid var(--neon-blue); 
            padding: 12px; 
            font-family: 'Press Start 2P', cursive; 
            font-size: 10px;
            border-radius: 6px; 
            cursor: pointer; 
            transition: all 0.2s; 
            width: 100%; 
            text-align: center; 
            text-transform: uppercase;
        } 
 
        .btn:hover { 
            background-color: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 10px var(--neon-blue);
        } 
        
        .btn:active {
            transform: scale(0.98);
        }

        select.btn { 
            padding-right: 30px; 
            text-align: left;
        } 

        .start-btn {
            background-color: var(--neon-green);
            color: #000;
            border: none;
            font-size: 12px;
            padding: 15px;
            margin-top: auto;
            animation: pulse 2s infinite;
        }

        .start-btn:hover {
            background-color: #fff;
            color: #000;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 132, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 132, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 132, 0); }
        }
 
        #message-box { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); 
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100; 
            border-radius: 12px;
        } 
 
        #message-box h2 { 
            color: var(--neon-pink); 
            text-shadow: 0 0 10px var(--neon-pink);
            margin-bottom: 20px;
            font-size: 24px;
        } 
 
        #message-box p { 
            margin-bottom: 30px; 
            line-height: 1.5;
            font-family: 'Rajdhani', sans-serif;
            font-size: 20px;
        } 

        .hidden {
            display: none !important;
        }

        .frenzy-alert {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--neon-pink);
            font-size: 12px;
            text-shadow: 0 0 5px red;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        @media (max-width: 850px) { 
            .main-container { 
                flex-direction: column; 
                height: 100vh;
                max-height: none;
                border-radius: 0;
                padding: 10px;
            } 
            .game-area { 
                flex: none;
                width: 100%; 
                aspect-ratio: 1/1;
            } 
            .controls-area { 
                flex: 1;
                width: 100%; 
            } 
        } 
    </style> 
</head> 
<body> 
    <div class="main-container"> 
        <div class="game-area"> 
            <canvas id="gameCanvas"></canvas> 
            <div id="frenzy-msg" class="frenzy-alert">ARENA BERUBAH!</div>
            
            <div id="message-box" class="hidden"> 
                <h2 id="message-title">GAME OVER</h2> 
                <p id="message-text">Skor: 0</p> 
                <button id="close-message-btn" class="btn" style="width: auto; padding: 15px 30px;">Tutup</button> 
            </div> 
        </div> 

        <div class="controls-area"> 
            <div class="info-panel"> 
                <span id="score" class="score-display">000</span> 
                <span id="obstacle-type" class="obstacle-display">Tanpa Rintangan</span> 
            </div> 

            <div class="settings-panel">
                <div>
                    <label for="level-select">Kecepatan (Level)</label> 
                    <select id="level-select" class="btn"> 
                        <option value="1">1 - Siput</option> 
                        <option value="3">3 - Normal</option> 
                        <option value="5">5 - Cepat</option> 
                        <option value="7">7 - Kilat</option> 
                        <option value="9">9 - Dewa</option> 
                    </select> 
                </div>

                <div>
                    <label for="obstacle-select">Peta Awal</label> 
                    <select id="obstacle-select" class="btn"> 
                        <option value="0">0. Kosong</option> 
                        <option value="1">1. Klasik Box</option> 
                        <option value="2">2. Gerbang Ganda</option> 
                        <option value="3">3. Empat Pilar</option> 
                        <option value="4">4. Lorong</option> 
                        <option value="5">5. Labirin Kotak</option> 
                        <option value="6">6. 4 Pojok</option> 
                        <option value="7">7. 4 Salib</option> 
                        <option value="8">8. ZigZag</option> 
                        <option value="9">9. Acak Tersebar</option> 
                    </select> 
                </div>

                <div>
                    <label for="mode-select">Mode Game</label> 
                    <select id="mode-select" class="btn"> 
                        <option value="normal">Normal</option> 
                        <option value="frenzy">FRENZY (Chaos)</option> 
                    </select> 
                </div>
            </div> 

            <button id="startButton" class="btn start-btn">MULAI GAME</button> 
            <button id="restartButton" class="btn start-btn hidden">MAIN LAGI</button> 
        </div> 
    </div> 

    <script> 
        // --- Inisialisasi Variabel ---
        const canvas = document.getElementById('gameCanvas'); 
        const ctx = canvas.getContext('2d'); 
        
        // UI Elements
        const scoreElement = document.getElementById('score'); 
        const obstacleTypeElement = document.getElementById('obstacle-type'); 
        const startButton = document.getElementById('startButton'); 
        const restartButton = document.getElementById('restartButton'); 
        const levelSelect = document.getElementById('level-select'); 
        const obstacleSelect = document.getElementById('obstacle-select'); 
        const modeSelect = document.getElementById('mode-select'); 
        const messageBox = document.getElementById('message-box'); 
        const messageTitle = document.getElementById('message-title'); 
        const messageText = document.getElementById('message-text'); 
        const closeMessageBtn = document.getElementById('close-message-btn'); 
        const frenzyMsg = document.getElementById('frenzy-msg');

        // Game Config
        const gridSize = 20; 
        let tileSize = 0; 
        let gameSpeed = 150; 
        let gameLoopId; 
        
        // Game State
        let snake = []; 
        let food = {}; 
        let bonusFood = null; 
        let starPoint = null; 
        let direction = 'right'; 
        let nextDirection = 'right'; 
        let score = 0; 
        let isGameOver = false; 
        let isPaused = false; 
        let isGameStarted = false; 
        let currentMode = 'normal'; 
        let currentObstacleIndex = 0; 
        let currentObstacle = []; 

        // Touch Control
        let touchStartX = 0; 
        let touchStartY = 0; 

        // Nama Rintangan
        const obstacleNames = [ 
            '0. Kosong', 
            '1. Klasik Box', 
            '2. Gerbang Ganda',
            '3. Empat Pilar',
            '4. Lorong',
            '5. Labirin Kotak',
            '6. 4 Pojok',
            '7. 4 Salib',
            '8. ZigZag',
            '9. Acak Tersebar'
        ]; 

        // --- Logika Rintangan (Updated untuk keamanan Center Spawn) ---
        function generateObstacleLayout(index) {
            let layout = [];
            const center = Math.floor(gridSize / 2);
            const max = gridSize - 1;

            switch(index) {
                case 1: // Klasik Box
                    for (let i = 0; i < gridSize; i++) {
                        layout.push({x: i, y: 0}, {x: i, y: max}, {x: 0, y: i}, {x: max, y: i});
                    }
                    break;
                case 2: // Gerbang Ganda
                    for (let i = 4; i < gridSize-4; i++) {
                        layout.push({x: i, y: 5}, {x: i, y: max-5});
                    }
                    break;
                case 3: // Empat Pilar
                    const pSize = 3;
                    for(let x=2; x<2+pSize; x++) {
                        for(let y=2; y<2+pSize; y++) {
                            layout.push({x:x, y:y}); layout.push({x:max-x, y:y});
                            layout.push({x:x, y:max-y}); layout.push({x:max-x, y:max-y});
                        }
                    }
                    break;
                case 4: // Lorong
                    for (let i = 0; i < gridSize; i++) {
                        if(i < 5 || i > max-5) {
                            layout.push({x: i, y: center-2}, {x: i, y: center+2});
                        }
                    }
                    break;
                
                // UPDATED: Labirin Mini -> Labirin Kotak dengan lorong
                case 5: 
                    const innerMin = 5;
                    const innerMax = 14;
                    // Buat kotak di sekeliling center, tapi tidak di center pas
                    for (let i = innerMin; i <= innerMax; i++) {
                        // Dinding Atas & Bawah (dengan lubang di tengah)
                        if (i !== 9 && i !== 10) {
                            layout.push({x: i, y: innerMin});
                            layout.push({x: i, y: innerMax});
                        }
                        // Dinding Kiri & Kanan (dengan lubang di tengah)
                        if (i !== 9 && i !== 10) {
                            layout.push({x: innerMin, y: i});
                            layout.push({x: innerMax, y: i});
                        }
                    }
                    // Tambahan pilar di pojok dalam untuk variasi
                    layout.push({x: innerMin+2, y: innerMin+2});
                    layout.push({x: innerMax-2, y: innerMin+2});
                    layout.push({x: innerMin+2, y: innerMax-2});
                    layout.push({x: innerMax-2, y: innerMax-2});
                    break;

                // UPDATED: Ruang Tengah -> 4 Pojok
                case 6: 
                    // Blok 3x3 di setiap pojok, tengah bersih
                    for(let x=0; x<3; x++) {
                        for(let y=0; y<3; y++) {
                            layout.push({x: x, y: y}); // Kiri Atas
                            layout.push({x: max-x, y: y}); // Kanan Atas
                            layout.push({x: x, y: max-y}); // Kiri Bawah
                            layout.push({x: max-x, y: max-y}); // Kanan Bawah
                        }
                    }
                    break;

                // UPDATED: Tanda Tambah -> 4 Salib di Sisi
                case 7: 
                    // Koordinat pusat untuk 4 salib kecil
                    const centers = [
                        {cx: 5, cy: 5},    // Kiri Atas
                        {cx: 14, cy: 5},   // Kanan Atas
                        {cx: 5, cy: 14},   // Kiri Bawah
                        {cx: 14, cy: 14}   // Kanan Bawah
                    ];
                    
                    centers.forEach(p => {
                        layout.push({x: p.cx, y: p.cy});     // Pusat salib
                        layout.push({x: p.cx-1, y: p.cy});   // Kiri
                        layout.push({x: p.cx+1, y: p.cy});   // Kanan
                        layout.push({x: p.cx, y: p.cy-1});   // Atas
                        layout.push({x: p.cx, y: p.cy+1});   // Bawah
                    });
                    break;

                case 8: // ZigZag
                    for(let i=0; i<gridSize; i+=4) {
                        for(let j=0; j<center; j++) {
                            layout.push({x: j, y: i});
                            layout.push({x: max-j, y: i+2});
                        }
                    }
                    break;
                case 9: // Acak Tersebar
                    for(let i=0; i<30; i++) {
                        let rx = (i * 7) % gridSize;
                        let ry = (i * 3) % gridSize;
                        // Hindari area spawn radius 2 blok
                        if (Math.abs(rx - 10) > 2 || Math.abs(ry - 10) > 2) {
                           layout.push({x: rx, y: ry});
                        }
                    }
                    break;
                default: 
                    break;
            }
            return layout;
        }

        function setObstacle(index) {
            currentObstacleIndex = index;
            currentObstacle = generateObstacleLayout(index);
            obstacleTypeElement.textContent = obstacleNames[index] || "Kustom";
            
            // Mekanisme keamanan Frenzy Mode
            if (snake.length > 0) {
                currentObstacle = currentObstacle.filter(wall => {
                    return !snake.some(s => s.x === wall.x && s.y === wall.y) && 
                           !(food.x === wall.x && food.y === wall.y) &&
                           !(starPoint && starPoint.x === wall.x && starPoint.y === wall.y) &&
                           !(bonusFood && bonusFood.x === wall.x && bonusFood.y === wall.y);
                });
            }
        }

        // --- Logika Game ---

        function showMessage(title, text) { 
            messageTitle.textContent = title; 
            messageText.textContent = text; 
            messageBox.classList.remove('hidden'); 
            isPaused = true; 
        } 
 
        function hideMessage() { 
            messageBox.classList.add('hidden'); 
            isPaused = false; 
        } 

        function getRandomPosition() { 
            let newPos; 
            let safe = false;
            while (!safe) {
                newPos = { 
                    x: Math.floor(Math.random() * gridSize), 
                    y: Math.floor(Math.random() * gridSize) 
                }; 
                
                const hitSnake = snake.some(s => s.x === newPos.x && s.y === newPos.y);
                const hitWall = currentObstacle.some(w => w.x === newPos.x && w.y === newPos.y);
                const hitFood = (food.x === newPos.x && food.y === newPos.y);
                const hitStar = (starPoint && starPoint.x === newPos.x && starPoint.y === newPos.y);
                const hitBonus = (bonusFood && bonusFood.x === newPos.x && bonusFood.y === newPos.y);

                if (!hitSnake && !hitWall && !hitFood && !hitStar && !hitBonus) {
                    safe = true;
                }
            }
            return newPos; 
        } 

        function placeStarPoint() {
            starPoint = getRandomPosition();
        }

        function tryPlaceBonusFood() {
            if (!bonusFood && Math.random() < 0.2) {
                bonusFood = getRandomPosition();
                setTimeout(() => {
                    bonusFood = null;
                }, 7000);
            }
        }

        // Fungsi spawn ular aman (masih disimpan sebagai cadangan)
        function getSafeInitialSnake() {
            const candidates = [
                { head: {x: 10, y: 10}, body: [{x: 9, y: 10}, {x: 8, y: 10}], dir: 'right' },
                { head: {x: 3, y: 5}, body: [{x: 2, y: 5}, {x: 1, y: 5}], dir: 'right' },
                { head: {x: 5, y: 15}, body: [{x: 4, y: 15}, {x: 3, y: 15}], dir: 'right' }
            ];

            for (let cand of candidates) {
                let collision = false;
                const fullSnake = [cand.head, ...cand.body];
                for (let part of fullSnake) {
                    if (currentObstacle.some(w => w.x === part.x && w.y === part.y)) {
                        collision = true;
                        break;
                    }
                }
                if (!collision) {
                    direction = cand.dir;
                    nextDirection = cand.dir;
                    return fullSnake;
                }
            }
            return [{x: 1, y: 1}, {x: 1, y: 2}, {x: 1, y: 3}]; 
        }

        function drawRect(x, y, color, shadowColor = null) {
            ctx.fillStyle = color;
            if (shadowColor) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = shadowColor;
            } else {
                ctx.shadowBlur = 0;
            }
            ctx.fillRect(x * tileSize + 1, y * tileSize + 1, tileSize - 2, tileSize - 2);
            ctx.shadowBlur = 0; 
        }

        function draw() { 
            // Background
            ctx.fillStyle = '#111'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height); 

            // Grid
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for(let i=0; i<=gridSize; i++) {
                ctx.beginPath();
                ctx.moveTo(i*tileSize, 0); ctx.lineTo(i*tileSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i*tileSize); ctx.lineTo(canvas.width, i*tileSize);
                ctx.stroke();
            }
 
            // Makanan Biasa
            drawRect(food.x, food.y, '#ff0055', '#ff0055'); 

            // Bonus Food
            if (bonusFood) {
                drawRect(bonusFood.x, bonusFood.y, '#bc13fe', '#bc13fe');
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(bonusFood.x * tileSize + 4, bonusFood.y * tileSize + 4, tileSize - 8, tileSize - 8);
            }
 
            // Bintang
            if (starPoint) { 
                ctx.fillStyle = '#FFD700'; 
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#FFFF00';
                
                const blink = Math.floor(Date.now() / 100) % 2;
                if(blink) ctx.fillStyle = '#FFF';

                ctx.beginPath();
                const cx = starPoint.x * tileSize + tileSize/2;
                const cy = starPoint.y * tileSize + tileSize/2;
                ctx.arc(cx, cy, tileSize/2 - 2, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            } 
 
            // Ular 
            snake.forEach((segment, index) => { 
                const color = index === 0 ? '#00fff5' : '#00b8b0'; 
                const shadow = index === 0 ? '#00fff5' : null;
                drawRect(segment.x, segment.y, color, shadow);
                
                if (index === 0) {
                    ctx.fillStyle = '#000';
                    let ex = segment.x * tileSize;
                    let ey = segment.y * tileSize;
                    ctx.fillRect(ex + tileSize/4, ey + tileSize/4, 4, 4);
                    ctx.fillRect(ex + tileSize*0.6, ey + tileSize/4, 4, 4);
                }
            }); 
 
            // Rintangan 
            currentObstacle.forEach(wall => { 
                drawRect(wall.x, wall.y, '#555', null);
                ctx.strokeStyle = '#777';
                ctx.lineWidth = 2;
                ctx.strokeRect(wall.x * tileSize + 1, wall.y * tileSize + 1, tileSize - 2, tileSize - 2);
            }); 
        } 

        function update() { 
            if (isGameOver || isPaused || !isGameStarted) return; 

            direction = nextDirection;

            const head = { ...snake[0] }; 
            switch (direction) { 
                case 'up': head.y--; break; 
                case 'down': head.y++; break; 
                case 'left': head.x--; break; 
                case 'right': head.x++; break; 
            } 
             
            // Cek Tabrakan
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) { 
                gameOver(); 
                return; 
            } 
            if (currentObstacle.some(wall => wall.x === head.x && wall.y === head.y)) {
                gameOver();
                return;
            }
 
            // Teleport
            if (head.x < 0) head.x = gridSize - 1; 
            else if (head.x >= gridSize) head.x = 0; 
            if (head.y < 0) head.y = gridSize - 1; 
            else if (head.y >= gridSize) head.y = 0; 

            // Cek setelah Teleport
            if (currentObstacle.some(wall => wall.x === head.x && wall.y === head.y)) {
                gameOver();
                return;
            }
 
            snake.unshift(head); 

            // Logika Makan
            let ateFood = false;

            if (head.x === food.x && head.y === food.y) { 
                score += 1; 
                food = getRandomPosition(); 
                ateFood = true;
                tryPlaceBonusFood(); 
                if (currentMode === 'frenzy' && score > 0 && score % 100 === 0) {
                    placeStarPoint();
                }
            } 
            else if (bonusFood && head.x === bonusFood.x && head.y === bonusFood.y) {
                score += 5;
                bonusFood = null;
                ateFood = true;
            }
            else if (starPoint && head.x === starPoint.x && head.y === starPoint.y) {
                score += 50;
                starPoint = null;
                ateFood = true;
                
                // Ganti Arena
                let newObstacleIdx;
                do {
                    newObstacleIdx = Math.floor(Math.random() * obstacleNames.length);
                } while (newObstacleIdx === currentObstacleIndex);
                
                setObstacle(newObstacleIdx);
                frenzyMsg.style.opacity = 1;
                setTimeout(() => frenzyMsg.style.opacity = 0, 2000);
                
                if (currentObstacle.some(w => w.x === food.x && w.y === food.y)) {
                    food = getRandomPosition();
                }
            }

            if (!ateFood) { 
                snake.pop(); 
            } 
 
            scoreElement.textContent = score.toString().padStart(3, '0'); 
            draw(); 
        } 

        function gameLoop() {
            update();
            if(!isGameOver) {
                setTimeout(() => {
                    requestAnimationFrame(gameLoop);
                }, gameSpeed);
            }
        }
 
        function gameOver() { 
            isGameOver = true; 
            showMessage("GAME OVER", `Skor Akhir: ${score}`); 
            startButton.classList.remove('hidden'); 
            startButton.textContent = "MAIN LAGI";
            restartButton.classList.add('hidden'); 
        } 
 
        function restartGame() { 
            hideMessage(); 
            isGameOver = false; 
            isGameStarted = true;
            isPaused = false;
            
            score = 0; 
            starPoint = null;
            bonusFood = null;

            const obstacleVal = parseInt(obstacleSelect.value); 
            setObstacle(obstacleVal); 
            
            snake = getSafeInitialSnake();
            
            const levelVal = parseInt(levelSelect.value); 
            gameSpeed = 200 - (levelVal * 15); 
            
            currentMode = modeSelect.value; 
            food = getRandomPosition(); 
            
            updateStatusUI(); 
            
            startButton.classList.add('hidden');
            restartButton.classList.remove('hidden');

            let id = window.setTimeout(function() {}, 0);
            while (id--) {
                window.clearTimeout(id);
            }
            gameLoop();
        } 

        function updateStatusUI() {
            scoreElement.textContent = "000";
            obstacleTypeElement.textContent = obstacleNames[currentObstacleIndex];
            if(currentMode === 'frenzy') {
                scoreElement.style.color = 'var(--neon-pink)';
            } else {
                scoreElement.style.color = 'var(--neon-green)';
            }
        }
 
        // --- Input Controls ---

        function handleInput(key) {
            if (isPaused) return; 
            
            switch (key) { 
                case 'ArrowUp': 
                case 'w':
                    if (direction !== 'down') nextDirection = 'up'; 
                    break; 
                case 'ArrowDown': 
                case 's':
                    if (direction !== 'up') nextDirection = 'down'; 
                    break; 
                case 'ArrowLeft': 
                case 'a':
                    if (direction !== 'right') nextDirection = 'left'; 
                    break; 
                case 'ArrowRight': 
                case 'd':
                    if (direction !== 'left') nextDirection = 'right'; 
                    break; 
            } 
        }

        document.addEventListener('keydown', e => handleInput(e.key)); 
 
        canvas.addEventListener('touchstart', e => { 
            e.preventDefault(); 
            if (isPaused) return; 
            touchStartX = e.touches[0].clientX; 
            touchStartY = e.touches[0].clientY; 
        }, {passive: false}); 
 
        canvas.addEventListener('touchend', e => { 
            e.preventDefault();
            if (isPaused) return; 
            const touchEndX = e.changedTouches[0].clientX; 
            const touchEndY = e.changedTouches[0].clientY; 
            const dx = touchEndX - touchStartX; 
            const dy = touchEndY - touchStartY; 
 
            if (Math.abs(dx) > Math.abs(dy)) { 
                if (dx > 0) handleInput('ArrowRight'); 
                else handleInput('ArrowLeft'); 
            } else { 
                if (dy > 0) handleInput('ArrowDown'); 
                else handleInput('ArrowUp'); 
            } 
        }, {passive: false}); 
 
        startButton.addEventListener('click', restartGame); 
        restartButton.addEventListener('click', restartGame); 
        closeMessageBtn.addEventListener('click', () => {
            hideMessage();
            if(!isGameOver) isPaused = false;
        }); 
 
        function resizeCanvas() { 
            const gameArea = document.querySelector('.game-area'); 
            let size = Math.min(gameArea.clientWidth - 20, gameArea.clientHeight - 20); 
            size = Math.floor(size / gridSize) * gridSize;

            canvas.width = size; 
            canvas.height = size; 
            tileSize = canvas.width / gridSize; 
            
            if(!isGameStarted) draw(); 
        } 
         
        window.addEventListener('load', () => { 
            resizeCanvas(); 
            window.addEventListener('resize', resizeCanvas); 
            
            ctx.fillStyle = '#111';
            ctx.fillRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = '15px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.fillText("PRESS START", canvas.width/2, canvas.height/2);
        }); 
    </script> 
</body> 
</html>
