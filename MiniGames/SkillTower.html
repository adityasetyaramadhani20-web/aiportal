<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SkillTower</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');

        :root {
            --primary: #4facfe;
            --secondary: #00f2fe;
            --frenzy: #ff0844;
            --frenzy-sec: #ffb199;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Poppins', sans-serif;
            touch-action: none;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            color: white;
            text-align: center;
            z-index: 10;
            transition: opacity 0.3s ease, visibility 0.3s;
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .title-box {
            margin-bottom: 2rem;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            filter: drop-shadow(0 0 10px rgba(79, 172, 254, 0.5));
        }

        .frenzy-text {
            background: linear-gradient(to right, var(--frenzy), var(--frenzy-sec));
            -webkit-background-clip: text;
            filter: drop-shadow(0 0 15px rgba(255, 8, 68, 0.7));
        }

        p {
            font-size: 1.2rem;
            margin-top: 5px;
            color: #cbd5e1;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 80%;
            max-width: 300px;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.4s;
        }

        button:hover::before {
            left: 100%;
        }

        button.btn-classic:hover {
            background: var(--primary);
            border-color: var(--secondary);
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
            transform: translateY(-2px);
        }

        button.btn-frenzy {
            border-color: rgba(255, 8, 68, 0.5);
            color: #ffe4e6;
        }

        button.btn-frenzy:hover {
            background: var(--frenzy);
            border-color: var(--frenzy-sec);
            box-shadow: 0 0 25px rgba(255, 8, 68, 0.6);
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.95) !important;
        }

        .hud {
            position: absolute;
            top: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 5;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            padding: 10px 30px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            font-size: 2rem;
            font-weight: 900;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .score-pulse {
            transform: scale(1.2);
            color: var(--secondary);
        }

        #instructions {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            font-size: 1rem;
            color: rgba(255,255,255,0.5);
            animation: pulse 2s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Stat layout for Game Over */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 15px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
        }
        .stat-label { font-size: 0.9rem; color: #94a3b8; }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: white; }

    </style>
</head>
<body>

<div id="game-container">
    <div class="hud hidden" id="hud-layer">
        <div class="score-box" id="score-hud">0</div>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <!-- Start Screen -->
    <div id="start-screen" class="ui-screen">
        <div class="title-box">
            <h1>SKILL TOWER</h1>
            <p>Seberapa tinggi kamu bisa menumpuk?</p>
        </div>
        <div class="btn-group">
            <button class="btn-classic" id="btn-classic">Mode Klasik</button>
            <button class="btn-frenzy" id="btn-frenzy">Mode Frenzy</button>
        </div>
        <div id="instructions">Sentuh layar atau tekan Spasi untuk menjatuhkan blok</div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="ui-screen hidden">
        <div class="title-box">
            <h1 id="go-title">GAME OVER</h1>
        </div>
        
        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-label">Skor Akhir</span>
                <span class="stat-value" id="final-score">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Perfect Drop</span>
                <span class="stat-value" id="final-perfects">0</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-classic" id="btn-restart">Main Lagi</button>
            <button style="background:transparent; border-color:transparent; font-size:1rem; padding: 10px;" id="btn-home">Kembali ke Menu</button>
        </div>
    </div>
</div>

<script>
    /**
     * Konfigurasi Core Game
     */
    const CONFIG = {
        blockHeight: 40,
        initialBlockWidth: 200,
        gravity: 25, // Kecepatan jatuh lebih responsif
        tolerance: 5, // Toleransi pixel untuk "Perfect Drop"
        colors: [
            ['#ff0844', '#ffb199'], // Red Frenzy
            ['#4facfe', '#00f2fe'], // Blue Classic
            ['#43e97b', '#38f9d7'], // Green
            ['#fa709a', '#fee140'], // Pink Yellow
            ['#b224ef', '#7579ff'], // Purple
            ['#f83600', '#f9d423']  // Orange
        ]
    };

    /**
     * State Management
     */
    const state = {
        canvas: null,
        ctx: null,
        width: 0,
        height: 0,
        mode: 'classic', // 'classic' | 'frenzy'
        blocks: [],
        debris: [],
        floatingTexts: [],
        crane: {
            x: 0,
            y: 120, // Posisi Y di layar
            direction: 1,
            speed: 0,
            width: 0,
            colorIdx: 0
        },
        fallingBlock: null,
        score: 0,
        perfects: 0,
        combo: 0,
        cameraY: 0,
        targetCameraY: 0,
        isRunning: false,
        animationFrameId: null,
        
        // Efek
        shakeTime: 0,
        bgColorShift: 0
    };

    // DOM Elements
    const screens = {
        start: document.getElementById('start-screen'),
        gameOver: document.getElementById('game-over-screen'),
        hud: document.getElementById('hud-layer')
    };
    const ui = {
        score: document.getElementById('score-hud'),
        finalScore: document.getElementById('final-score'),
        finalPerfects: document.getElementById('final-perfects'),
        goTitle: document.getElementById('go-title')
    };

    /**
     * Inisialisasi
     */
    function init() {
        state.canvas = document.getElementById('gameCanvas');
        state.ctx = state.canvas.getContext('2d');
        
        resize();
        window.addEventListener('resize', resize);
        
        // Input Listeners
        window.addEventListener('keydown', handleInput);
        state.canvas.addEventListener('mousedown', handleInput);
        state.canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            handleInput(e);
        }, { passive: false });

        // Buttons
        document.getElementById('btn-classic').addEventListener('click', () => startGame('classic'));
        document.getElementById('btn-frenzy').addEventListener('click', () => startGame('frenzy'));
        document.getElementById('btn-restart').addEventListener('click', () => startGame(state.mode));
        document.getElementById('btn-home').addEventListener('click', showMainMenu);
        
        drawBackgroundOnly();
    }

    function resize() {
        state.width = window.innerWidth;
        state.height = window.innerHeight;
        state.canvas.width = state.width;
        state.canvas.height = state.height;
        
        // Adaptasi lebar blok awal berdasarkan layar (Mobile responsif)
        CONFIG.initialBlockWidth = Math.min(250, state.width * 0.6);
        
        if (!state.isRunning && !state.blocks.length) drawBackgroundOnly();
    }

    function showMainMenu() {
        screens.gameOver.classList.add('hidden');
        screens.hud.classList.add('hidden');
        screens.start.classList.remove('hidden');
        drawBackgroundOnly();
    }

    function startGame(mode) {
        state.mode = mode;
        state.score = 0;
        state.perfects = 0;
        state.combo = 0;
        state.blocks = [];
        state.debris = [];
        state.floatingTexts = [];
        state.fallingBlock = null;
        state.cameraY = 0;
        state.targetCameraY = 0;
        state.shakeTime = 0;
        state.bgColorShift = 0;
        
        // Setup Mode
        state.crane.width = CONFIG.initialBlockWidth;
        state.crane.speed = mode === 'classic' ? 4 : 7;
        state.crane.y = 150;
        state.crane.colorIdx = 0;

        // Base Block (Pondasi)
        const baseBlock = {
            x: (state.width / 2) - (CONFIG.initialBlockWidth / 2),
            y: state.height - 100, // Mulai sedikit di atas dasar layar
            width: CONFIG.initialBlockWidth,
            height: CONFIG.blockHeight * 2,
            colorIdx: 0,
            isBase: true
        };
        state.blocks.push(baseBlock);

        updateScoreUI();
        
        screens.start.classList.add('hidden');
        screens.gameOver.classList.add('hidden');
        screens.hud.classList.remove('hidden');
        
        // UI Styling based on mode
        if(mode === 'frenzy') {
            ui.score.style.borderColor = 'rgba(255, 8, 68, 0.5)';
            ui.score.style.boxShadow = '0 0 15px rgba(255, 8, 68, 0.3)';
        } else {
            ui.score.style.borderColor = 'rgba(255, 255, 255, 0.1)';
            ui.score.style.boxShadow = '0 4px 15px rgba(0,0,0,0.3)';
        }

        state.isRunning = true;
        if (state.animationFrameId) cancelAnimationFrame(state.animationFrameId);
        gameLoop();
    }

    function triggerGameOver() {
        state.isRunning = false;
        ui.finalScore.innerText = state.score;
        ui.finalPerfects.innerText = state.perfects;
        
        ui.goTitle.className = state.mode === 'frenzy' ? 'frenzy-text' : '';
        ui.goTitle.innerText = state.mode === 'frenzy' ? 'FRENZY OVER' : 'GAME OVER';
        
        setTimeout(() => {
            screens.gameOver.classList.remove('hidden');
            screens.hud.classList.add('hidden');
        }, 800); // Jeda sebentar agar pemain melihat menara jatuh
    }

    /**
     * Core Game Logic
     */
    function update() {
        // 1. Gerakkan Crane
        if (!state.fallingBlock) {
            state.crane.x += state.crane.speed * state.crane.direction;
            
            const rightLimit = state.width - state.crane.width;
            
            // Pantulan dinding
            if (state.crane.x >= rightLimit) {
                state.crane.x = rightLimit;
                state.crane.direction = -1;
            } else if (state.crane.x <= 0) {
                state.crane.x = 0;
                state.crane.direction = 1;
            }

            // Mode Frenzy: Arah bisa berubah secara acak di tengah jalan
            if (state.mode === 'frenzy' && Math.random() < 0.015) {
                state.crane.direction *= -1;
            }
        }

        // 2. Update Blok Jatuh
        if (state.fallingBlock) {
            state.fallingBlock.y += CONFIG.gravity;

            const topBlock = state.blocks[state.blocks.length - 1];

            // Deteksi Sentuhan dengan top block
            if (state.fallingBlock.y + state.fallingBlock.height >= topBlock.y) {
                resolveCollision(topBlock);
            }
        }

        // 3. Update Debris (Potongan Blok yang jatuh)
        for (let i = state.debris.length - 1; i >= 0; i--) {
            let d = state.debris[i];
            d.y += d.vy;
            d.vy += 1; // gravitasi debris
            d.x += d.vx;
            d.rotation += d.vr;
            
            // Hapus jika keluar layar bawah (mempertimbangkan kamera)
            if (d.y > state.height + state.cameraY) {
                state.debris.splice(i, 1);
            }
        }

        // 4. Update Floating Texts
        for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
            let ft = state.floatingTexts[i];
            ft.y -= 2;
            ft.life -= 0.02;
            if (ft.life <= 0) state.floatingTexts.splice(i, 1);
        }

        // 5. Update Kamera (Mulus)
        if (state.blocks.length > 0) {
            const topBlock = state.blocks[state.blocks.length - 1];
            // Target kamera: posisikan blok teratas di Y = 250px dari atas layar (atau proporsional)
            const idealCameraY = (state.height * 0.5) - topBlock.y;
            
            // Hanya naikkan kamera, jangan pernah menurunkannya
            if (idealCameraY > state.targetCameraY) {
                state.targetCameraY = idealCameraY;
            }
            
            state.cameraY += (state.targetCameraY - state.cameraY) * 0.1;
        }

        // 6. Update Screen Shake
        if (state.shakeTime > 0) state.shakeTime--;
    }

    function resolveCollision(topBlock) {
        let fBlock = state.fallingBlock;
        let diff = fBlock.x - topBlock.x;
        
        // Paskan Y secara presisi
        fBlock.y = topBlock.y - fBlock.height;

        // Cek overlap untuk melihat apakah balok meleset sepenuhnya
        let isOverlapping = (fBlock.x < topBlock.x + topBlock.width && fBlock.x + fBlock.width > topBlock.x);

        if (!isOverlapping) {
            // MISSED COMPLETELY (Meleset total)
            state.shakeTime = 15;
            createDebris(fBlock.x, fBlock.y, fBlock.width, fBlock.height, fBlock.colorIdx, diff > 0 ? 2 : -2);
            state.fallingBlock = null;
            triggerGameOver();
            return;
        }

        if (Math.abs(diff) <= CONFIG.tolerance) {
            // PERFECT DROP (Berlaku untuk kedua mode)
            fBlock.x = topBlock.x; // Snap ke tengah
            fBlock.width = topBlock.width; // Samakan persis
            state.combo++;
            state.perfects++;
            
            // Efek Perfect
            spawnFloatingText(fBlock.x + fBlock.width/2, fBlock.y, "PERFECT!", '#38f9d7');
            state.bgColorShift = Math.min(100, state.bgColorShift + 5);
            
            // Bonus: Lebarkan sedikit jika combo banyak
            if (state.combo >= 3) {
                let expand = 10;
                if (fBlock.width + expand <= CONFIG.initialBlockWidth) {
                    fBlock.x -= expand / 2;
                    fBlock.width += expand;
                    spawnFloatingText(fBlock.x + fBlock.width/2, fBlock.y - 20, "EXPAND!", '#fee140');
                }
            }
            
            landSuccess(fBlock);

        } else if (state.mode === 'frenzy') {
            // SLICED (Terpotong - Hanya untuk Mode Frenzy)
            state.combo = 0;
            let overlap = topBlock.width - Math.abs(diff);
            let debrisX, debrisWidth;

            if (diff > 0) {
                // Jatuh terlalu ke kanan, potong kanan
                debrisX = topBlock.x + topBlock.width;
                debrisWidth = fBlock.width - overlap;
                fBlock.x = topBlock.x + (topBlock.width - overlap); // Geser X ke area overlap
            } else {
                // Jatuh terlalu ke kiri, potong kiri
                debrisX = fBlock.x;
                debrisWidth = fBlock.width - overlap;
                fBlock.x = topBlock.x;
            }
            
            fBlock.width = overlap;
            
            // Buat Debris
            createDebris(debrisX, fBlock.y, debrisWidth, fBlock.height, fBlock.colorIdx, diff > 0 ? 1 : -1);
            
            landSuccess(fBlock);
            
        } else {
            // NORMAL DROP (Mode Klasik - Balok dibiarkan utuh dan menggantung / overhang)
            state.combo = 0;
            // Tidak memotong width atau mengubah posisi X, biarkan mendarat di mana pun ia jatuh asalkan menyentuh balok bawah
            landSuccess(fBlock);
        }
    }

    function landSuccess(block) {
        state.blocks.push(block);
        state.fallingBlock = null;
        
        state.score++;
        updateScoreUI();
        
        // Naikkan kesulitan
        state.crane.colorIdx = (state.crane.colorIdx + 1) % CONFIG.colors.length;
        
        if (state.mode === 'classic') {
            if (state.score % 5 === 0) state.crane.speed += 0.3;
        } else if (state.mode === 'frenzy') {
            state.crane.speed += 0.5;
            // Di mode frenzy, derek perlahan mengecil sendiri
            if (state.score % 3 === 0 && state.crane.width > 30) {
                state.crane.width -= 5;
            }
        }

        // Update crane width to match the new top block
        state.crane.width = block.width;
        
        // Sedikit shake untuk game feel (impact)
        if(state.combo === 0) state.shakeTime = 3; 
    }

    function handleInput(e) {
        if ((e.type === 'keydown' && e.code !== 'Space') || !state.isRunning) return;
        
        // Abaikan jika sedang ada blok jatuh
        if (state.fallingBlock) return;

        spawnBlock();
    }

    function spawnBlock() {
        // Konversi koordinat layar crane ke koordinat dunia
        // Posisi Layar = Posisi Dunia + CameraY
        // Posisi Dunia = Posisi Layar - CameraY
        
        state.fallingBlock = {
            x: state.crane.x,
            y: state.crane.y - state.cameraY, 
            width: state.crane.width,
            height: CONFIG.blockHeight,
            colorIdx: state.crane.colorIdx
        };
    }

    function createDebris(x, y, w, h, colorIdx, dirX) {
        state.debris.push({
            x: x,
            y: y,
            width: w,
            height: h,
            colorIdx: colorIdx,
            vx: dirX * (Math.random() * 2 + 1), // Terlempar ke samping
            vy: -Math.random() * 5,             // Lompat sedikit ke atas
            rotation: 0,
            vr: dirX * (Math.random() * 0.1 + 0.05) // Kecepatan rotasi
        });
    }

    function spawnFloatingText(x, y, text, color) {
        state.floatingTexts.push({
            x: x,
            y: y,
            text: text,
            color: color,
            life: 1.0
        });
    }

    function updateScoreUI() {
        ui.score.innerText = state.score;
        
        // Animasi pop
        ui.score.classList.add('score-pulse');
        setTimeout(() => {
            ui.score.classList.remove('score-pulse');
        }, 150);
    }

    /**
     * Rendering
     */
    function draw() {
        // 1. Gambar Background Dinamis
        drawBackground();

        // Terapkan Screen Shake global
        state.ctx.save();
        if (state.shakeTime > 0) {
            const dx = (Math.random() - 0.5) * state.shakeTime;
            const dy = (Math.random() - 0.5) * state.shakeTime;
            state.ctx.translate(dx, dy);
        }

        // --- LAYER DUNIA (Dipengaruhi Kamera) ---
        state.ctx.save();
        state.ctx.translate(0, state.cameraY);

        // Gambar Base/Tower Blok
        state.blocks.forEach(block => {
            drawBlock(block, block.isBase);
        });

        // Gambar Blok Jatuh
        if (state.fallingBlock) {
            drawBlock(state.fallingBlock, false);
        }

        // Gambar Debris
        state.debris.forEach(d => {
            state.ctx.save();
            // Pindahkan poros ke tengah debris untuk rotasi
            state.ctx.translate(d.x + d.width/2, d.y + d.height/2);
            state.ctx.rotate(d.rotation);
            state.ctx.translate(-(d.x + d.width/2), -(d.y + d.height/2));
            
            drawBlock(d, false);
            
            state.ctx.restore();
        });

        // Gambar Floating Texts
        state.ctx.font = "bold 20px Poppins";
        state.ctx.textAlign = "center";
        state.floatingTexts.forEach(ft => {
            state.ctx.fillStyle = `rgba(255,255,255, ${ft.life})`;
            state.ctx.shadowBlur = 10;
            state.ctx.shadowColor = ft.color;
            state.ctx.fillText(ft.text, ft.x, ft.y);
            state.ctx.shadowBlur = 0; // reset
        });

        state.ctx.restore(); 
        // --- END LAYER DUNIA ---

        // --- LAYER UI / FIXED (Crane) ---
        drawCrane();

        state.ctx.restore(); // Restore shake
    }

    function drawBackground() {
        // Warna akan semakin gelap ke atas berdasarkan jumlah skor
        const heightFactor = Math.min(1, state.score / 50); 
        
        // Base Sky
        const r1 = Math.max(10, 15 - (heightFactor * 15));
        const g1 = Math.max(15, 23 - (heightFactor * 20));
        const b1 = Math.max(30, 42 - (heightFactor * 25));
        
        const gradient = state.ctx.createLinearGradient(0, 0, 0, state.height);
        gradient.addColorStop(0, `rgb(${r1}, ${g1}, ${b1})`); // Atas (Space)
        gradient.addColorStop(1, '#1e293b'); // Bawah (Ground)
        
        state.ctx.fillStyle = gradient;
        state.ctx.fillRect(0, 0, state.width, state.height);
        
        // Grid/Stars effect tipis
        if (heightFactor > 0.3) {
            state.ctx.fillStyle = "rgba(255,255,255,0.05)";
            for(let i=0; i<50; i++) {
                // Posisi bintang pseudo-random berdasarkan index agar statis di layar
                let bx = (Math.sin(i * 12.3) * 0.5 + 0.5) * state.width;
                let by = (Math.cos(i * 32.1) * 0.5 + 0.5) * state.height;
                state.ctx.fillRect(bx, by, 2, 2);
            }
        }
    }

    function drawBackgroundOnly() {
        // Fallback untuk menggambar background saat menu
        const gradient = state.ctx.createLinearGradient(0, 0, 0, state.height);
        gradient.addColorStop(0, '#0f172a'); 
        gradient.addColorStop(1, '#1e293b'); 
        state.ctx.fillStyle = gradient;
        state.ctx.fillRect(0, 0, state.width, state.height);
    }

    function drawBlock(block, isBase) {
        let colors = CONFIG.colors[block.colorIdx % CONFIG.colors.length];
        
        // Mode Frenzy override warna base
        if (state.mode === 'frenzy' && isBase) colors = ['#333', '#111'];
        else if (isBase) colors = ['#334155', '#1e293b'];

        // Gradient Block
        const grad = state.ctx.createLinearGradient(block.x, block.y, block.x + block.width, block.y + block.height);
        grad.addColorStop(0, colors[0]);
        grad.addColorStop(1, colors[1]);
        
        state.ctx.fillStyle = grad;
        
        // Glowing Effect
        if (!isBase) {
            state.ctx.shadowBlur = 10;
            state.ctx.shadowColor = colors[0];
        } else {
            state.ctx.shadowBlur = 0;
        }

        // Draw Main Block
        state.ctx.beginPath();
        state.ctx.roundRect(block.x, block.y, block.width, block.height, isBase ? [8,8,0,0] : 4);
        state.ctx.fill();
        state.ctx.shadowBlur = 0; // Reset
        
        // 3D Highlight/Glass effect (Top reflection)
        state.ctx.fillStyle = "rgba(255,255,255,0.25)";
        state.ctx.beginPath();
        state.ctx.roundRect(block.x, block.y, block.width, 4, [4,4,0,0]);
        state.ctx.fill();
        
        // Border outline tipis
        state.ctx.strokeStyle = "rgba(0,0,0,0.3)";
        state.ctx.lineWidth = 1;
        state.ctx.beginPath();
        state.ctx.roundRect(block.x, block.y, block.width, block.height, isBase ? [8,8,0,0] : 4);
        state.ctx.stroke();
    }

    function drawCrane() {
        // Tali Crane (Titik tumpu di tengah atas layar)
        state.ctx.beginPath();
        state.ctx.moveTo(state.width / 2, -50);
        
        // Hubungkan ke tengah blok crane
        let craneCenterX = state.crane.x + state.crane.width / 2;
        state.ctx.lineTo(craneCenterX, state.crane.y);
        state.ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
        state.ctx.lineWidth = 3;
        state.ctx.stroke();

        // Gambar capit penahan kecil
        state.ctx.fillStyle = "#cbd5e1";
        state.ctx.fillRect(craneCenterX - 10, state.crane.y - 10, 20, 10);

        // Blok di Crane (hanya digambar jika tidak sedang dijatuhkan)
        if (!state.fallingBlock) {
            let craneBlock = {
                x: state.crane.x,
                y: state.crane.y,
                width: state.crane.width,
                height: CONFIG.blockHeight,
                colorIdx: state.crane.colorIdx
            };
            drawBlock(craneBlock, false);
        }
    }

    function gameLoop() {
        if (!state.isRunning) return;
        update();
        draw();
        state.animationFrameId = requestAnimationFrame(gameLoop);
    }

    // Jalankan inisialisasi awal
    init();

</script>
