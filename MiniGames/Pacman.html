<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pacman</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            background-color: #111;
            color: white;
            font-family: 'Press Start 2P', cursive;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Mencegah scroll pada mobile */
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 255, 0.2);
            border: 4px solid #191970;
            background-color: #000;
        }

        canvas {
            display: block;
            /* Perbaikan Responsif: Memastikan kanvas pas di layar tanpa merusak aspect ratio */
            max-width: 95vw;
            max-height: 85vh;
            object-fit: contain;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            box-sizing: border-box;
        }

        .hud-text {
            color: #fff;
            text-shadow: 2px 2px #000;
            font-size: 14px;
            line-height: 1.5;
            z-index: 20;
        }

        #score-display { text-align: left; }
        #level-display { text-align: right; }

        /* Screens (Menu, Game Over) */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 10;
            text-align: center;
        }

        h1 {
            color: #FFD700;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 3px 3px #b8860b;
        }

        .btn {
            background: #191970;
            color: white;
            border: 2px solid #4169E1;
            padding: 15px 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            margin: 10px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            width: 200px;
        }

        .btn:hover {
            background: #4169E1;
            transform: scale(1.05);
        }

        .btn.hardcore {
            border-color: #ff0000;
            background: #500;
        }
        .btn.hardcore:hover {
            background: #900;
        }

        #game-over-screen { display: none; }
        
        /* Mobile Controls Hint */
        .mobile-hint {
            display: none;
            font-size: 10px;
            color: #aaa;
            margin-top: 10px;
        }
        @media (hover: none) and (pointer: coarse) {
            .mobile-hint { display: block; }
        }

        /* Hardcore Mode Fog */
        #fog {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 10%, black 80%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="fog"></div>
        
        <!-- HUD -->
        <div id="ui-layer">
            <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 5px;">
                <div id="score-display" class="hud-text">SKOR: 0</div>
                <div id="high-score-display" class="hud-text" style="color:#aaa">HIGHSCORE: 0</div>
            </div>
            <div style="display: flex; justify-content: space-between; width: 100%;">
                <div id="lives-display" class="hud-text" style="color:#FF1493;">NYAWA: ❤❤❤</div>
                <div id="level-display" class="hud-text">LEVEL: 1</div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>PACMAN<br>THE ARCADE</h1>
            <p style="color: cyan; font-size: 10px; margin-bottom: 20px;">Pacman Klasik dalam bentuk HTML!</p>
            <button class="btn" onclick="startGame('classic')">MODE KLASIK</button>
            <button class="btn hardcore" onclick="startGame('hardcore')">MODE HARDCORE</button>
            <div class="mobile-hint">Swipe layar untuk bergerak</div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen">
            <h1 style="color: red;">GAME OVER</h1>
            <p id="final-score" style="margin-bottom: 20px;">Skor Akhir: 0</p>
            <button class="btn" onclick="showMainMenu()">KE MENU UTAMA</button>
        </div>
    </div>

    <script>
        /**
         * KONFIGURASI & VARIABEL GLOBAL
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score-display');
        const highScoreEl = document.getElementById('high-score-display');
        const levelEl = document.getElementById('level-display');
        const livesEl = document.getElementById('lives-display');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const fogEl = document.getElementById('fog');

        // Ukuran Grid & Tipe Map
        const TILE_SIZE = 24; 
        let COLS, ROWS;
        
        // 10 Pola Kuadran (Seperempat Map). Akan digandakan (mirror) agar simetris.
        // 1 = Dinding, 0 = Jalan (Pellet)
        const Quadrants = [
            // Level 1: Klasik
            [ "11111111111", "10000000001", "10111011101", "10000010000", "10111110111", "10000000001", "11111011101", "00000010000", "11111011100", "00001010000", "11111010000" ],
            // Level 2: Kotak-kotak (Boxy)
            [ "11111111111", "10000000000", "10110110110", "10000000000", "10110110110", "10000000000", "10110110110", "10000000000", "11111010100", "00001010000", "11111010000" ],
            // Level 3: Ruang Tengah Terbuka
            [ "11111111111", "10000000001", "10110111101", "10000000000", "10110100000", "10000100000", "11110100000", "00010100000", "11110101100", "00000001000", "11111101000" ],
            // Level 4: ZigZag
            [ "11111111111", "10000100000", "10110101111", "10100000001", "10101111101", "10001000001", "11101011101", "00000010000", "11111010100", "00001010000", "11111010000" ],
            // Level 5: Persilangan (Crosses)
            [ "11111111111", "10000000000", "10101110111", "10100100000", "10110101101", "10000000101", "11110110101", "10000000000", "10111010100", "10001010000", "11111010000" ],
            // Level 6: Koridor Panjang
            [ "11111111111", "10000000001", "11111111101", "10000000001", "10111111111", "10000000000", "11111111101", "10000000000", "10111010100", "10001010000", "11111010000" ],
            // Level 7: Inti Berlian (Diamond Core)
            [ "11111111111", "10000000000", "10111011111", "10000010001", "11111010101", "10001010101", "10101000101", "10100010000", "10111010100", "10000010000", "11111010000" ],
            // Level 8: Papan Catur (Checkerboard)
            [ "11111111111", "10101010101", "10000000000", "10101010101", "10000000000", "10101010101", "10000000000", "10101010000", "11111010100", "00001010000", "11111010000" ],
            // Level 9: Labirin Sempit (Tight Maze)
            [ "11111111111", "10001000001", "10101011101", "10100010101", "10111110101", "10000000100", "10111110111", "10100000000", "10101010100", "10001010000", "11111010000" ],
            // Level 10: Blok Spiral
            [ "11111111111", "10000000001", "10111111101", "10100000001", "10101111111", "10101000000", "10101011101", "10100010000", "10111110100", "10000010000", "11111010000" ]
        ];

        // State Game
        let gameLoopId;
        let score = 0;
        let highScore = localStorage.getItem('pacman_highscore') || 0;
        let level = 1;
        let lives = 3;
        let mode = 'classic';
        let isGameOver = false;
        let isPaused = false;

        // Entitas
        let map = [];
        let pacman = {};
        let pacmanStartPos = { x: 0, y: 0 };
        let ghosts = [];
        let pellets = [];
        let powerPellets = [];
        let walls = [];

        // Konstanta Warna
        const WALL_COLOR = '#191970';
        const PACMAN_COLOR = '#FFFF00';
        const PELLET_COLOR = '#FFB8AE';
        const POWER_COLOR = '#fff';
        const GHOST_COLORS = ['#FF0000', '#FFB8FF', '#00FFFF', '#FFB852'];

        // Input
        let currentDir = { x: 0, y: 0 }; 
        let nextDir = { x: 0, y: 0 };    

        highScoreEl.innerText = `TERTINGGI: ${highScore}`;

        /**
         * SETUP LABIRIN
         */
        function initGameDimensions() {
            if (level <= 10) {
                // Untuk map spesifik 1-10, ukurannya fix 21x21. Skala ditangani CSS.
                COLS = 21;
                ROWS = 21;
            } else {
                // Untuk map acak level 11+, isi layar sepenuhnya
                let maxWidth = Math.min(window.innerWidth - 20, 600);
                let maxHeight = Math.min(window.innerHeight - 20, 600);
                COLS = Math.floor(maxWidth / TILE_SIZE);
                ROWS = Math.floor(maxHeight / TILE_SIZE);
                if (COLS % 2 === 0) COLS--;
                if (ROWS % 2 === 0) ROWS--;
            }

            canvas.width = COLS * TILE_SIZE;
            canvas.height = ROWS * TILE_SIZE;
        }

        function generateMaze() {
            if (level <= 10) {
                loadPredefinedMap(level - 1);
            } else {
                generateRandomMaze();
            }

            // Memaksa membuat zona aman di tengah (Kandang Hantu)
            forceGhostHouseAndPath();
            
            // Menghapus area terisolasi (bug dari mode random/map)
            cleanupMap(); 
        }

        function loadPredefinedMap(index) {
            let q = Quadrants[index];
            map = [];
            // Mirroring Kuadran untuk membentuk 21x21
            for (let r = 0; r < 21; r++) {
                let row = [];
                let srcR = r < 11 ? r : 20 - r;
                for (let c = 0; c < 21; c++) {
                    let srcC = c < 11 ? c : 20 - c;
                    row.push(parseInt(q[srcR][srcC]));
                }
                map.push(row);
            }
            // Pastikan batas luar benar-benar tertutup (kecuali terowongan tengah jika ada)
            for(let r=0; r<21; r++) { map[r][0] = 1; map[r][20] = 1; }
            for(let c=0; c<21; c++) { map[0][c] = 1; map[20][c] = 1; }
        }

        function generateRandomMaze() {
            map = [];
            for (let r = 0; r < ROWS; r++) {
                let row = [];
                for (let c = 0; c < COLS; c++) row.push(1);
                map.push(row);
            }

            // DFS Random
            let stack = [];
            let startX = 1, startY = 1;
            map[startY][startX] = 0;
            stack.push({ x: startX, y: startY });

            while (stack.length > 0) {
                let current = stack[stack.length - 1];
                let neighbors = [];
                let directions = [
                    { dx: 0, dy: -2 }, { dx: 0, dy: 2 },
                    { dx: -2, dy: 0 }, { dx: 2, dy: 0 }
                ];

                for (let d of directions) {
                    let nx = current.x + d.dx;
                    let ny = current.y + d.dy;
                    if (nx > 0 && nx < COLS - 1 && ny > 0 && ny < ROWS - 1 && map[ny][nx] === 1) {
                        neighbors.push({ x: nx, y: ny, dx: d.dx, dy: d.dy });
                    }
                }

                if (neighbors.length > 0) {
                    let chosen = neighbors[Math.floor(Math.random() * neighbors.length)];
                    map[current.y + chosen.dy / 2][current.x + chosen.dx / 2] = 0;
                    map[chosen.y][chosen.x] = 0;
                    stack.push({ x: chosen.x, y: chosen.y });
                } else {
                    stack.pop();
                }
            }

            // Random Loops
            let wallsToRemove = Math.floor((COLS * ROWS) * 0.1); 
            for (let i = 0; i < wallsToRemove; i++) {
                let rx = Math.floor(Math.random() * (COLS - 2)) + 1;
                let ry = Math.floor(Math.random() * (ROWS - 2)) + 1;
                if (map[ry][rx] === 1) map[ry][rx] = 0;
            }
        }

        function forceGhostHouseAndPath() {
            let midX = Math.floor(COLS / 2);
            let midY = Math.floor(ROWS / 2);
            
            // Buat ruangan tengah 3x3 terbuka
            for(let r = midY - 1; r <= midY + 1; r++) {
                for(let c = midX - 1; c <= midX + 1; c++) {
                    map[r][c] = 0;
                }
            }
            
            // Celah pintu keluar (atas)
            map[midY - 2][midX - 1] = 0; map[midY - 2][midX] = 0; map[midY - 2][midX + 1] = 0;

            // Dinding kandang hantu
            map[midY - 2][midX - 2] = 1; map[midY - 2][midX + 2] = 1;
            map[midY - 1][midX - 2] = 1; map[midY - 1][midX + 2] = 1;
            map[midY][midX - 2] = 1;     map[midY][midX + 2] = 1;
            map[midY + 1][midX - 2] = 1; map[midY + 1][midX + 2] = 1;
            map[midY + 2][midX - 2] = 1; map[midY + 2][midX - 1] = 1; 
            map[midY + 2][midX] = 1;     map[midY + 2][midX + 1] = 1; map[midY + 2][midX + 2] = 1;

            // Pastikan kandang terhubung ke koridor atas (mencegah terkurung di map random)
            for(let i = 1; i < midY - 2; i++) {
                map[i][midX] = 0;
            }
        }

        // Fungsi vital untuk memastikan TIDAK ADA titik pellet yang tidak bisa dijangkau
        function cleanupMap() {
            let midX = Math.floor(COLS / 2);
            let midY = Math.floor(ROWS / 2);
            let visited = Array(ROWS).fill().map(() => Array(COLS).fill(false));
            
            // Mulai dari pintu keluar hantu
            let startR = midY - 2;
            let startC = midX;
            if(map[startR][startC] === 1) { startR = 1; startC = 1; }

            let stack = [{r: startR, c: startC}];
            visited[startR][startC] = true;

            // Telusuri semua area yang bisa dilalui
            while(stack.length > 0) {
                let curr = stack.pop();
                [[0,1], [1,0], [0,-1], [-1,0]].forEach(d => {
                    let nr = curr.r + d[0];
                    let nc = curr.c + d[1];
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                        if (map[nr][nc] === 0 && !visited[nr][nc]) {
                            visited[nr][nc] = true;
                            stack.push({r: nr, c: nc});
                        }
                    }
                });
            }

            // Ubah jalan buntu / terisolasi menjadi dinding
            for(let r=0; r<ROWS; r++) {
                for(let c=0; c<COLS; c++) {
                    if (map[r][c] === 0 && !visited[r][c]) {
                        map[r][c] = 1; 
                    }
                }
            }
        }

        function spawnEntities() {
            walls = [];
            pellets = [];
            powerPellets = [];
            let emptyCells = [];

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (map[r][c] === 1) {
                        walls.push({ x: c * TILE_SIZE, y: r * TILE_SIZE });
                    } else {
                        emptyCells.push({ x: c, y: r });
                        let midX = Math.floor(COLS / 2);
                        let midY = Math.floor(ROWS / 2);
                        // Jangan letakkan titik di dalam kandang hantu
                        if(Math.abs(c - midX) > 2 || Math.abs(r - midY) > 2) {
                            pellets.push({ x: c * TILE_SIZE + TILE_SIZE/2, y: r * TILE_SIZE + TILE_SIZE/2 });
                        }
                    }
                }
            }

            // Tambahkan Power Pellets di ujung-ujung yang tersisa
            const corners = [
                {r:1, c:1}, {r:1, c:COLS-2}, 
                {r:ROWS-2, c:1}, {r:ROWS-2, c:COLS-2}
            ];
            
            corners.forEach(corner => {
                if(map[corner.r] && map[corner.r][corner.c] === 0) {
                   powerPellets.push({ 
                       x: corner.c * TILE_SIZE + TILE_SIZE/2, 
                       y: corner.r * TILE_SIZE + TILE_SIZE/2,
                       active: true
                   });
                   pellets = pellets.filter(p => 
                       Math.abs(p.x - (corner.c * TILE_SIZE + TILE_SIZE/2)) > 1 && 
                       Math.abs(p.y - (corner.r * TILE_SIZE + TILE_SIZE/2)) > 1
                   );
                }
            });

            // Set Titik Mulai Pacman
            let startPos = emptyCells.find(p => p.y > ROWS - 4); 
            if (!startPos) startPos = emptyCells[emptyCells.length - 1];
            
            pacmanStartPos = {
                x: startPos.x * TILE_SIZE + TILE_SIZE / 2,
                y: startPos.y * TILE_SIZE + TILE_SIZE / 2
            };

            resetPositions();
        }

        function resetPositions() {
            pacman = {
                x: pacmanStartPos.x,
                y: pacmanStartPos.y,
                gridX: Math.floor(pacmanStartPos.x / TILE_SIZE),
                gridY: Math.floor(pacmanStartPos.y / TILE_SIZE),
                speed: mode === 'hardcore' ? 3 : 2.5,
                dir: { x: 0, y: 0 },
                nextDir: { x: 0, y: 0 },
                mouthOpen: 0,
                mouthSpeed: 0.2,
                angle: 0,
                poweredUp: false,
                powerTimer: 0
            };

            currentDir = {x:0, y:0};
            nextDir = {x:0, y:0};

            // Spawn Ghosts di tengah
            ghosts = [];
            let ghostCount = 4;
            if (mode === 'hardcore') ghostCount = 5 + Math.floor(level / 2); 

            for (let i = 0; i < ghostCount; i++) {
                ghosts.push({
                    x: (Math.floor(COLS / 2) + (i % 2 === 0 ? 0 : 1)) * TILE_SIZE + TILE_SIZE / 2,
                    y: (Math.floor(ROWS / 2)) * TILE_SIZE + TILE_SIZE / 2,
                    color: GHOST_COLORS[i % GHOST_COLORS.length],
                    originalColor: GHOST_COLORS[i % GHOST_COLORS.length],
                    speed: (mode === 'hardcore' ? 2.2 : 1.8) + (level * 0.1),
                    dir: { x: Math.random() < 0.5 ? 1 : -1, y: 0 },
                    state: 'scatter', 
                    scaredTimer: 0
                });
            }
        }

        /**
         * LOGIKA GAME
         */
        function startGame(selectedMode) {
            mode = selectedMode;
            score = 0;
            level = 1;
            lives = mode === 'hardcore' ? 5 : 3;
            isGameOver = false;
            
            initGameDimensions();
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            if (mode === 'hardcore') {
                fogEl.style.display = 'block';
                document.body.style.backgroundColor = '#000';
            } else {
                fogEl.style.display = 'none';
                document.body.style.backgroundColor = '#111';
            }

            initLevel();
            updateScoreUI();
            updateLivesUI();
            
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            gameLoop();
        }

        function initLevel() {
            levelEl.innerText = `LEVEL: ${level}`;
            initGameDimensions();
            generateMaze();
            spawnEntities();
        }

        function showMainMenu() {
            gameOverScreen.style.display = 'none';
            startScreen.style.display = 'flex';
            fogEl.style.display = 'none';
        }

        function endGame() {
            isGameOver = true;
            if(score > highScore) {
                highScore = score;
                localStorage.setItem('pacman_highscore', highScore);
                highScoreEl.innerText = `TERTINGGI: ${highScore}`;
            }
            finalScoreEl.innerText = `Skor Akhir: ${score} (Level ${level})`;
            gameOverScreen.style.display = 'flex';
        }

        function canMove(x, y, dirX, dirY) {
            let testX = x + dirX * (TILE_SIZE / 2 + 1);
            let testY = y + dirY * (TILE_SIZE / 2 + 1);
            
            let c = Math.floor(testX / TILE_SIZE);
            let r = Math.floor(testY / TILE_SIZE);

            if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
            return map[r][c] === 0;
        }

        function update() {
            if (isGameOver) return;

            // Logika Pacman
            let pacGridX = Math.floor(pacman.x / TILE_SIZE);
            let pacGridY = Math.floor(pacman.y / TILE_SIZE);
            let centerX = pacGridX * TILE_SIZE + TILE_SIZE / 2;
            let centerY = pacGridY * TILE_SIZE + TILE_SIZE / 2;
            let dist = Math.sqrt((pacman.x - centerX)**2 + (pacman.y - centerY)**2);

            if (dist < 4) { 
                let nextRow = pacGridY + nextDir.y;
                let nextCol = pacGridX + nextDir.x;
                if (map[nextRow] && map[nextRow][nextCol] === 0) {
                    pacman.dir = { ...nextDir };
                    if (nextDir.x !== 0) pacman.y = centerY;
                    if (nextDir.y !== 0) pacman.x = centerX;
                }
            }

            if (canMove(pacman.x, pacman.y, pacman.dir.x, pacman.dir.y)) {
                pacman.x += pacman.dir.x * pacman.speed;
                pacman.y += pacman.dir.y * pacman.speed;
                pacman.mouthOpen += pacman.mouthSpeed;
                if (pacman.mouthOpen > 0.25 || pacman.mouthOpen < 0) pacman.mouthSpeed *= -1;
                
                if (pacman.dir.x === 1) pacman.angle = 0;
                else if (pacman.dir.x === -1) pacman.angle = Math.PI;
                else if (pacman.dir.y === -1) pacman.angle = -Math.PI / 2;
                else if (pacman.dir.y === 1) pacman.angle = Math.PI / 2;
            } else {
                pacman.mouthOpen = 0.15;
            }

            // Power Up Timer
            if (pacman.poweredUp) {
                pacman.powerTimer--;
                if (pacman.powerTimer <= 0) {
                    pacman.poweredUp = false;
                    ghosts.forEach(g => {
                        if (g.state === 'frightened') g.state = 'scatter';
                        g.speed = (mode === 'hardcore' ? 2.2 : 1.8) + (level * 0.1); 
                    });
                }
            }

            // Collision Pellet
            for (let i = pellets.length - 1; i >= 0; i--) {
                let p = pellets[i];
                let d = Math.hypot(p.x - pacman.x, p.y - pacman.y);
                if (d < TILE_SIZE / 2) {
                    pellets.splice(i, 1);
                    score += 10;
                    updateScoreUI();
                }
            }

            // Collision Power Pellet
            for (let i = powerPellets.length - 1; i >= 0; i--) {
                let p = powerPellets[i];
                let d = Math.hypot(p.x - pacman.x, p.y - pacman.y);
                if (d < TILE_SIZE / 2) {
                    powerPellets.splice(i, 1);
                    score += 50;
                    pacman.poweredUp = true;
                    pacman.powerTimer = 400; 
                    ghosts.forEach(g => {
                        g.state = 'frightened';
                        g.scaredTimer = 400;
                        g.speed = 1.2;
                        g.dir = { x: -g.dir.x, y: -g.dir.y };
                    });
                    updateScoreUI();
                }
            }

            if (pellets.length === 0 && powerPellets.length === 0) {
                level++;
                score += 1000;
                initLevel();
                return;
            }

            let playerHit = false;

            // Logika Hantu
            ghosts.forEach((ghost, index) => {
                let moveStep = ghost.speed;
                let cx = (Math.floor(ghost.x / TILE_SIZE) * TILE_SIZE) + TILE_SIZE / 2;
                let cy = (Math.floor(ghost.y / TILE_SIZE) * TILE_SIZE) + TILE_SIZE / 2;
                
                let dx = ghost.x - cx;
                let dy = ghost.y - cy;
                let distToCenter = Math.sqrt(dx*dx + dy*dy);
                let movingTowards = (dx * ghost.dir.x < 0) || (dy * ghost.dir.y < 0);
                
                if (movingTowards && distToCenter <= moveStep) {
                    ghost.x = cx;
                    ghost.y = cy;
                    
                    let possibleDirs = [];
                    [{x:0, y:-1}, {x:0, y:1}, {x:-1, y:0}, {x:1, y:0}].forEach(d => {
                        if (d.x === -ghost.dir.x && d.y === -ghost.dir.y) return;
                        let r = Math.floor(ghost.y/TILE_SIZE) + d.y;
                        let c = Math.floor(ghost.x/TILE_SIZE) + d.x;
                        if (map[r] && map[r][c] === 0) {
                            possibleDirs.push(d);
                        }
                    });

                    if (possibleDirs.length === 0) {
                        ghost.dir = { x: -ghost.dir.x, y: -ghost.dir.y };
                    } else {
                        let targetX = pacman.x;
                        let targetY = pacman.y;

                        if (ghost.state === 'frightened') {
                            ghost.dir = possibleDirs[Math.floor(Math.random() * possibleDirs.length)];
                        } else {
                            if (index % 4 === 0) { targetX = pacman.x; targetY = pacman.y; }
                            else if (index % 4 === 1) { targetX = pacman.x + (pacman.dir.x * 4 * TILE_SIZE); targetY = pacman.y + (pacman.dir.y * 4 * TILE_SIZE); }
                            else if (index % 4 === 2) { 
                                if (Math.random() < 0.4) { targetX = Math.random() * canvas.width; targetY = Math.random() * canvas.height; } 
                                else { targetX = pacman.x; targetY = pacman.y; }
                            } else {
                                let distToPac = Math.hypot(ghost.x - pacman.x, ghost.y - pacman.y);
                                if (distToPac > 8 * TILE_SIZE) { targetX = pacman.x; targetY = pacman.y; } 
                                else { targetX = 0; targetY = canvas.height; }
                            }

                            let bestDir = possibleDirs[0];
                            let minDst = Infinity;

                            possibleDirs.forEach(d => {
                                let nextX = cx + d.x * TILE_SIZE;
                                let nextY = cy + d.y * TILE_SIZE;
                                let dst = (nextX - targetX)**2 + (nextY - targetY)**2;
                                if (dst < minDst) {
                                    minDst = dst;
                                    bestDir = d;
                                }
                            });
                            ghost.dir = bestDir;
                        }
                    }

                    ghost.x += ghost.dir.x * (moveStep - distToCenter);
                    ghost.y += ghost.dir.y * (moveStep - distToCenter);

                } else {
                    ghost.x += ghost.dir.x * moveStep;
                    ghost.y += ghost.dir.y * moveStep;
                }

                // Collision Hantu vs Pacman
                let distToPacman = Math.hypot(ghost.x - pacman.x, ghost.y - pacman.y);
                if (distToPacman < TILE_SIZE * 0.8) {
                    if (ghost.state === 'frightened') {
                        score += 200;
                        updateScoreUI();
                        ghost.x = (Math.floor(COLS / 2)) * TILE_SIZE + TILE_SIZE / 2;
                        ghost.y = (Math.floor(ROWS / 2)) * TILE_SIZE + TILE_SIZE / 2;
                        ghost.state = 'scatter';
                        ghost.speed = (mode === 'hardcore' ? 2.2 : 1.8) + (level * 0.1);
                    } else {
                        playerHit = true;
                    }
                }
            });
            
            if (playerHit) {
                lives--;
                updateLivesUI();
                if (lives > 0) {
                    resetPositions();
                } else {
                    endGame();
                }
            }

            if (mode === 'hardcore') {
                fogEl.style.background = `radial-gradient(circle at ${pacman.x}px ${pacman.y}px, transparent 15%, black 60%)`;
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = WALL_COLOR;
            walls.forEach(w => {
                ctx.fillRect(w.x, w.y, TILE_SIZE, TILE_SIZE);
                ctx.strokeStyle = '#3333aa';
                ctx.strokeRect(w.x, w.y, TILE_SIZE, TILE_SIZE);
            });

            ctx.fillStyle = PELLET_COLOR;
            pellets.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.fillStyle = POWER_COLOR;
            if (Math.floor(Date.now() / 200) % 2 === 0) { 
                powerPellets.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            ghosts.forEach(g => {
                let color = g.state === 'frightened' ? '#0000FF' : g.color;
                if(g.state === 'frightened' && pacman.powerTimer < 100 && Math.floor(Date.now()/100)%2===0) {
                     color = '#fff';
                }

                ctx.fillStyle = color;
                
                ctx.beginPath();
                ctx.arc(g.x, g.y - 2, TILE_SIZE/2 - 2, Math.PI, 0);
                ctx.lineTo(g.x + TILE_SIZE/2 - 2, g.y + TILE_SIZE/2 - 2);
                for(let i=1; i<=3; i++) {
                   ctx.lineTo(g.x + TILE_SIZE/2 - 2 - (i * ((TILE_SIZE-4)/3)), g.y + TILE_SIZE/2 - (i%2==0?2:6));
                }
                ctx.lineTo(g.x - TILE_SIZE/2 + 2, g.y + TILE_SIZE/2 - 2);
                ctx.fill();

                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(g.x - 4, g.y - 4, 3, 0, Math.PI * 2);
                ctx.arc(g.x + 4, g.y - 4, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'black';
                
                let eyeDirX = g.dir.x;
                let eyeDirY = g.dir.y;
                
                ctx.beginPath();
                ctx.arc(g.x - 4 + eyeDirX*2, g.y - 4 + eyeDirY*2, 1.5, 0, Math.PI * 2);
                ctx.arc(g.x + 4 + eyeDirX*2, g.y - 4 + eyeDirY*2, 1.5, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.save();
            ctx.translate(pacman.x, pacman.y);
            ctx.rotate(pacman.angle);
            ctx.fillStyle = PACMAN_COLOR;
            ctx.beginPath();
            ctx.arc(0, 0, TILE_SIZE / 2 - 2, 0.2 * Math.PI * pacman.mouthOpen, (2 - 0.2 * pacman.mouthOpen) * Math.PI);
            ctx.lineTo(0, 0);
            ctx.fill();
            ctx.restore();
        }

        function gameLoop() {
            if (!isPaused) {
                update();
                draw();
            }
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function updateScoreUI() {
            scoreEl.innerText = `SKOR: ${score}`;
        }

        function updateLivesUI() {
            let heartString = '❤'.repeat(Math.max(0, lives));
            livesEl.innerText = `NYAWA: ${heartString}`;
        }

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) > -1) {
                e.preventDefault();
            }

            switch (e.key) {
                case 'ArrowUp':
                case 'w': case 'W':
                    nextDir = { x: 0, y: -1 }; break;
                case 'ArrowDown':
                case 's': case 'S':
                    nextDir = { x: 0, y: 1 }; break;
                case 'ArrowLeft':
                case 'a': case 'A':
                    nextDir = { x: -1, y: 0 }; break;
                case 'ArrowRight':
                case 'd': case 'D':
                    nextDir = { x: 1, y: 0 }; break;
            }

            if (currentDir.x === 0 && currentDir.y === 0) {
                let r = Math.floor(pacman.y/TILE_SIZE) + nextDir.y;
                let c = Math.floor(pacman.x/TILE_SIZE) + nextDir.x;
                if(map[r] && map[r][c] === 0) {
                     currentDir = nextDir;
                     pacman.dir = nextDir;
                }
            }
        });

        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: false});

        window.addEventListener('touchmove', e => {
            e.preventDefault(); 
        }, {passive: false});

        window.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            
            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) { 
                    nextDir = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
                }
            } else {
                if (Math.abs(dy) > 30) {
                    nextDir = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
                }
            }
            
            if (currentDir.x === 0 && currentDir.y === 0) {
                 let r = Math.floor(pacman.y/TILE_SIZE) + nextDir.y;
                 let c = Math.floor(pacman.x/TILE_SIZE) + nextDir.x;
                 if(map[r] && map[r][c] === 0) {
                     currentDir = nextDir;
                     pacman.dir = nextDir;
                 }
            }
        });

        window.addEventListener('resize', () => {
            // Karena ukuran sekarang diskalakan dengan aman via CSS, 
            // kita tidak perlu me-reset atau memotong kanvas di tengah permainan
        });

        initGameDimensions();

    </script>
